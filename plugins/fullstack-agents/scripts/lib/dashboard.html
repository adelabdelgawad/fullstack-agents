  return `<details class="info-card" data-info-section="${esc(key)}"${infoShown(c, key, false) ? " open" : ""}><summary>${esc(title)}</summary>${body}</details>`;
}
function infoSection(c, key, title, body, extra = "", open = false) {
  return `<details class="info-card info-top ${esc(key)}" data-info-section="${esc(key)}"${infoShown(c, key, open) ? " open" : ""}><summary><h4>${esc(title)}</h4>${extra}</summary>${body}</details>`;
}

const cardAgents = c => (c.now || []).flatMap(s => (s.agents || []).map(a => ({...a, sid: s.id})))
  .sort((a, b) => (b.state === "running") - (a.state === "running") || b.at - a.at);

function agentTile(a) {
  const [kind, ...rest] = a.label.split(" · ");
  return `<button class="agent${a.state === "running" ? " running" : ""}" data-asid="${esc(a.sid)}" data-agent="${esc(a.id)}" aria-haspopup="dialog" title="${esc(a.label)} — ${esc(a.state)}"><b>${esc(AGENT_NAMES[kind] || kind)}</b><span>${esc(rest.join(" · ") || a.state)}</span></button>`;
}

function shellRun(a, c) {
  const x = a.shell || {}, runs = (c && c.runs) || [];
  return (x.run && runs.find(r => r.id === x.run)) || (x.brief && runs.filter(r => r.unit === x.brief).slice(-1)[0]) || null;
}

const dismissed = (() => { try { return new Set(JSON.parse(localStorage.getItem("fsa-dismissed") || "[]")); } catch (e) { return new Set(); } })();
const isDone = x => !["running", "stalled"].includes(x.state);
const notDismissed = x => !(isDone(x) && dismissed.has(x.id));
function dismiss(ids) {
  ids.forEach(id => dismissed.add(id));
  try { localStorage.setItem("fsa-dismissed", JSON.stringify([...dismissed].slice(-500))); } catch (e) {}
}
const dismissButton = x => x && isDone(x) ? `<button class="action-button dismiss" data-dismiss="${esc(x.id)}" aria-label="Dismiss ${esc(x.unit || x.label || x.id)}">Dismiss</button>` : "";
const factRow = (k, v) => v ? `<dt>${esc(k)}</dt><dd>${esc(v)}</dd>` : "";
const RECENT_S = 900;
const recentRuns = (c, sid) => ((c && c.runs) || []).filter(r => (!sid || !r.session || r.session === sid) && (LIVE(r) || Date.now() / 1000 - (r.updated || 0) < RECENT_S));
const runSession = (r, c) => r.session || (((c && c.now) || [])[0] || {}).id || "";

function factList(c, key, title, items) {
  if (!items || !items.length) return "";
  const open = c && infoShown(c, key, false) ? " open" : "";
  return `<details data-info-section="${esc(key)}"${open}><summary>${esc(title)} (${items.length})</summary><pre>${esc(items.join("\n"))}</pre></details>`;
}

const ownAgents = c => cardAgents(c).filter(a => !(a.shell && shellRun(a, c)));
const launcherOf = (r, c) => cardAgents(c || {}).find(a => a.shell && shellRun(a, c)?.id === r.id) || null;

const goalBox = r => (r.desc || r.goal) ? `<div class="goal" tabindex="0" aria-label="Goal">${esc(r.desc || r.goal)}</div>` : "";

function runFacts(r, c, withGoal = true) {
  const shell = launcherOf(r, c);
  const launched = shell ? [shell.shell.description || shell.id, shell.id, shell.state + (shell.shell.exit != null ? " · exit " + shell.shell.exit : "")].join(" · ") : "";
  const status = [r.state, (r.flags || []).join(", "), r.started ? `started ${ago(r.started)} ago` : "", r.updated ? `updated ${ago(r.updated)} ago` : ""].filter(Boolean).join(" · ");
  return `${withGoal ? goalBox(r) : ""}<dl class="shell-facts">${factRow("Kind", "implementer run (" + (r.mode || "implement") + ")")}${factRow("Target", r.root)}${factRow("Brief", r.unit)}${factRow("Status", status)}${factRow("Agent", [r.engine, r.model].filter(Boolean).join(" · "))}${factRow("Launched by", launched)}${factRow("Run id", r.id)}</dl>${factList(c, "run-files-" + r.id, "Files touched", r.touched)}${factList(c, "run-out-" + r.id, "Outside allowed paths", r.outside)}${factList(c, "run-risks-" + r.id, "Open risks", r.open_risks)}`;
}

const shortPath = p => String(p || "").split("/").filter(Boolean).slice(-2).join("/");
const pillTone = state => ["running", "stalled"].includes(state) ? "live" : /fail|error|kill|stalled/.test(state) ? "bad" : "done";
const statePill = state => `<span class="pill ${pillTone(state)}">${esc(state)}</span>`;
const countBadges = pairs => pairs.filter(([, n]) => n).map(([one, n, tone, many]) => `<span class="pill ${tone || ""}">${n} ${esc(n === 1 ? one : many || one + "s")}</span>`).join("");

function liveCard({running, title, state, time, sub, badges, details, actions, dismissItem}) {
  return `<div class="live-shell${running ? " running" : ""}"><div class="ls-head"><b class="ls-title" title="${esc(title)}">${esc(title)}</b>${statePill(state)}${time ? `<span class="ls-time">${esc(time)}</span>` : ""}</div><div class="ls-sub">${sub}</div>${badges ? `<div class="ls-badges">${badges}</div>` : ""}${details}<div class="ls-actions">${actions}${dismissButton(dismissItem)}</div></div>`;
}

function runCard(c) {
  return r => {
    const sid = esc(runSession(r, c)), shell = launcherOf(r, c);
    const sub = [r.unit ? `<b>${esc(r.unit)}</b>` : "", esc([r.engine, r.model].filter(Boolean).join(" · ")), r.root ? `<span title="${esc(r.root)}">${esc(shortPath(r.root))}</span>` : "", shell ? `via ${esc(shell.id)}` : ""].filter(Boolean).join(" · ");
    const more = `<details data-info-section="run-more-${esc(r.id)}"${infoShown(c, "run-more-" + r.id, false) ? " open" : ""}><summary>Details</summary>${runFacts(r, c, false)}</details>`;
    const actions = `<button class="action-button" data-asid="${sid}" data-agent="${esc(r.id)}" aria-haspopup="dialog">Console</button>${r.root ? `<button class="action-button" data-asid="${sid}" data-run-changes="${esc(r.id)}" aria-haspopup="dialog">Git changes</button>` : ""}<button class="action-button" data-open-run="${esc(r.id)}">Panel</button>`;
    return liveCard({running: LIVE(r), title: r.desc || r.goal || r.unit || r.id, state: r.state, time: r.started ? ago(r.started) : "", sub,
      badges: countBadges([["file", (r.touched || []).length], ["outside brief", (r.outside || []).length, "bad", "outside brief"], ["risk", (r.open_risks || []).length, "warn"]]),
      details: more, actions, dismissItem: r});
  };
}

function shellFacts(a, c) {
  const x = a.shell || {};
  const status = [a.state, x.exit != null ? `exit ${x.exit}` : "", x.started ? `started ${ago(x.started)} ago` : "", `output ${ago(a.at)} ago`].filter(Boolean).join(" · ");
  const agent = x.run ? x.run + " (not listed on this card)" : "none";
  const row = factRow;
  return `<dl class="shell-facts">${row("Kind", x.command ? (x.moved ? "Bash command still running (started in the foreground)" : "background task (run_in_background)") : "")}${row("Target", x.cwd)}${row("Brief", x.brief)}${row("Status", status)}${row("Agent", agent)}${row("Task id", a.id)}</dl>${x.command ? `<details data-info-section="cmd-${esc(a.id)}"${c && infoShown(c, "cmd-" + a.id, false) ? " open" : ""}><summary>Command</summary><pre>${esc(x.command)}</pre></details>` : ""}`;
}

function shellCard(c) {
  return a => {
    const x = a.shell || {}, [, ...rest] = a.label.split(" · ");
    const sub = [x.command ? (x.moved ? "foreground command" : "background task") : "shell", x.cwd ? `<span title="${esc(x.cwd)}">${esc(shortPath(x.cwd))}</span>` : "", x.exit != null ? `exit ${esc(x.exit)}` : ""].filter(Boolean).join(" · ");
    const more = `<details data-info-section="shell-more-${esc(a.id)}"${infoShown(c, "shell-more-" + a.id, false) ? " open" : ""}><summary>Details</summary>${shellFacts(a, c)}</details>`;
    return liveCard({running: a.state === "running", title: x.description || rest.join(" · ") || a.id, state: a.state, time: x.started ? ago(x.started) : "", sub,
      badges: "", details: more, actions: `<button class="action-button" data-asid="${esc(a.sid)}" data-agent="${esc(a.id)}" aria-haspopup="dialog">Console</button>`, dismissItem: a});
  };
}

function liveGroup(title, items, tile, cls) {
  if (!items.length) return "";
  const running = items.filter(x => x.state === "running").length;
  const count = ` <span class="chip">${running} running${items.length > running ? ` · ${items.length - running} recent` : ""}</span>`;
  return `<div class="live-group"><h5>${esc(title)}${count}</h5><div class="${cls}" tabindex="0" role="region" aria-label="${esc(title)}; scroll sideways for more">${items.map(tile).join("")}</div></div>`;
}

const flowRuns = c => (c.workflow_runs || []).map(r => ({...r, id: r.run_id}))
  .filter(r => r.state === "running" || Date.now() / 1000 - (r.updated || 0) < RECENT_S);
const liveAgents = c => { const flows = new Set((c.workflow_runs || []).map(r => r.run_id)); return ownAgents(c).filter(a => !flows.has(a.id)); };

function agentCard(a) {
  const [kind, ...rest] = a.label.split(" · "), name = AGENT_NAMES[kind] || kind;
  const actions = `<button class="action-button" data-asid="${esc(a.sid)}" data-agent="${esc(a.id)}" aria-haspopup="dialog">Console</button>`;
  const who = rest.join(" · ") || name;
  return liveCard({running: a.state === "running", title: a.task || who, state: a.state, time: ago(a.at),
    sub: [a.task ? `<b>${esc(who)}</b>` : "", esc(name), esc(a.state === "running" ? "working" : `finished ${ago(a.at)} ago`)].filter(Boolean).join(" · "), badges: "", details: "", actions, dismissItem: a});
}

function flowCard(c) {
  return r => {
    const verdict = r.verdict ? `<span class="pill ${/^(PASS|GREEN)$/.test(r.verdict) ? "live" : "warn"}">${esc(r.verdict)}</span>` : "";
    const sub = [esc([r.engine, r.model].filter(Boolean).join(" · ")), r.root ? `<span title="${esc(r.root)}">${esc(shortPath(r.root))}</span>` : ""].filter(Boolean).join(" · ");
    const facts = `<dl class="shell-facts">${factRow("Role", r.role)}${factRow("Target", r.root)}${factRow("Verdict", r.verdict)}${factRow("Started", r.started ? new Date(r.started * 1000).toLocaleString() : "")}${factRow("Report", r.artifact)}${factRow("Run id", r.run_id)}</dl>${factList(c, "flow-sum-" + r.run_id, "Summary", r.summary ? [r.summary] : [])}${factList(c, "flow-brief-" + r.run_id, "Brief", r.brief ? [r.brief] : [])}`;
    const more = `<details data-info-section="flow-more-${esc(r.run_id)}"${infoShown(c, "flow-more-" + r.run_id, false) ? " open" : ""}><summary>Details</summary>${facts}</details>`;
    return liveCard({running: r.state === "running", title: r.summary || `${r.role || "run"} run`, state: r.state, time: r.started ? ago(r.started) : "",
      sub: `<b>${esc(r.role || "run")}</b> · ${sub}`, badges: verdict, details: more, actions: `<button class="action-button" data-open-flow="${esc(r.run_id)}">Panel</button>`, dismissItem: r});
  };
}

function liveSets(c) {
  return {agents: liveAgents(c).filter(notDismissed), flows: flowRuns(c).filter(notDismissed),
    runs: recentRuns(c).filter(notDismissed).sort((a, b) => LIVE(b) - LIVE(a) || (b.updated || 0) - (a.updated || 0))};
}
const liveTotal = ({agents, runs, flows}) => agents.filter(a => a.state === "running").length + runs.filter(LIVE).length + flows.filter(r => r.state === "running").length;
function liveHtml(c) {
  const sets = liveSets(c), {agents, flows, runs} = sets, shell = a => a.label.startsWith("shell");
  const lead = s => `<div class="live-lead"><span class="pill ${s.state === "working" ? "live" : ""}">${esc(STATE_TEXT[s.state] || s.state)}</span> <b>${esc(s.name)}</b>${s.action ? `<div class="s lead-act" title="${esc(toolLine(s))}">${esc(toolLine(s).replace(/\\n|\s+/g, " "))}</div>` : ""}${s.question ? `<div class="ask-q">Question for you (it keeps working meanwhile): ${esc(s.question)}</div>` : ""}</div>`;
  const total = liveTotal(sets);
  const done = [...runs, ...flows, ...agents].filter(isDone).length;
  const groups = [liveGroup("Implementer runs", runs.map(r => ({...r, state: LIVE(r) ? "running" : r.state})), runCard(c), "live-shells runs"),
    liveGroup("Workflow runs", flows, flowCard(c), "live-shells flows"),
    liveGroup("Subagents", agents.filter(a => !shell(a)), agentCard, "live-shells agents"),
    liveGroup("Background shells", agents.filter(shell), shellCard(c), "live-shells shells")].join("");
  const clear = done ? `<button class="action-button" data-dismiss-all="1">Dismiss all done (${done})</button>` : "";
  return infoSection(c, "live", "Running now", `<div class="live-top"><div>${(c.now || []).map(lead).join("")}</div>${clear}</div>
    ${groups || '<div class="s">Nothing running or recently finished.</div>'}`, `<span class="chip">${total} running</span>`, true);
}

function taskStatusLabel(status) {
  return ({pending: "Pending", in_progress: "In progress", running: "In progress", blocked: "Blocked", done: "Done", skipped: "Skipped", canceled: "Canceled"})[status] || "Unknown";
}
function taskIsActive(item) {
  return item.is_active === true && Date.parse(item.active_until) > Date.now();
}
function taskStatusIcon(status, active = false) {
  const paths = {
    pending: '<circle cx="12" cy="12" r="8"/><path d="M12 7v5l3 2"/>',
    in_progress: '<path d="M20 12a8 8 0 1 1-3-6.2M20 4v5h-5"/>',
    blocked: '<path d="m8 3-5 5v8l5 5h8l5-5V8l-5-5ZM12 8v5m0 3h.01"/>',
    done: '<circle cx="12" cy="12" r="9"/><path d="m8 12 3 3 5-6"/>',
    skipped: '<path d="m5 5 9 7-9 7ZM18 5v14"/>',
    canceled: '<circle cx="12" cy="12" r="9"/><path d="m9 9 6 6m0-6-6 6"/>'
  };
  const canonical = status === "running" ? "in_progress" : status;
  const label = taskStatusLabel(status) + (active ? " — actively executing (agent-reported)" : "");
  return `<span class="task-status-icon ${esc(canonical)}${active ? ' executing' : ''}" role="img" aria-label="${esc(label)}" title="${esc(label)}"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false">${paths[canonical] || paths.pending}</svg></span>`;
}
function taskProgressHtml(c, compact = false) {
  const sessions = (c.sessions || []).filter(s => s.task_tracking && Object.keys(s.task_tracking).length);
  if (!sessions.length) return "";
  return sessions.map(s => {
    const t = s.task_tracking;
    if (t.error) return `<div class="task-overview task-error" role="alert">Task list needs attention: ${esc(t.error)}</div>`;
    const counts = `${t.items.filter(taskIsActive).length} actively executing · ${t.counts.in_progress ?? t.counts.running ?? 0} in progress · ${t.counts.pending || 0} pending · ${t.counts.blocked || 0} blocked`;
    const active = t.items.filter(taskIsActive);
    const percent = t.total ? Math.round(t.completed / t.total * 100) : 0;
    const timeline = compact ? "" : `<ol class="task-stage-timeline" aria-label="Task stage timeline">${t.items.map(x => `<li class="${esc(x.status)}" title="${esc(x.id + ': ' + x.title + ' — ' + taskStatusLabel(x.status))}" aria-label="${esc(x.id + ': ' + x.title + ' — ' + taskStatusLabel(x.status))}"><span aria-hidden="true">${taskStatusIcon(x.status, taskIsActive(x))}</span><small>${esc(x.id)}</small></li>`).join("")}</ol>`;
    return `<section class="task-overview ${compact ? "compact" : "session-task-overview"}" aria-label="Task progress"><div class="task-progress-title"><b>${esc(t.completed)}/${esc(t.total)} tasks done</b><span>${percent}%</span></div><progress max="${esc(Math.max(t.total, 1))}" value="${esc(t.completed)}" aria-label="Completed tasks"></progress><div class="s">${esc(counts)}</div>${compact && active.length ? `<div class="s task-current">${esc(active[0].id + ': ' + active[0].title)}${active.length > 1 ? ` · +${active.length - 1} active` : ""}</div>` : ""}${timeline}</section>`;
  }).join("");
}

function taskListHtml(c) {
  const sessions = (c.sessions || []).filter(s => s.task_tracking && Object.keys(s.task_tracking).length);
  if (!sessions.length) return "";
  const body = sessions.map(s => {
    const t = s.task_tracking;
    if (t.error) return `<div role="alert" class="snip"><b>${esc(s.name || s.id)}</b>: ${esc(t.error)}</div>`;
    const count = k => t.counts[k] ?? (k === "in_progress" ? t.counts.running : 0) ?? 0;
    const tiles = ["in_progress", "blocked", "pending", "done", "skipped", "canceled"].filter(k => count(k) || ["in_progress", "blocked", "pending", "done"].includes(k))
      .map(k => `<div class="tt-tile ${esc(k)}" title="${esc(taskStatusLabel(k))}">${taskStatusIcon(k)}<div><div class="so-l">${esc(taskStatusLabel(k))}</div><div class="tt-n">${esc(count(k))}</div></div></div>`).join("");
    const order = {in_progress: 0, running: 0, blocked: 1, pending: 2, done: 3, skipped: 4, canceled: 5};
    const sorted = [...t.items].sort((a, b) => Number(taskIsActive(b)) - Number(taskIsActive(a)) || order[a.status] - order[b.status]);
    const source = `/api/doc?sid=${encodeURIComponent(s.id)}&path=${encodeURIComponent(t.file)}`;
    const percent = t.total ? Math.round(t.completed / t.total * 100) : 0;
    const row = x => {
      const st = x.status === "running" ? "in_progress" : x.status, live = taskIsActive(x);
      return `<li class="tracked-task ${esc(st)}${live ? " executing" : ""}">${taskStatusIcon(x.status, live)}<div class="tt-main"><div class="tt-top"><b>${esc(x.id)}</b><span class="tt-title">${esc(x.title)}</span><span class="tt-badges">${live ? '<span class="tt-badge live" title="Agent-reported activity expires automatically; it is separate from process detection">Actively executing</span>' : ""}<span class="tt-badge ${esc(st)}">${esc(taskStatusLabel(x.status))}</span></span></div>
        <div class="s task-activity"><span class="tt-owner">${esc(x.owner || "Unassigned")}</span>${x.activity ? ` · ${esc(x.activity)}` : ""}</div>${x.note ? `<div class="s tt-note">${esc(x.note)}</div>` : ""}</div></li>`;
    };
    return `<article class="tracked-plan"><div class="tp-head"><div class="tp-title"><b>${esc(t.title)}</b><a class="tp-file" href="${esc(source)}" target="_blank" rel="noopener">${esc(t.relative_file)}</a></div><div class="tp-done"><b>${esc(t.completed)}/${esc(t.total)} done</b><span>${percent}%</span></div></div>
      <progress max="${esc(Math.max(t.total, 1))}" value="${esc(t.completed)}" aria-label="Completed tasks"></progress><div class="task-counts">${tiles}</div><ul class="tracked-tasks" tabindex="0" aria-label="Tasks; scroll for more">${sorted.map(row).join("")}</ul></article>`;
  }).join("");
  const ok = sessions.map(s => s.task_tracking).filter(t => !t.error), doneN = ok.reduce((n, t) => n + (t.completed || 0), 0), allN = ok.reduce((n, t) => n + (t.total || 0), 0);
  return infoSection(c, "task-list", "Tasks", body, allN ? `<span class="chip">${doneN}/${allN} done</span>` : "");
}

function infoHtml(c) {
  const tasks = c.runs.map(r => {
    const open = openRun === r.id;
    return `<li class="task${open ? " open" : ""}" data-run="${esc(r.id)}">
      <input type="checkbox" disabled ${r.state === "done" ? "checked" : ""} aria-label="${esc(r.state)}">
      <div class="th"><span class="tn">${esc(r.unit || r.id)}</span> ${stateChip(r)} <span class="s">${LIVE(r) ? `<span class="live-dot"></span>running ${dur(r)}` : `took ${dur(r)} · ${ago(r.updated)} ago`}</span><span class="caret">${open ? "▾" : "▸"}</span></div>
      ${r.goal ? `<div class="snip tg">${esc(r.goal)}</div>` : ""}
      ${open ? detailHtml(r) : ""}</li>`;
  }).join("");
  const sessions = c.sessions || [], now = c.now || [];
  const lead = sessions.find(s => s.name === c.title) || sessions[0] || now[0] || {};
  const engineName = e => e === "codex" ? "Codex" : e === "claude" ? "Claude" : e || "Agent";
  const runs = [...(c.workflow_runs || [])].sort((a, b) => a.updated - b.updated);
  const audit = runs.filter(r => r.role === "auditor").slice(-1)[0];
  const activity = [...now].sort((a, b) => b.updated - a.updated)[0] || lead;
  const message = [...now].filter(s => s.said_full || s.said).sort((a, b) => (b.said_at || b.updated) - (a.said_at || a.updated))[0];
  const status = sessions.some(s => ["waiting", "blocked"].includes(s.state)) ? "blocked" : sessions.some(s => s.state === "working") ? "working" : c.phase === "complete" ? "done" : STATE_TEXT[activity.state] || activity.state || "unknown";
  const stamp = t => t ? new Date(t * 1000).toLocaleString() : "Time not recorded";
  const history = sessions.flatMap(s => s.workflow_history || []).sort((a, b) => a.timestamp - b.timestamp);
  const auditor = audit ? [engineName(audit.engine), audit.model || "model not recorded"].join(" · ") : lead.workflow_auditor ? "Claude · " + lead.workflow_auditor + " (selected; no audit recorded)" : "No audit recorded";
  const timeline = events => `<ol class="info-timeline">${events.map(e => `<li><b>${esc(e.phase)}</b> <time>${esc(stamp(e.timestamp))}</time>${e.note ? `<div class="s">${esc(e.note)}</div>` : ""}</li>`).join("")}</ol>`;
  const leadChecks = (lead.workflow_checks || []).length ? `<div class="snip"><b>Lead-reported checks</b><pre>${esc(lead.workflow_checks.join("\n"))}</pre></div>` : "";
  const desc = c.desc || c.goal;
  const registered = runs.map(r => `<article class="info-run"><b>${esc(r.role)}</b> · ${esc(engineName(r.engine))} · ${esc(r.model || "model not recorded")} <span class="chip">${esc(r.state)}</span>${r.verdict ? " · " + esc(r.verdict) : ""}<div class="s">${esc(stamp(r.updated))}</div>${r.summary ? `<div class="snip">${esc(r.summary.slice(0, 320))}</div>${infoDisclosure(c, "run-" + r.run_id, "Full run summary", `<pre>${esc(r.summary)}</pre>`)}` : ""}${r.brief ? infoDisclosure(c, "brief-" + r.run_id, "Brief", `<pre>${esc(r.brief)}</pre>`) : ""}<div class="s">Run ${esc(r.run_id)}</div></article>`).join("");
  const checks = (c.chips || []).filter(x => x.kind === "tests").map(x => `<div class="snip"><b>Worker-reported checks</b> ${esc(x.verdict)}${x.label ? " · " + esc(x.label) : ""}</div>`).join("") + [...runs, ...(c.runs || [])].filter(r => r.tests?.length).map(r => `<div class="snip"><b>Worker-reported checks</b><pre>${esc(JSON.stringify(r.tests, null, 2))}</pre></div>`).join("");
  const blockers = [...(c.needs_you || []).map(f => FLAG_TEXT[f] || f), ...now.filter(s => s.need).map(s => s.need), ...(c.runs || []).flatMap(r => r.open_risks || [])];
  const need = new Set(blockers).size, phase = lead.workflow_phase || c.phase || "unknown";
  const tracked = sessions.map(s => s.task_tracking).filter(t => t && !t.error && t.total);
  const doneN = tracked.reduce((n, t) => n + t.completed, 0), allN = tracked.reduce((n, t) => n + t.total, 0);
  const tone = {working: "live", blocked: "bad", done: "done"}[status] || "";
  const tile = (label, value, cls = "", extra = "") => `<div class="so-tile ${cls}"><div class="so-l">${esc(label)}</div><div class="so-v">${esc(value)}</div>${extra}</div>`;
  const u = c.usage, ctx = u ? `${Math.round(u.fill * 100)}%${u.compactions ? ` · ${u.compactions}×` : ""}` : "—";
  const overview = `<section class="session-overview" aria-label="Session overview"><div class="so-head"><span class="so-ico" aria-hidden="true"></span><b>Session health</b><span class="pill ${tone}">${esc(status)}</span><span class="so-right">${need ? `<span class="pill bad">${need} need${need === 1 ? "s" : ""} you</span>` : ""}<span class="pill">${esc(phase)}</span></span></div>
    <div class="so-tiles">${tile("Phase", phase)}${tile("Tasks done", allN ? `${doneN}/${allN}` : "—", "", allN ? `<div class="so-bar" aria-hidden="true"><span style="width:${Math.round(doneN / allN * 100)}%"></span></div>` : "")}${tile("Running now", liveTotal(liveSets(c)), "live")}${tile("Needs you", need, need ? "bad" : "")}${tile("Context", ctx, u && u.blowout ? "bad" : "", u ? `<div class="so-bar" aria-hidden="true"><span style="width:${Math.round(u.fill * 100)}%"></span></div>` : "")}${tile("Est. cost", fmtCost(u && u.cost))}${tile("Tokens / min", fmtTokens(u && u.tpm))}${tile("Latest activity", stamp(activity.updated || c.updated), "time")}</div></section>`;
  return `<div class="info-grid">
    ${overview}
    ${taskProgressHtml(c)}
    ${workersSection(c)}
    ${activitySection(c)}
    <div class="session-activity">${liveHtml(c)}</div>
    ${infoSection(c, "summary", "Summary", `<b>${esc(c.title)}</b><dl class="info-facts"><dt>State</dt><dd>${esc(status)}</dd><dt>Phase</dt><dd>${esc(lead.workflow_phase || c.phase || "unknown")}</dd><dt>Lead</dt><dd>${esc(engineName(lead.engine))}${lead.model ? " · " + esc(lead.model) : ""}</dd><dt>Auditor</dt><dd>${esc(auditor)}</dd><dt>Latest activity</dt><dd>${esc(stamp(activity.updated || c.updated))}</dd></dl>`)}
    ${infoSection(c, "progress", "Progress", `${history.length ? timeline(history.slice(-8)) + (history.length > 8 ? infoDisclosure(c, "history", "Earlier phase history", timeline(history.slice(0, -8))) : "") : '<div class="s">No phase history recorded.</div>'}${activity.action ? `<div class="snip"><b>${activity.action_running ? "Running now" : "Latest action"}</b> ${esc(activity.action)}</div>` : ""}${c.steps?.length ? stepsHtml(c) : ""}${c.declared?.note ? `<div class="snip">${esc(c.declared.note)}</div>` : ""}`)}
    ${infoSection(c, "result", "Result", `${lead.workflow_summary ? `<div class="snip"><b>Lead-reported summary</b><pre>${esc(lead.workflow_summary)}</pre></div>` : message ? `<div class="snip">${esc(lastPara(message.said || message.said_full).slice(0, 400))}</div>${infoDisclosure(c, "message", "Full message from " + engineName(message.engine), `<button class="copy-ico" data-said="${esc(message.id)}" aria-label="Copy the last message">${COPY_ICON}</button>${saidHtml(message)}`)}` : '<div class="s">No agent update recorded.</div>'}<div class="snip"><b>Audit</b> ${audit ? esc(audit.state) + (audit.verdict ? " · " + esc(audit.verdict) : " · no verdict recorded") : "No registered audit result."}</div>${leadChecks}${checks}${blockers.length ? `<div class="snip"><b>Blockers / needs you</b><ul>${[...new Set(blockers)].map(x => `<li>${esc(x)}</li>`).join("")}</ul></div>` : ""}`)}
    ${infoDisclosure(c, "session", "Session details", (now.length ? now : sessions).map(resumeHtml).join("") + runs.map(r => `<div class="mono">${esc(r.run_id)} · ${esc(r.root || "")} · ${esc(r.artifact || "")}</div>`).join("") + `<div class="mono">${esc(c.worktree || c.repo || "")}</div>` + now.map(s => `<div class="s">Pane: ${esc(((state && state.session_panes) || {})[s.id] || "not recorded")}</div>`).join(""))}
    ${infoDisclosure(c, "runs", "Worker and audit runs", (desc ? infoDisclosure(c, "task-brief", "Task brief", `<pre>${esc(desc)}</pre>`) : "") + registered + (tasks ? `<ul class="tasks">${tasks}</ul>` : "") + (!runs.length && !tasks ? '<div class="s">No run records available.</div>' : ""))}
    ${taskListHtml(c)}
  </div>`;
}

async function pollLog(id) {
  if (document.hidden) return;
  try {
    const t = await (await fetch("/api/log?id=" + enc(id), {cache: "no-store"})).text();
    if (openRun !== id || !showLog || t === logSeen) return;
    logSeen = t || "(log is empty)";
    paintPanel();
  } catch (e) {}
}

function stopLog() { clearInterval(logTimer); logTimer = null; }

function fitTaskLists() {
  document.querySelectorAll("#info .tracked-tasks").forEach(list => {
    const height = [...list.children].slice(0, 10).reduce((sum, row) => sum + row.getBoundingClientRect().height, 0);
    if (height > 0) list.style.maxHeight = Math.ceil(height) + "px";
  });
}

function wireInfo(c) {
  fitTaskLists();
  document.querySelectorAll("#info [data-info-section]").forEach(el => {
    el.ontoggle = () => {
      if (!el.isConnected) return;
      const keys = infoOpen.get(c.key) || new Map();
      keys.set(el.dataset.infoSection, el.open);
      infoOpen.set(c.key, keys);
      fitTaskLists();
    };
  });
  document.querySelectorAll("#info .task").forEach(li => li.onclick = ev => { if (!ev.target.closest(".detail")) toggleTask(li.dataset.run); });
  const lb = document.querySelector("#info [data-log]");
  if (lb) lb.onclick = ev => { ev.stopPropagation(); showLog = !showLog; logSeen = ""; stopLog(); paintPanel(); };
  document.querySelectorAll("#info [data-agent]").forEach(el => el.onclick = ev => { ev.preventDefault(); openAgent(el.dataset.asid, el.dataset.agent); });
  document.querySelectorAll("#info [data-run-changes]").forEach(el => el.onclick = ev => { ev.preventDefault(); openAgent(el.dataset.asid, el.dataset.runChanges, "changes"); });
  document.querySelectorAll("#info [data-dismiss]").forEach(el => el.onclick = ev => { ev.preventDefault(); ev.stopPropagation(); dismiss([el.dataset.dismiss]); repaintAll(); });
  const all = document.querySelector("#info [data-dismiss-all]");
  if (all) all.onclick = ev => { ev.preventDefault(); dismiss([...recentRuns(c), ...flowRuns(c), ...liveAgents(c)].filter(isDone).map(x => x.id)); repaintAll(); };
  document.querySelectorAll("#info [data-open-flow]").forEach(el => el.onclick = ev => { ev.preventDefault(); const d = document.querySelector('#info [data-info-section="runs"]'); if (d) { d.open = true; d.scrollIntoView({block: "nearest"}); } });
  document.querySelectorAll("#info [data-open-run]").forEach(el => el.onclick = ev => { ev.preventDefault(); showRunLog(el.dataset.openRun); });
  const cb = document.querySelector("#info [data-collapse]");
  if (cb) cb.onclick = ev => { ev.stopPropagation(); toggleTask(openRun); };
}

function paintInfo(c) {
  if (openRun && !c.runs.some(x => x.id === openRun)) { openRun = null; showLog = false; stopLog(); }
  ensureBody("info", '<div id="info"></div>');
  const currentInfo = document.getElementById("info");
  if (currentInfo?.dataset.card === c.key) {
    infoOpen.set(c.key, new Map([...currentInfo.querySelectorAll("[data-info-section]")].map(el => [el.dataset.infoSection, el.open])));
  }
  if (setIfChanged("info", infoHtml(c))) wireInfo(c);
  if (currentInfo) currentInfo.dataset.card = c.key;
  const r = openRun && c.runs.find(x => x.id === openRun);
  if (!r || !showLog) return stopLog();
  if (LIVE(r)) {
    wasLive = true;
    if (!logTimer) { pollLog(r.id); logTimer = setInterval(() => pollLog(r.id), 2500); }
  } else {
    stopLog();
    if (wasLive || !logSeen) { wasLive = false; pollLog(r.id); }
  }
}

function toggleTask(id) {
  openRun = openRun === id ? null : id;
  showLog = false;
  logSeen = "";
  wasLive = false;
  stopLog();
  paintPanel();
}

const stc = s => s === "?" ? "U" : s;
const diffHtml = t => (t || "").split("\n").map(l => `<span class="${l.startsWith("+") && !l.startsWith("+++") ? "a" : l.startsWith("-") && !l.startsWith("---") ? "d" : l.startsWith("@@") ? "h" : ""}">${esc(l) || "&#8203;"}</span>`).join("");

function col1Html(c) {
  if (git.hide1) return '<button class="rail" data-show="1" title="Show changes" aria-label="Show changes">»</button>';
  const it = git.items, unc = it ? it.dirty : c.tree ? c.tree.dirty : 0, n = it ? it.commits.length : 0;
  let h = '<div class="gh"><span class="gt">Changes</span><button class="action-button" data-hide="1" title="Hide changes">Hide «</button></div><div class="gb">';
  h += `<button class="grp" data-g="unc">${git.open.unc ? "▾" : "▸"} Uncommitted changes <span class="badge">${unc}</span></button>`;
  const own = it && typeof it.own === "number" ? ` · ${it.own} from this task, ${unc - it.own} other` : "";
  if (git.open.unc) h += unc ? `<button class="gi${git.item === "WORKTREE" ? " on" : ""}" data-ref="WORKTREE"><b>Working tree</b><span class="sub">${unc} file${unc === 1 ? "" : "s"} · not committed yet${own}</span></button>` : '<div class="hint">Working tree is clean.</div>';
  h += `<button class="grp" data-g="com">${git.open.com ? "▾" : "▸"} ${it && it.recent ? "This task's commits" : "Commits ahead of main"} <span class="badge">${n}</span></button>`;
  if (git.open.com) h += !it ? '<div class="hint">Loading…</div>' : n ? it.commits.map(m => `<button class="gi${git.item === m.sha ? " on" : ""}" data-ref="${esc(m.sha)}"><span class="sha">${esc(m.sha)}</span>${esc(m.subject)}<span class="sub">${ago(m.at)} ago</span></button>`).join("") : `<div class="hint">${it.recent ? "No commits from this task." : "No commits."}</div>`;
  return h + "</div>";
}

function col2Html() {
  if (git.hide2) return '<button class="rail" data-show="2" title="Show files" aria-label="Show files">»</button>';
  let h = '<div class="gh"><span class="gt">Files</span><button class="action-button" data-hide="2" title="Hide files">Hide «</button></div><div class="gb">';
  if (!git.item) h += '<div class="hint">Pick a change on the left.</div>';
  else if (!git.files) h += '<div class="hint">Loading…</div>';
  else if (!git.files.length) h += '<div class="hint">No files.</div>';
  else {
    const row = f => {
      const i = f.path.lastIndexOf("/");
      return `<button class="gf${git.file === f.path ? " on" : ""}" data-file="${esc(f.path)}"><span class="st st-${esc(stc(f.status))}">${esc(f.status)}</span><span class="fn">${esc(f.path.slice(i + 1))}</span><span class="fd">${esc(i < 0 ? "" : f.path.slice(0, i))}</span></button>`;
    };
    const scoped = git.files.some(f => "own" in f), mine = scoped ? git.files.filter(f => f.own) : git.files, rest = scoped ? git.files.filter(f => !f.own) : [];
    h += mine.length ? mine.map(row).join("") : '<div class="hint">No uncommitted files from this task.</div>';
    if (rest.length) {
      h += `<button class="grp" data-g="other">${git.open.other ? "▾" : "▸"} Not from this task <span class="badge">${rest.length}</span></button>`;
      if (git.open.other) h += rest.map(row).join("");
    }
  }
  return h + "</div>";
}

const col3Html = () => `<div class="gh"><span class="gt">${esc(git.file || "Changes")}</span></div><div class="gb">${git.file ? `<pre class="diff">${diffHtml(git.diff)}</pre>` : '<div class="hint">Pick a file to see its changes.</div>'}</div>`;

function wireGit(c) {
  const root = document.querySelector(".gitview");
  if (!root) return;
  root.querySelectorAll("[data-g]").forEach(b => b.onclick = () => { git.open[b.dataset.g] = !git.open[b.dataset.g]; paintGit(c); });
  root.querySelectorAll("[data-ref]").forEach(b => b.onclick = () => pickItem(c, b.dataset.ref));
  root.querySelectorAll("[data-file]").forEach(b => b.onclick = () => pickFile(c, b.dataset.file));
  root.querySelectorAll("[data-hide]").forEach(b => b.onclick = () => { git["hide" + b.dataset.hide] = true; paintGit(c); });
  root.querySelectorAll("[data-show]").forEach(b => b.onclick = () => { git["hide" + b.dataset.show] = false; paintGit(c); });
}

function paintGit(c) {
  ensureBody("git", '<div class="gitview"><section class="gcol g1" id="g1"></section><section class="gcol g2" id="g2"></section><section class="gcol g3" id="g3"></section></div>');
  document.getElementById("g1").classList.toggle("hid", git.hide1);
  document.getElementById("g2").classList.toggle("hid", git.hide2);
  const changed = [setIfChanged("g1", col1Html(c)), setIfChanged("g2", col2Html()), setIfChanged("g3", col3Html())];
  if (changed.some(Boolean)) wireGit(c);
}

function matchedCardPane(c) {
  if (!herdrData) return null;
  const owned = (state && state.session_panes) || {}, panes = herdrData.panes || [];
  const ids = [...(c.now || []), ...(c.sessions || [])].map(x => owned[x.id]).filter(Boolean);
  const byId = panes.find(p => ids.includes(p.pane_id));
  if (byId) return byId;
  const names = [...(c.now || []).flatMap(x => [x.title, x.name]), ...(c.sessions || []).map(x => x.name)].filter(Boolean);
  return panes.find(p => names.includes(p.title)) || null;
}

function paintCardTerminal(c) {
  stopLog();
  ensureBody("terminal", '<div id="card-terminal" class="herdr-detail"></div>');
  const host = document.getElementById("card-terminal");
  if (!herdrData) {
    host.innerHTML = '<div class="hint">Loading Herdr…</div>';
    loadHerdr();
    return;
  }
  if (!herdrData.running) {
    stopTerminal();
    host.innerHTML = '<div class="empty">herdr is not running on this server</div>';
    return;
  }
  const match = matchedCardPane(c), chosen = cardPaneChoice.get(c.key);
  const pane = match || (herdrData.panes || []).find(x => x.pane_id === chosen) || null;
  const missing = match ? "" : "No pane matches this card's session title or name.";
  if (terminalCanStay(pane, herdrData.panes || []) && host.contains(terminal.root)) {
    const pick = host.querySelector("[data-pane-pick]");
    if (pick) {
      const empty = document.createElement("option");
      empty.value = "";
      empty.textContent = "—";
      const options = (herdrData.panes || []).map(item => {
        const option = document.createElement("option");
        option.value = item.pane_id;
        option.textContent = item.title || item.pane_id;
        return option;
      });
      pick.replaceChildren(empty, ...options);
      pick.value = pane.pane_id;
    }
    updateTerminalStatus(pane);
    return;
  }
  const restore = terminalSnapshot();
  host.innerHTML = terminalHtml(pane, herdrData.panes || [], missing);
  const pick = host.querySelector("[data-pane-pick]");
  if (pick) pick.onchange = () => { if (pick.value) cardPaneChoice.set(c.key, pick.value); else cardPaneChoice.delete(c.key); paintCardTerminal(c); };
  mountTerminal(host, pane, herdrData.panes || [], restore);
}

async function getJson(url) { return (await fetch(url, {cache: "no-store"})).json(); }

async function loadChanges(c, force) {
  const sig = c.tree ? `${c.tree.head}|${c.tree.dirty}|${c.tree.edited}` : "";
  if (!force && git.items && git.sig === sig && Date.now() - git.at < 15000) return;
  git.sig = sig;
  git.at = Date.now();
  try { git.items = await getJson("/api/changes?key=" + enc(c.key)); } catch (e) { return; }
  if (openKey !== c.key || tab2 !== "git") return;
  const it = git.items, pick = it.dirty ? "WORKTREE" : (it.commits[0] || {}).sha;
  if (!git.item && pick) return pickItem(c, pick);
  paintGit(c);
  if (git.item) loadFiles(c);
}

function pickItem(c, ref) {
  git.item = ref;
  git.files = null;
  git.file = null;
  git.diff = "";
  paintGit(c);
  loadFiles(c);
}

async function loadFiles(c) {
  const ref = git.item;
  if (!ref) return;
  try { git.files = await getJson(`/api/files?key=${enc(c.key)}&ref=${enc(ref)}`); } catch (e) { return; }
  if (git.item !== ref || openKey !== c.key) return;
  if (git.file && !git.files.some(f => f.path === git.file)) git.file = null;
  const first = git.files.find(f => f.own !== false);
  if (!git.file && first) return pickFile(c, first.path);
  paintGit(c);
  if (git.file) loadGitDiff(c);
}

function pickFile(c, path) {
  git.file = path;
  git.diff = "";
  paintGit(c);
  const gb = document.querySelector("#g3 .gb");
  if (gb) { gb.scrollTop = 0; gb.scrollLeft = 0; }
  loadGitDiff(c);
}

async function loadGitDiff(c) {
  const ref = git.item, path = git.file;
  if (!ref || !path) return;
  try {
    const t = await (await fetch(`/api/diff?key=${enc(c.key)}&ref=${enc(ref)}&path=${enc(path)}`, {cache: "no-store"})).text();
    if (git.item !== ref || git.file !== path) return;
    git.diff = t;
    paintGit(c);
  } catch (e) {}
}

function paintPanel() {
  const c = openKey && state && state.cards.find(x => x.key === openKey);
  if (!c) return closePanel();
  const p = panel();
  if (!document.getElementById("pbody")) {
    p.innerHTML = '<div class="ptop"><div class="ptabs" id="ptabs" role="tablist"></div><button class="action-button close" id="close">Close</button></div><div id="phead"></div><div class="pbody" id="pbody"></div>';
    bodyKind = "";
  }
  document.getElementById("close").onclick = closePanel;
  if (setIfChanged("phead", paneHead(c))) {
    document.querySelectorAll("#phead [data-wt]").forEach(b => b.onclick = () => { if (b.dataset.wt !== openKey) openCard(b.dataset.wt, true); });
  }
  if (setIfChanged("ptabs", tabsHtml(c))) document.querySelectorAll("#ptabs [data-t]").forEach(b => b.onclick = () => { tab2 = b.dataset.t; paintPanel(); });
  if (tab2 === "terminal") {
    paintCardTerminal(c);
  } else if (tab2 === "git" && c.tree) {
    stopTerminal();
    stopLog();
    paintGit(c);
    loadChanges(c, false);
  } else {
    stopTerminal();
    paintInfo(c);
  }
}

function openCard(key, keepTab = false) {
  if (openKey !== key) git = {...freshGit(), hide1: git.hide1, hide2: git.hide2};
  openKey = key;
  openRun = null;
  showLog = false;
  logSeen = "";
  if (!keepTab) tab2 = "info";
  bodyKind = "";
  panel().innerHTML = "";
  panel().classList.add("open");
  document.documentElement.classList.add("lock");
  document.documentElement.classList.toggle("split", view === "agents");
  paintPanel();
  render();
}

function openRunLog(key, id) {
  openCard(key);
  showRunLog(id);
}

function showRunLog(id) {
  openRun = id;
  showLog = true;
  logSeen = "";
  wasLive = false;
  stopLog();
  document.querySelector('#info [data-info-section="runs"]')?.setAttribute("open", "");
  paintPanel();
  document.querySelector("#info .task.open")?.scrollIntoView({block: "nearest"});
}

function repaintAll() {
  render();
  if (openKey) paintPanel();
}

function closePanel() {
  stopTerminal();
  stopLog();
  openKey = openRun = null;
  showLog = false;
  bodyKind = "";
  git = {...freshGit(), hide1: git.hide1, hide2: git.hide2};
  panel().classList.remove("open");
  panel().innerHTML = "";
  document.documentElement.classList.remove("lock", "split");
  render();
}

function sessionHerdrPane(session) {
  const panes = (herdrData && herdrData.panes) || [], owned = (state && state.session_panes) || {};
  const card = (state && state.cards || []).find(c => c.key === session.card);
  const names = [session.name, session.title].filter(Boolean);
  const tab = ((herdrData && herdrData.tabs) || []).find(t => names.includes(t.label) && panes.some(p => p.tab_id === t.tab_id));
  return panes.find(p => p.pane_id === owned[session.id]) || (card && matchedCardPane(card)) || panes.find(p => names.includes(p.title))
    || (tab && panes.find(p => p.tab_id === tab.tab_id)) || null;
}

function openToastTarget(target, session) {
  const pane = view === "herdr" && session ? sessionHerdrPane(session) : null;
  if (pane) { selectedHerdrPane = pane.pane_id; renderHerdrPage(); }
  else if (target) openCard(target);
}

function toast(text, tone, target, session) {
  const t = document.createElement("div");
  t.className = "toast " + tone;
  t.innerHTML = `<button class="toast-x" aria-label="Dismiss notification" title="Dismiss">×</button>${text}`;
  t.querySelector(".toast-x").onclick = event => { event.stopPropagation(); t.remove(); };
  t.onclick = () => { openToastTarget(target, session); t.remove(); };
  document.getElementById("toasts").appendChild(t);
  setTimeout(() => t.remove(), 15000);
}

function notify() {
  const ids = {waiting: new Set(state.waiting.map(s => s.key + s.updated)), still_open: new Set(state.still_open.map(s => s.key + s.updated))};
  if (seen) {
    state.waiting.filter(s => !seen.waiting.has(s.key + s.updated)).forEach(s => toast(`<b>Needs you:</b> ${esc(s.name)}<div class="s">${esc(s.snippet.slice(-140))}</div>`, "", s.card, s));
    state.still_open.filter(s => !seen.still_open.has(s.key + s.updated)).forEach(s => toast(`<b>Stopped:</b> ${esc(s.name)}`, "blue", s.card, s));
  }
  seen = ids;
  const n = state.cards.filter(needsHuman).length;
  document.title = n ? `(${n}) Agents` : "Agents";
}


document.getElementById("newsess").onclick = event => openNewSession(event.currentTarget);
document.getElementById("favsw").onclick = () => {
  favOnly = !favOnly;
  try { localStorage.setItem("fsa-fav-only", favOnly ? "1" : "0"); } catch (e) {}
  render();
};

async function load() {
  try {
    const r = await fetch("/api/state", {cache: "no-store"});
    if (!r.ok) throw new Error(r.status);
    state = await r.json();
    if (uiSeen && state.ui && uiSeen !== state.ui) return location.reload();
    uiSeen = state.ui;
    const meta = document.getElementById("meta");
    meta.title = state.repo;
    meta.className = "status";
    meta.innerHTML = `<span class="dot"></span>${esc(state.repo.split("/").pop())} · ${state.locks.deploy ? '<span class="lock">deploy lock held</span> · ' : ""}${new Date(state.generated * 1000).toLocaleTimeString()}`;
    notify();
    noteTpm();
    noteCardTpm();
    if (document.activeElement?.id !== "fsort") rerenderKeepingFocus();
    if (openKey) paintPanel();
    if (view === "herdr" || openKey && tab2 === "terminal") loadHerdr();
  } catch (e) {
    const meta = document.getElementById("meta");
    meta.className = "status error";
    meta.innerHTML = '<span class="dot"></span>offline — retrying';
  }
}

function copyText(text) {
  if (navigator.clipboard && window.isSecureContext) return navigator.clipboard.writeText(text);
  const ta = document.createElement("textarea");
  ta.value = text;
  ta.style.position = "fixed";
  ta.style.opacity = "0";
  (document.querySelector("dialog[open]") || document.body).appendChild(ta);
  ta.select();
  const ok = document.execCommand("copy");
  ta.remove();
  return ok ? Promise.resolve() : Promise.reject(new Error("copy failed"));
}

let out = null, outTimer = null;
const outEl = id => document.getElementById(id);

function outItems() {
  const runs = recentRuns(cardOfSession(out.sid), out.sid).map(r => ({id: r.id, label: "run · " + (r.unit || r.id), state: LIVE(r) ? "running" : r.state, run: r}));
  return [...runs, ...ownAgents(cardOfSession(out.sid) || {}).filter(a => a.sid === out.sid)].filter(notDismissed);
}

function outInfo(cur) {
  const c = cardOfSession(out.sid);
  if (!cur) return "";
  const bar = isDone(cur) ? `<div class="ls-actions">${dismissButton(cur)}</div>` : "";
  const view = v => `<button data-view="${v}" aria-pressed="${out.view === v}">${v === "changes" ? "Git changes" : "Console"}</button>`;
  if (cur.run) return runFacts(cur.run, c) + bar + (cur.run.root ? `<div class="seg" role="group" aria-label="Show">${view("console")}${view("changes")}</div>` : "");
  return (cur.shell ? shellFacts({...cur, sid: out.sid}, c) : "") + bar;
}

function pickOut(id) {
  out.id = id;
  out.file = null;
  out.text = null;
  outEl("out-pre").textContent = "loading…";
  paintOutItems();
  pollOutput();
}

function paintOutItems() {
  const items = outItems();
  if (!items.some(x => x.id === out.id) && items.length) out.id = items[0].id;
  const cur = items.find(x => x.id === out.id);
  outEl("out-title").textContent = "Monitor · " + ((sessionOf(out.sid) || {}).name || out.sid);
  outEl("out-meta").textContent = cur ? cur.state : "";
  const info = outInfo(cur);
  const box = outEl("out-info");
  if (box.dataset.html !== info) {
    const opened = new Set([...box.querySelectorAll("details")].filter(d => d.open).map(d => d.querySelector("summary")?.textContent));
    keepScroll(box, () => {
      box.innerHTML = info;
      box.querySelectorAll("details").forEach(d => { if (opened.has(d.querySelector("summary")?.textContent)) d.open = true; });
    });
    box.dataset.html = info;
    box.querySelectorAll("[data-view]").forEach(b => b.onclick = () => { out.view = b.dataset.view; out.file = null; out.text = null; outEl("out-pre").textContent = "loading…"; paintOutItems(); pollOutput(); });
    box.querySelectorAll("[data-dismiss]").forEach(b => b.onclick = () => { dismiss([b.dataset.dismiss]); out.text = null; paintOutItems(); pollOutput(); repaintAll(); });
  }
  const chooser = outEl("out-items"), list = items.map(x => `<button data-oid="${esc(x.id)}" aria-pressed="${x.id === out.id}" title="${esc(x.label)}">${x.state === "running" ? '<span class="live-dot"></span>' : ""}${esc(x.label || x.id)}</button>`).join("");
  if (chooser.dataset.html !== list) {
    keepScroll(chooser, () => { chooser.innerHTML = list; });
    chooser.dataset.html = list;
    chooser.querySelectorAll("[data-oid]").forEach(b => b.onclick = () => pickOut(b.dataset.oid));
  }
}

async function fetchText(url, gone) {
  const r = await fetch(url, {cache: "no-store"});
  return r.ok ? await r.text() : r.status === 404 ? gone : `(error ${r.status})`;
}

function paintFiles(files, cur) {
  const box = outEl("out-files");
  if (!files) {
    if (box.innerHTML) box.innerHTML = "";
    return;
  }
  const allowed = new Set(cur.run.allowed || []), inBrief = f => !allowed.size || allowed.has(f.path);
  const head = files.length ? `${files.length} uncommitted file${files.length > 1 ? "s" : ""} in ${cur.run.root}${allowed.size ? ` · ${files.filter(inBrief).length} in the brief's allowed paths` : ""}` : `No uncommitted changes in ${cur.run.root} yet.`;
  const html = `<div class="s">${esc(head)}</div><div class="flist" role="group" aria-label="Changed files">${files.map(f => `<button data-file="${esc(f.path)}" aria-pressed="${f.path === out.file}" title="${esc(inBrief(f) ? f.path : f.path + " — outside the brief's allowed paths")}"><span class="st st-${esc(stc(f.status))}">${esc(f.status)}</span><span class="fp">${esc(f.path)}</span>${inBrief(f) ? "" : '<span class="pill bad">outside brief</span>'}</button>`).join("")}</div>`;
  if (box.dataset.html === html) return;
  keepScroll(box, () => { box.innerHTML = html; });
  box.dataset.html = html;
  box.querySelectorAll("[data-file]").forEach(b => b.onclick = () => { out.file = b.dataset.file; out.text = null; outEl("out-pre").textContent = "loading…"; pollOutput(); });
}

async function changesText(want, cur) {
  const key = enc(cur.run.root), r = await fetch(`/api/files?key=${key}&ref=WORKTREE`, {cache: "no-store"});
  if (!r.ok) {
    paintFiles(null);
    return r.status === 404 ? `${cur.run.root} is not a known worktree any more.` : `(error ${r.status})`;
  }
  const files = await r.json();
  if (out && out.id === want.id && out.view === "changes") paintFiles(files, cur);
  if (!want.file) return files.length ? "Select a file to see its diff." : "";
  if (!files.some(f => f.path === want.file)) return `${want.file} no longer has uncommitted changes.`;
  return await fetchText(`/api/diff?key=${key}&ref=WORKTREE&path=${enc(want.file)}`, "(no diff for this file)");
}

async function outText(want, cur) {
  if (cur && cur.run && want.view === "changes" && cur.run.root) return await changesText(want, cur);
  paintFiles(null);
  const runLog = id => fetchText(`/api/log?id=${enc(id)}&full=1`, "(no log for this run)");
  if (cur && cur.run) {
    const log = await runLog(cur.id) || "(the run has not written to its log yet)", shell = launcherOf(cur.run, cardOfSession(want.sid));
    if (!shell) return log;
    const tail = await fetchText(`/api/output?sid=${enc(shell.sid)}&id=${enc(shell.id)}`, "");
    return /\S/.test(tail) && tail !== "(no output yet)" ? `${log}\n\n──── launcher shell ${shell.id} · ${shell.state} ────\n${tail}` : log;
  }
  return await fetchText(`/api/output?sid=${enc(want.sid)}&id=${enc(want.id)}`, "(this item is no longer listed)");
}

async function pollOutput() {
  if (!out || document.hidden) return;
  const want = {...out}, cur = outItems().find(x => x.id === want.id);
  try {
    const text = await outText(want, cur);
    if (!out || out.sid !== want.sid || out.id !== want.id || out.view !== want.view || out.file !== want.file || text === out.text) return;
    const pre = outEl("out-pre"), atEnd = out.text === null || pre.scrollHeight - pre.scrollTop - pre.clientHeight < 40;
    out.text = text;
    const diff = want.view === "changes" && want.file && /^diff --git /m.test(text);
    pre.classList.toggle("diff", diff);
    if (diff) pre.innerHTML = diffHtml(text);
    else pre.textContent = text || "(no output yet)";
    if (atEnd) pre.scrollTop = pre.scrollHeight;
  } catch (e) {}
}

function openAgent(sid, id, view = "console") {
  out = {sid, id, view, file: null, text: null};
  outEl("out-pre").textContent = "loading…";
  paintOutItems();
  outEl("out").showModal();
  pollOutput();
  clearInterval(outTimer);
  outTimer = setInterval(() => { if (out) { paintOutItems(); pollOutput(); } }, 3000);
}

outEl("out").addEventListener("close", () => { out = null; clearInterval(outTimer); outTimer = null; });
outEl("out-close").onclick = () => outEl("out").close();
outEl("out-copy").onclick = () => {
  const b = outEl("out-copy"), done = label => { b.textContent = label; setTimeout(() => { b.textContent = "Copy"; }, 1500); };
  copyText(outEl("out-pre").textContent).then(() => done("Copied"), () => done("Copy failed"));
};

let ctxCard = null;
const ctx = () => document.getElementById("ctx");

function closeCtx() {
  if (ctx().hidden) return false;
  ctx().hidden = true;
  if (ctxCard && document.contains(ctxCard)) ctxCard.focus();
  ctxCard = null;
  return true;
}

const cardPane = card => ((state && state.session_panes) || {})[card.dataset.sid] || "";

function endSession(card) {
  const pane = cardPane(card), name = card.querySelector(".feature")?.textContent || card.dataset.sid;
  if (!pane) return;
  openHerdrConfirm("End session?", `${name} — closes herdr pane ${pane} and stops the agent running in it. Unsaved work in that session is lost.`, "pane.close", {pane_id: pane}, card,
    {confirm: "end session", after: () => { toast(`<b>Ended</b> ${esc(name)}`, "blue"); load(); }});
}

function openCtx(card, x, y) {
  ctxCard = card;
  const m = ctx();
  m.querySelector('[data-act="open"]').disabled = !card.dataset.key;
  const fav = card.querySelector("[data-fav]");
  m.querySelector('[data-act="fav"]').disabled = !fav;
  m.querySelector('[data-act="fav"]').textContent = fav && fav.getAttribute("aria-pressed") === "true" ? "Unmark favourite" : "Mark favourite";
  m.querySelector('[data-act="copy"]').disabled = !card.dataset.sid;
  const end = m.querySelector('[data-act="end"]'), pane = cardPane(card);
  end.disabled = !pane;
  end.title = pane ? `Close herdr pane ${pane} and stop this session` : "This session is not running in a herdr pane";
  m.hidden = false;
  m.style.left = Math.max(8, Math.min(x, innerWidth - m.offsetWidth - 8)) + "px";
  m.style.top = Math.max(8, Math.min(y, innerHeight - m.offsetHeight - 8)) + "px";
  const first = m.querySelector("button:not(:disabled)");
  if (first) first.focus();
}

document.addEventListener("contextmenu", e => {
  const box = e.target.closest("[data-herdr-pane-context]");
  const pane = box && herdrData && (herdrData.panes || []).find(x => x.pane_id === box.dataset.herdrPaneContext);
  if (pane) {
    e.preventDefault();
    closeCtx();
    return openHerdrContextMenu("pane", pane, e.clientX, e.clientY, box);
  }
  const card = e.target.closest("#main .card");
  if (!card) return closeCtx();
  e.preventDefault();
  const r = card.getBoundingClientRect();
  openCtx(card, e.clientX || r.left + 12, e.clientY || r.top + 12);
});
document.addEventListener("click", e => { if (!e.target.closest("#ctx")) closeCtx(); });
addEventListener("scroll", closeCtx, true);
addEventListener("resize", closeCtx);
addEventListener("resize", () => updateHerdrTabOverflow(document));
ctx().addEventListener("keydown", e => {
  if (e.key !== "ArrowDown" && e.key !== "ArrowUp") return;
  e.preventDefault();
  const items = [...ctx().querySelectorAll("button:not(:disabled)")], i = items.indexOf(document.activeElement);
  items[(i + (e.key === "ArrowDown" ? 1 : items.length - 1)) % items.length].focus();
});
ctx().addEventListener("click", e => {
  const b = e.target.closest("[data-act]");
  if (!b || b.disabled || !ctxCard) return;
  const card = ctxCard, act = b.dataset.act;
  closeCtx();
  if (act === "open") openCard(card.dataset.key);
  else if (act === "fav") toggleFavourite(card.dataset.key);
  else if (act === "end") endSession(card);
  else if (act === "copy") copyText(card.dataset.sid).then(() => toast(`<b>Copied</b> ${esc(card.dataset.sid)}`, "blue"), () => toast("<b>Copy failed</b>", "red"));
});

document.addEventListener("keydown", e => { if (e.key !== "Escape" || out || e.target.closest?.(".terminal")) return; if (closeCtx()) return; if (openRun) toggleTask(openRun); else closePanel(); });
document.querySelectorAll("[data-view]").forEach(b => b.onclick = () => setView(b.dataset.view));
document.addEventListener("visibilitychange", () => { if (!document.hidden && openRun) pollLog(openRun); if (!document.hidden && terminal) pollTerminal(); });
addEventListener("pagehide", stopTerminal);
addEventListener("pageshow", event => {
  if (!event.persisted || terminal) return;
  if (view === "herdr") renderHerdrPage();
  else if (openKey && tab2 === "terminal") paintPanel();
});
setView(view);
load();
setInterval(load, 4000);
</script>
