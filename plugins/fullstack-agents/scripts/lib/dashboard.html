<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Agents</title>
<style>
:root {
  --bg: #f4f5f8; --panel: #ffffff; --card: #ffffff; --card-hover: #f7f8fb; --ink: #1b1d26; --muted: #5d6273; --faint: #8b90a3; --line: #dfe2ea;
  --active: #0b7a99; --pass: #1d7f3e; --changes: #a85a00; --human: #b0246f; --merged: #6b44c2;
  --amber: #a85a00; --amber-bg: #fff1dd; --blue: #0b7a99; --blue-bg: #e2f3f8;
  --red: #b42318; --red-bg: #fde8e6; --green: #1d7f3e; --green-bg: #e2f4e8; --chip: #eef0f5; --yellow: #a85a00;
  --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #14151b; --panel: #1a1c24; --card: #20222c; --card-hover: #252835; --ink: #e4e5ea; --muted: #9da2b6; --faint: #6c7187; --line: #2b2e3b;
    --active: #8be9fd; --pass: #50fa7b; --changes: #ffb86c; --human: #ff79c6; --merged: #bd93f9;
    --amber: #ffb86c; --amber-bg: #3a2c16; --blue: #8be9fd; --blue-bg: #18303a;
    --red: #ff8a7f; --red-bg: #43201c; --green: #50fa7b; --green-bg: #173322; --chip: #2a2d3a; --yellow: #ffb86c;
  }
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 14px/1.5 -apple-system, BlinkMacSystemFont, "Inter", "Segoe UI", sans-serif; -webkit-font-smoothing: antialiased; }
.dismiss { margin-left: auto; border: 1px solid var(--line); background: var(--panel); color: var(--muted); border-radius: 6px; font-size: 11px; padding: 2px 8px; cursor: pointer; }
.dismiss:hover { color: var(--ink); border-color: var(--muted); }
header { display: flex; align-items: baseline; justify-content: space-between; gap: 16px; flex-wrap: wrap; padding: 24px 32px 4px; }
header h1 { margin: 0; font-size: 18px; font-weight: 600; letter-spacing: -0.01em; }
.status { font-family: var(--mono); font-size: 12px; color: var(--muted); }
.status .dot { display: inline-block; width: 7px; height: 7px; border-radius: 50%; background: var(--pass); margin-right: 6px; vertical-align: 1px; }
.status.error { color: var(--human); }
.status.error .dot { background: var(--human); }
.status .lock { color: var(--changes); }
@keyframes pulse { 50% { transform: scale(1.25); } }
@keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: .25; } }
@keyframes breathe { 0%, 100% { opacity: 1; } 50% { opacity: .45; } }
main { padding: 0; }
.board { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 14px; padding: 18px 32px 40px; align-items: start; }
.col { min-width: 0; }
.col-head { display: flex; align-items: baseline; gap: 8px; padding: 0 2px 10px; border-bottom: 1px solid var(--line); margin-bottom: 12px; position: relative; }
.col-head h2 { margin: 0; font-size: 13px; font-weight: 600; white-space: nowrap; }
.col-head .who { font: 11px var(--mono); color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
.col-head .count { margin-left: auto; font: 11px var(--mono); color: var(--muted); }
.col.flow .col-head::after { content: "›"; position: absolute; right: -11px; top: -3px; color: var(--faint); font-size: 16px; }
.col.human .col-head { border-bottom-color: color-mix(in srgb, var(--human) 55%, transparent); }
.col.human h2 { color: var(--human); }
.col.merged h2 { color: var(--merged); }
.col .none { color: var(--faint); font-size: 12px; padding: 4px 2px; }
.more { width: 100%; border: 1px dashed var(--line); background: none; color: var(--muted); border-radius: 8px; padding: 6px; font: inherit; font-size: 12px; cursor: pointer; }
.more:hover { color: var(--ink); border-color: var(--muted); }
.card { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 11px 12px 9px; margin-bottom: 10px; cursor: pointer; transition: background .15s, border-color .15s, transform .15s; }
.card:hover { background: var(--card-hover); transform: translateY(-1px); }
.card:focus-visible { outline: 2px solid var(--active); outline-offset: 2px; }
.card.live { border-color: color-mix(in srgb, var(--active) 40%, var(--line)); }
.card.human { border-color: var(--human); box-shadow: 0 0 0 1px color-mix(in srgb, var(--human) 40%, transparent), 0 8px 24px -12px color-mix(in srgb, var(--human) 60%, transparent); }
.card.quiet:not(:hover):not(:focus-within) { opacity: .72; }
.card-top { display: flex; align-items: center; gap: 7px; margin-bottom: 3px; min-width: 0; }
.card-top .num { font: 11px var(--mono); color: var(--muted); min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.blink { flex: none; width: 7px; height: 7px; border-radius: 50%; background: var(--active); animation: blink 1.6s ease-in-out infinite; }
.flag { margin-left: auto; flex: none; font-size: 10px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--human); white-space: nowrap; }
.card .t { font-size: 13px; font-weight: 600; line-height: 1.4; word-break: break-word; }
.card .s { color: var(--muted); font-size: 12px; margin-top: 2px; word-break: break-word; }
.feature { font-size: 13px; line-height: 1.4; margin: 0 0 4px; word-break: break-word; }
.branch { font: 11px var(--mono); color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.rounds { margin-top: 10px; display: grid; gap: 5px; }
.round { display: grid; gap: 2px; }
.round .rl { display: flex; gap: 6px; font: 10px var(--mono); color: var(--muted); min-width: 0; }
.round .rl b { font-weight: 600; color: var(--ink); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
.round .rl span { flex: none; }
.round .cells { display: flex; gap: 3px; }
.rounds .earlier { font: 10px var(--mono); color: var(--muted); }
.cell { flex: 1; min-width: 0; text-align: center; font: 10px/1.3 var(--mono); padding: 2px 0; border-radius: 4px; border: 1px dashed var(--faint); color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: clip; }
.cell.wait, .cell.live { border-style: solid; border-color: color-mix(in srgb, var(--active) 55%, transparent); color: var(--active); animation: breathe 1.6s ease-in-out infinite; }
.cell.PASS { border: 1px solid transparent; color: var(--pass); background: color-mix(in srgb, var(--pass) 14%, transparent); }
.cell.CHANGES { border: 1px solid transparent; color: var(--changes); background: color-mix(in srgb, var(--changes) 16%, transparent); }
.cell.bad { border: 1px solid var(--human); color: var(--human); }
.cell.done { border: 1px solid var(--line); color: var(--muted); }
.cell.skip { border: 1px dotted var(--line); color: var(--faint); opacity: .7; }
.cardhint { margin-top: 10px; padding-top: 8px; border-top: 1px solid var(--line); font: 10.5px/1.6 var(--mono); color: var(--muted); overflow-wrap: anywhere; user-select: all; }
.chips { display: flex; gap: 4px; flex-wrap: wrap; margin-top: 6px; }
.chips:empty { display: none; }
.chip { font: 10.5px var(--mono); padding: 1px 6px; border-radius: 4px; background: var(--chip); color: var(--muted); }
.chip.ok { background: color-mix(in srgb, var(--pass) 14%, transparent); color: var(--pass); }
.chip.bad { background: color-mix(in srgb, var(--human) 14%, transparent); color: var(--human); }
.chip.st-working { background: color-mix(in srgb, var(--active) 14%, transparent); color: var(--active); }
.chip.st-stopped { background: none; border: 1px solid var(--line); }
.foot { display: flex; gap: 8px; align-items: center; margin-top: 9px; padding-top: 7px; border-top: 1px solid var(--line); font: 11px var(--mono); color: var(--muted); }
.foot .dismiss { font-family: inherit; }
.paths { font: 11px/1.4 var(--mono); color: var(--human); margin-top: 6px; word-break: break-all; }
@media (hover: hover) { .card .foot .dismiss { opacity: 0; } .card:hover .foot .dismiss, .card:focus-within .foot .dismiss { opacity: 1; } }
.row { display: flex; gap: 8px; align-items: center; margin-top: 8px; }
.list { display: grid; gap: 10px; max-width: 980px; }
.list .card { cursor: default; }
.snip { white-space: pre-wrap; margin-top: 6px; font-size: 13px; }
.mono { font: 12px ui-monospace, monospace; user-select: all; word-break: break-all; }
.empty { color: var(--muted); padding: 20px 0; }
aside { position: fixed; top: 0; right: 0; bottom: 0; width: min(1280px, 96vw); background: var(--panel); border-left: 1px solid var(--line); display: flex; flex-direction: column; overflow: hidden; transform: translateX(100%); transition: transform .18s, width .18s; z-index: 10; }
aside.open { transform: none; }
html.lock, html.lock body { overflow: hidden; }
aside h3 { margin: 0 0 4px; font-size: 16px; }
aside h4 { margin: 14px 0 4px; font-size: 12px; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); }
aside pre { background: var(--chip); padding: 10px; border-radius: 8px; white-space: pre-wrap; word-break: break-word; font-size: 12px; max-height: 360px; overflow: auto; }
#phead { flex: none; padding: 16px 18px 6px; }
#phead .close { float: right; }
.ptabs { flex: none; display: flex; gap: 4px; padding: 0 18px; border-bottom: 1px solid var(--line); }
.tab2 { border: 0; background: none; color: var(--muted); font: inherit; padding: 8px 12px; cursor: pointer; border-bottom: 2px solid transparent; display: flex; gap: 6px; align-items: center; }
.tab2[aria-selected="true"] { color: var(--ink); font-weight: 600; border-bottom-color: var(--blue); }
.tab2:disabled { opacity: .4; cursor: default; }
.pbody { flex: 1; min-height: 0; display: flex; flex-direction: column; }
#info { flex: 1; min-height: 0; overflow: auto; padding: 4px 18px 18px; }
.tasks { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
.task { display: grid; grid-template-columns: 18px 1fr; gap: 2px 8px; align-items: start; padding: 10px; border: 1px solid var(--line); border-radius: 10px; cursor: pointer; background: var(--panel); }
.task:hover { border-color: var(--muted); }
.task input { margin: 3px 0 0; }
.task .tn { font-weight: 600; }
.task .tg { grid-column: 2; margin-top: 2px; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
.steps { list-style: none; margin: 0; padding: 0; display: grid; gap: 4px; }
.steps li { display: grid; grid-template-columns: 22px 1fr; gap: 0 6px; font-size: 13px; }
.steps .mk { font-weight: 700; text-align: center; color: var(--muted); }
.steps .active .mk, .steps .active .tx { color: var(--blue); font-weight: 600; }
.steps .done .mk { color: var(--green); }
.steps .skipped .tx { text-decoration: line-through; color: var(--muted); }
.steps .nt { grid-column: 2; color: var(--muted); font-size: 12px; }
.now { border: 1px solid var(--line); border-radius: 10px; padding: 10px; display: grid; gap: 4px; margin-bottom: 8px; }
.now .lbl { color: var(--muted); font-size: 11px; text-transform: uppercase; letter-spacing: .04em; margin-top: 4px; }
.card .act { font: 11px/1.4 var(--mono); color: var(--muted); margin-top: 6px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.task .th { cursor: pointer; display: flex; flex-wrap: wrap; align-items: center; gap: 6px; }
.task .caret { margin-left: auto; color: var(--muted); }
.task .tg { cursor: pointer; }
.task .detail { grid-column: 1 / -1; margin-top: 8px; cursor: default; }
.task .detail pre { margin: 6px 0 0; max-height: 220px; }
aside .task .detail pre.log { max-height: 260px; font-size: 11px; }
.endbar { display: flex; justify-content: flex-end; margin-top: 10px; padding-top: 8px; border-top: 3px solid var(--line); }
.endbar.ok { border-top-color: var(--green); }
.endbar.bad { border-top-color: var(--red); }
.endbar.live { border-top-color: var(--blue); }
.endbar .dismiss { margin-left: 0; }
.card .br { font: 11px/1.3 ui-monospace, SFMono-Regular, Menlo, monospace; color: var(--blue); margin-top: 3px; word-break: break-all; }
.gitview { flex: 1; min-height: 0; display: flex; }
.gcol { display: flex; flex-direction: column; min-width: 0; min-height: 0; border-right: 1px solid var(--line); }
.g1, .g2 { flex: 0 0 20%; }
.g3 { flex: 1; border-right: 0; }
.g1.hid, .g2.hid { flex: 0 0 30px; }
.gh { flex: none; display: flex; align-items: center; justify-content: space-between; gap: 6px; padding: 8px 10px; border-bottom: 1px solid var(--line); }
.gh .gt { font-weight: 600; font-size: 12px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
.gh .dismiss { margin-left: 0; flex: none; }
.gb { flex: 1; min-height: 0; overflow: auto; }
.rail { flex: 1; border: 0; background: none; color: var(--muted); cursor: pointer; font-size: 16px; }
.rail:hover { background: var(--chip); color: var(--ink); }
.grp { display: flex; align-items: center; gap: 6px; width: 100%; text-align: left; border: 0; background: var(--chip); color: var(--ink); font: inherit; font-weight: 600; font-size: 12px; padding: 6px 10px; cursor: pointer; position: sticky; top: 0; z-index: 1; }
.gi, .gf { display: block; width: 100%; text-align: left; border: 0; background: none; color: inherit; font: inherit; padding: 6px 10px; border-bottom: 1px solid var(--line); cursor: pointer; }
.gi:hover, .gf:hover { background: var(--chip); }
.gi.on, .gf.on { background: var(--blue-bg); }
.gi .sha { font: 11px ui-monospace, SFMono-Regular, Menlo, monospace; color: var(--blue); margin-right: 6px; }
.gi .sub, .gf .fd { display: block; color: var(--muted); font-size: 11px; word-break: break-all; }
.gf .fn { font: 12px ui-monospace, SFMono-Regular, Menlo, monospace; word-break: break-all; }
.st { display: inline-block; min-width: 16px; text-align: center; font: 700 11px ui-monospace, SFMono-Regular, Menlo, monospace; border-radius: 4px; margin-right: 6px; background: var(--chip); }
.st-A, .st-U { color: var(--green); }
.st-D { color: var(--red); }
.st-M, .st-R { color: var(--amber); }
aside .gcol pre.diff { margin: 0; border-radius: 0; background: none; padding: 0; white-space: pre; font: 11px/1.45 ui-monospace, SFMono-Regular, Menlo, monospace; max-height: none; overflow: visible; min-width: max-content; }
.diff span { display: block; padding: 0 10px; }
.diff .a { color: var(--green); background: var(--green-bg); }
.diff .d { color: var(--red); background: var(--red-bg); }
.diff .h { color: var(--blue); }
.hint { color: var(--muted); padding: 14px 10px; font-size: 12px; }
.live-dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: var(--blue); margin-right: 6px; animation: pulse 1.2s ease-in-out infinite; }
#toasts { position: fixed; top: 64px; right: 16px; display: grid; gap: 8px; z-index: 20; width: min(360px, calc(100% - 32px)); }
.toast { background: var(--panel); border: 1px solid var(--line); border-left: 5px solid var(--amber); border-radius: 10px; padding: 10px 12px; box-shadow: 0 6px 24px rgba(0,0,0,.18); cursor: pointer; animation: slide .2s ease-out; }
.toast.blue { border-left-color: var(--blue); }
.toast.red { border-left-color: var(--red); }
.agents { display: grid; grid-template-columns: repeat(auto-fill, minmax(78px, 1fr)); gap: 4px; margin-top: 9px; }
.agent { min-width: 0; text-align: left; border: 1px solid var(--line); background: var(--bg); color: var(--muted); border-radius: 6px; padding: 3px 6px; cursor: pointer; font: 10px/1.35 var(--mono); }
.agent b { display: block; font-weight: 600; color: var(--ink); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.agent span { display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.agent.running { border-color: color-mix(in srgb, var(--pass) 60%, transparent); background: color-mix(in srgb, var(--pass) 14%, transparent); color: var(--pass); }
.agent.running b { color: var(--pass); }
.agent:hover, .agent:focus-visible { border-color: var(--active); outline: none; }
#out { width: min(900px, calc(100% - 32px)); max-height: calc(100vh - 64px); border: 1px solid var(--line); border-radius: 10px; background: var(--panel); color: var(--ink); padding: 14px; }
#out::backdrop { background: rgba(0,0,0,.45); }
#out .oh { display: flex; align-items: center; gap: 8px; }
#out .oh h3 { margin: 0; font-size: 15px; flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
#out .items { display: flex; gap: 6px; flex-wrap: wrap; margin: 10px 0 0; }
#out .items button { border: 1px solid var(--line); background: var(--bg); color: var(--ink); border-radius: 6px; font-size: 12px; padding: 3px 8px; cursor: pointer; max-width: 280px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
#out .items button[aria-pressed="true"] { border-color: var(--blue); background: var(--panel); }
#out pre { margin: 10px 0 0; height: min(60vh, 560px); overflow: auto; white-space: pre-wrap; word-break: break-word; font: 12px ui-monospace, monospace; background: var(--bg); border: 1px solid var(--line); border-radius: 8px; padding: 10px; }
#ctx { position: fixed; z-index: 30; min-width: 170px; background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 4px; box-shadow: 0 6px 24px rgba(0,0,0,.18); }
#ctx[hidden] { display: none; }
#ctx button { display: block; width: 100%; text-align: left; border: 0; background: none; color: var(--ink); font: inherit; font-size: 13px; padding: 6px 10px; border-radius: 5px; cursor: pointer; }
#ctx button:hover:not(:disabled), #ctx button:focus-visible { background: var(--bg); outline: none; }
#ctx button:disabled { color: var(--muted); cursor: default; }
@keyframes slide { from { transform: translateX(30px); opacity: 0; } }
@media (max-width: 1100px) { .board { grid-template-columns: repeat(3, minmax(0, 1fr)); row-gap: 28px; } .col.flow .col-head::after { display: none; } }
@media (max-width: 640px) { header { padding: 18px 16px 4px; } .board { grid-template-columns: 1fr; padding: 14px 16px 32px; } }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } .card:hover { transform: none; } }
</style>
</head>
<body>
<header>
  <h1>Agents</h1>
  <div class="status" id="meta"><span class="dot"></span>loading…</div>
</header>
<main id="main"></main>
<aside id="panel" aria-label="Details"></aside>
<div id="toasts" aria-live="polite"></div>
<dialog id="out" aria-labelledby="out-title">
  <div class="oh"><h3 id="out-title"></h3><span class="s" id="out-meta"></span>
    <button class="dismiss" id="out-copy" style="margin-left:0">Copy</button>
    <button class="dismiss" id="out-close" style="margin-left:0">Close</button></div>
  <div class="items" id="out-items" role="group" aria-label="Choose output"></div>
  <pre id="out-pre" tabindex="0"></pre>
</dialog>
<div id="ctx" role="menu" aria-label="Card actions" hidden>
  <button role="menuitem" data-act="open">Open</button>
  <button role="menuitem" data-act="copy">Copy session id</button>
  <button role="menuitem" data-act="dismiss">Dismiss</button>
</div>
<script>
const STAGES = [
  {key: "investigate", label: "Investigate", who: "lead · opus · haiku scan", phases: ["idle", "investigate"], flow: true},
  {key: "plan", label: "Plan", who: "lead · opus", phases: ["plan"], flow: true},
  {key: "build", label: "Build", who: "implementer", phases: ["implement", "rework"], flow: true},
  {key: "review", label: "Review", who: "lead audit · test-runner · diff-reviewer", phases: ["audit"], flow: true},
  {key: "merged", label: "Merged", who: "main · deploy", phases: ["merged", "deploying", "deployed"]},
  {key: "human", label: "Needs human", who: "you · approve · rework", phases: ["review"]},
];
const QUIET = new Set(["idle", "merged", "deployed"]);
const FLAG_TEXT = {failed:"run failed", stalled:"run stalled", out_of_scope:"edited files outside its brief", no_changes:"changed nothing", retries_exhausted:"retries used up"};
const SHOWN = 3;
let expanded = new Set();
try { expanded = new Set(JSON.parse(localStorage.getItem("fsa-expanded") || "[]")); } catch (e) {}
let uiSeen = null, state = null, seen = null;

const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const ago = t => { const s = Math.max(0, Date.now()/1000 - t); return s < 90 ? `${Math.round(s)}s` : s < 5400 ? `${Math.round(s/60)}m` : s < 172800 ? `${Math.round(s/3600)}h` : `${Math.round(s/86400)}d`; };
const chip = c => { const good = /^(GREEN|PASS)$/.test(c.verdict), bad = /^(RED|CHANGES)$/.test(c.verdict); return `<span class="chip ${good ? "ok" : bad ? "bad" : ""}" title="${esc(c.label)}">${esc(c.kind)} ${esc(c.verdict)}</span>`; };

async function dismiss(key, ev) {
  ev?.stopPropagation();
  await fetch("/api/dismiss", {method: "POST", headers: {"Content-Type": "application/json"}, body: JSON.stringify({key})});
  load();
}

const rank = c => c.sessions.some(s => s.state === "working") || c.runs.some(r => r.state === "running") ? 0 : needsHuman(c) ? 1 : QUIET.has(c.phase) ? 3 : 2;

const needsHuman = c => c.phase === "review" || c.needs_you.length > 0 || c.sessions.some(s => s.state === "waiting");
const stageOf = c => needsHuman(c) ? "human" : (STAGES.find(s => s.phases.includes(c.phase)) || STAGES[0]).key;

const LENSES = [["security", "sec"], ["ux", "ux"], ["code", "code"]];
const cell = (tone, label, title) => `<span class="cell ${tone}" title="${esc(title)}">${esc(label)}</span>`;
const verdictTone = v => /^(GREEN|PASS)$/.test(v) ? "PASS" : /^(RED|CHANGES|FAIL)$/.test(v) ? "CHANGES" : "done";

const unitPrefix = units => {
  const parts = units.map(u => u.split("-"));
  let n = 0;
  while (parts.length && parts.every(p => p.length > n + 1 && p[n] === parts[0][n])) n++;
  return n ? parts[0].slice(0, n).join("-") + "-" : "";
};

function roundOf(rounds, at) {
  let i = -1;
  rounds.forEach((r, n) => { if ((r.started || r.updated) <= at) i = n; });
  return i;
}

function roundsHtml(c) {
  const runs = c.rounds || [];
  const agents = (c.now || []).flatMap(s => s.agents || []);
  if (!runs.length) {
    const scan = agents.filter(a => a.label.startsWith("bounded-extractor"));
    const lead = c.sessions.some(s => s.state === "working") ? "live" : c.sessions.some(s => s.state === "waiting") ? "bad" : c.sessions.length ? "done" : "";
    return `<div class="rounds"><div class="round"><div class="cells">${cell(lead, "lead", "lead (opus): " + (lead || "no session"))}${cell(scan.some(a => a.state === "running") ? "live" : scan.length ? "done" : "skip", "haiku", `bounded-extractor (haiku): ${scan.length ? scan.length + " scan(s)" : "not used"}`)}</div></div></div>`;
  }
  const last = runs.length - 1, stage = stageOf(c), prefix = unitPrefix(runs.map(r => r.unit).filter(Boolean));
  const rows = runs.map((r, n) => {
    const at = x => roundOf(runs, x.at) === n;
    const chips = c.chips.filter(at), ags = agents.filter(at);
    const runTone = r.flags.length || r.state === "stalled" || r.state === "failed" ? "bad" : r.state === "running" ? "live" : "PASS";
    const after = n < last || r.state !== "running" && stage !== "build";
    const party = (kind, chipOf, label, name) => {
      const ch = chips.filter(chipOf).slice(-1)[0], ag = ags.filter(a => a.label.startsWith(kind));
      if (ag.some(a => a.state === "running")) return cell("live", label, `${name}: running`);
      if (ch) return cell(verdictTone(ch.verdict), label, `${name}: ${ch.verdict} · ${ch.label}`);
      if (ag.length) return cell("done", label, `${name}: ${ag.map(a => a.state).join(", ")}`);
      return cell(after ? "skip" : "", label, `${name}: ${after ? "not run" : "pending"}`);
    };
    const lead = n < last ? (r.sent_back ? "CHANGES" : "PASS") : stage === "review" ? "wait" : ["human", "merged"].includes(stage) ? "PASS" : "";
    const leadTitle = {CHANGES: "lead audit: sent back for a fix", PASS: "lead audit: accepted", wait: "lead audit: in progress", "": "lead audit: pending"}[lead];
    const label = r.unit ? r.unit.slice(prefix.length) || r.unit : "no brief recorded";
    return `<div class="round" title="${esc(r.unit || r.id)}"><div class="rl"><span>${n + 1}</span><b>${esc(label)}</b><span>${esc(r.model || r.engine)}</span></div><div class="cells">${cell(runTone, "run", `implementer ${r.engine} ${r.model || ""} · ${r.unit}: ${r.state}${r.flags.length ? " · " + r.flags.join(", ") : ""}`)}${party("test-runner", x => x.kind === "tests", "test", "test-runner")}${LENSES.map(([k, s]) => party("diff-reviewer", x => x.kind === k, s, "diff-reviewer " + k)).join("")}${cell(lead, "lead", leadTitle)}</div></div>`;
  });
  const hidden = rows.length - 3;
  return `<div class="rounds">${hidden > 0 ? `<div class="earlier">+${hidden} earlier run${hidden > 1 ? "s" : ""}</div>` : ""}${rows.slice(-3).join("")}</div>`;
}

function cardHtml(c) {
  const human = needsHuman(c);
  const live = c.sessions.some(s => s.state === "working") || c.runs.some(r => r.state === "running");
  const branch = c.tree ? c.tree.branch : (c.sessions[0] || {}).branch;
  const sess = c.sessions.map(s => s.name).filter(n => n !== c.title).join(", ");
  const sub = [c.label && c.label !== c.title && c.label !== branch ? c.label : "", sess, c.declared ? c.declared.note : ""].filter(Boolean).join(" · ");
  const flag = c.needs_you.length ? FLAG_TEXT[c.needs_you[0]] || c.needs_you[0] : human ? "your call" : "";
  const stopped = !live && c.sessions.length && c.sessions.every(s => s.state === "still_open") ? `<span class="chip st-stopped">stopped ${ago(Math.max(...c.sessions.map(s => s.updated)))} ago</span>` : "";
  const chips = [
    stopped,
    c.phase !== stageOf(c) && !["idle", "investigate"].includes(c.phase) ? `<span class="chip">${esc(c.phase)}</span>` : "",
    c.steps.length ? `<span class="chip" title="steps the lead listed">${stepsDone(c)}/${c.steps.length} steps</span>` : "",
    c.round > 1 ? `<span class="chip">round ${c.round}</span>` : "",
    ...c.needs_you.slice(1).map(f => `<span class="chip bad">${esc(FLAG_TEXT[f] || f)}</span>`),
    c.tree && c.tree.dirty ? `<span class="chip">${c.tree.dirty} uncommitted</span>` : "",
  ].join("");
  const paths = c.outside && c.outside.length ? `<div class="paths">${c.outside.slice(0, 4).map(esc).join("<br>")}${c.outside.length > 4 ? `<br>+${c.outside.length - 4} more` : ""}</div>` : "";
  const sid = ((c.now || [])[0] || c.sessions[0] || {}).id || "";
  return `<div class="card${live ? " live" : ""}${human ? " human" : ""}${QUIET.has(c.phase) && !human ? " quiet" : ""}" tabindex="0" data-key="${esc(c.key)}" data-sid="${esc(sid)}">
    <div class="card-top">${live ? '<span class="blink" aria-label="running"></span>' : ""}<span class="num">${esc(c.key.startsWith("session:") ? "session " + c.key.slice(8, 16) : c.key.split("/").pop())}</span>${flag ? `<span class="flag">${esc(flag)}</span>` : ""}</div>
    <p class="feature">${esc(c.title)}</p>
    ${branch ? `<div class="branch">${esc(branch)}</div>` : ""}
    ${sub ? `<div class="s">${esc(sub)}</div>` : ""}
    ${roundsHtml(c)}
    <div class="chips">${chips}</div>
    ${cardNow(c)}
    ${paths}
    ${human && sid ? `<div class="cardhint">claude --resume ${esc((sessionOf(sid) || {}).title ? `"${sessionOf(sid).title}"` : sid)}</div>` : ""}
    ${agentTiles(c)}
    <div class="foot"><span>${ago(c.updated)} ago</span><button class="dismiss" data-dismiss="${esc(c.key)}">Dismiss</button></div></div>`;
}

const sessionOf = sid => { for (const c of (state && state.cards) || []) for (const s of c.now || []) if (s.id === sid) return s; return null; };
const AGENT_NAMES = {"bounded-extractor": "haiku scan", "test-runner": "test-runner", "diff-reviewer": "diff-review", "general-purpose": "general", "Explore": "explore"};

function agentTiles(c) {
  const tiles = (c.now || []).flatMap(s => (s.agents || []).map(a => ({...a, sid: s.id})))
    .sort((a, b) => (b.state === "running") - (a.state === "running") || b.at - a.at);
  if (!tiles.length) return "";
  return `<div class="agents">${tiles.map(a => {
    const [kind, ...rest] = a.label.split(" · ");
    return `<button class="agent${a.state === "running" ? " running" : ""}" data-asid="${esc(a.sid)}" data-agent="${esc(a.id)}" aria-haspopup="dialog" title="${esc(a.label)} — ${esc(a.state)}"><b>${esc(AGENT_NAMES[kind] || kind)}</b><span>${esc(rest.join(" · ") || a.state)}</span></button>`;
  }).join("")}</div>`;
}

function cardNow(c) {
  const step = activeStep(c), s = (c.now || [])[0], wait = (c.now || []).find(x => x.state === "waiting" && x.need);
  const line = wait ? `Needs you: ${wait.need}` : step ? `▸ ${step.text}` : s && s.action && s.state === "working" ? s.action : s && s.ask ? `“${s.ask}”` : "";
  return line ? `<div class="act" title="${esc(line)}">${esc(line)}</div>` : "";
}

function nowHtml(s) {
  return `<div class="now">
    <div><b>${esc(s.name)}</b> <span class="chip ${s.state === "waiting" ? "st-waiting" : s.state === "working" ? "st-working" : ""}">${esc(STATE_TEXT[s.state] || s.state)}</span> <span class="s">last activity ${ago(s.updated)} ago</span></div>
    ${s.state === "waiting" && s.need ? `<div class="lbl">Needs from you</div><div class="snip" style="margin:0"><b>${esc(s.need)}</b></div>` : ""}
    ${s.ask ? `<div class="lbl">Latest request</div><div class="snip" style="margin:0">${esc(s.ask)}</div>` : ""}
    ${s.action ? `<div class="lbl">${s.state === "working" ? "Doing now" : "Last action"}</div><div class="s">${esc(s.action)}${s.action_at ? ` · ${ago(s.action_at)} ago` : ""}</div>` : ""}
    ${s.said ? `<div class="lbl">Last message from Claude</div><div class="snip" style="margin:0">${esc(s.said)}</div>` : ""}
  </div>`;
}

function resumeHtml(s) {
  const cmd = s.title ? `claude --resume "${s.title}"` : `claude --resume ${s.id}`;
  return `<div class="now">
    <div><b>${esc(s.title || s.name)}</b></div>
    <div class="lbl">Session id</div><div class="mono">${esc(s.id)}</div>
    <div class="lbl">Resume with</div><div class="mono">${esc(cmd)}</div>
  </div>`;
}

function stepsHtml(c) {
  if (!c.steps.length) return c.sessions.length ? '<div class="s">The lead has not listed its steps for this task yet; “Session” above shows what it is doing.</div>' : "";
  return `<ul class="steps">${c.steps.map(x => `<li class="${esc(x.state)}"><span class="mk" aria-label="${esc(x.state)}">${STEP_MARK[x.state] || "○"}</span><span class="tx">${esc(x.text)}</span>${x.note ? `<span class="nt">${esc(x.note)}</span>` : ""}</li>`).join("")}</ul>`;
}


function render() {
  if (!state) return;
  const cols = STAGES.map(s => ({...s, cards: state.cards.filter(c => stageOf(c) === s.key).sort((a, b) => rank(a) - rank(b) || b.updated - a.updated)}));
  document.getElementById("main").innerHTML = `<div class="board">${cols.map(s => {
    const loud = s.cards.filter(c => rank(c) < 3), quiet = s.cards.filter(c => rank(c) === 3);
    const open = expanded.has(s.key), shown = loud.concat(open ? quiet : quiet.slice(0, SHOWN));
    const more = quiet.length > SHOWN ? `<button class="more" data-more="${s.key}" aria-expanded="${open}">${open ? "Show fewer" : `Show all ${s.cards.length}`}</button>` : "";
    return `<section class="col ${s.key}${s.flow ? " flow" : ""}" aria-label="${s.label}">
      <div class="col-head"><h2>${s.label}</h2><span class="who" title="${esc(s.who)}">${esc(s.who)}</span><span class="count">${s.cards.length || ""}</span></div>
      ${shown.map(cardHtml).join("") || '<div class="none">—</div>'}${more}</section>`;
  }).join("")}</div>`;
  document.querySelectorAll("[data-key]").forEach(el => {
    el.onclick = () => openCard(el.dataset.key);
    el.onkeydown = e => { if ((e.key === "Enter" || e.key === " ") && e.target === el) { e.preventDefault(); openCard(el.dataset.key); } };
  });
  document.querySelectorAll("[data-dismiss]").forEach(el => el.onclick = ev => dismiss(el.dataset.dismiss, ev));
  document.querySelectorAll("[data-agent]").forEach(el => {
    el.onclick = ev => { ev.stopPropagation(); openAgent(el.dataset.asid, el.dataset.agent); };
    el.onkeydown = ev => ev.stopPropagation();
  });
  document.querySelectorAll("[data-more]").forEach(el => el.onclick = () => {
    const k = el.dataset.more;
    expanded.has(k) ? expanded.delete(k) : expanded.add(k);
    try { localStorage.setItem("fsa-expanded", JSON.stringify([...expanded])); } catch (e) {}
    render();
  });
}

const freshGit = () => ({sig: "", at: 0, items: null, open: {unc: true, com: true}, item: null, files: null, file: null, diff: ""});
let openKey = null, openRun = null, showLog = false, tab2 = "info", bodyKind = "", logSeen = "", logTimer = null, wasLive = false;
let git = {...freshGit(), hide1: false, hide2: false};
const LIVE = r => r.state === "running" || r.state === "stalled";
const stateChip = r => `<span class="chip ${r.flags.length ? "bad" : r.state === "done" ? "ok" : ""}">${esc(r.state)}</span>`;
const dur = r => {
  const s = Math.max(0, Math.round((LIVE(r) ? Date.now() / 1000 : r.updated) - (r.started || r.updated)));
  return s < 60 ? `${s}s` : s < 3600 ? `${Math.floor(s / 60)}m ${String(s % 60).padStart(2, "0")}s` : `${Math.floor(s / 3600)}h ${String(Math.floor(s % 3600 / 60)).padStart(2, "0")}m`;
};
const STEP_MARK = {done: "✓", active: "▸", skipped: "–", pending: "○"};
const STATE_TEXT = {working: "working", waiting: "waiting on you", idle: "just finished a turn", still_open: "stopped", quiet: "no output for 5+ min"};
const stepsDone = c => c.steps.filter(x => x.state === "done" || x.state === "skipped").length;
const activeStep = c => c.steps.find(x => x.state === "active");
const panel = () => document.getElementById("panel");
const enc = encodeURIComponent;

function setIfChanged(id, html) {
  const el = document.getElementById(id);
  if (!el || el.dataset.h === html) return false;
  const gb = el.querySelector(".gb"), top = gb ? gb.scrollTop : 0, left = gb ? gb.scrollLeft : 0, own = el.scrollTop;
  const lg = el.querySelector("pre.log"), lt = lg ? lg.scrollTop : 0, stick = !lg || lg.scrollHeight - lg.scrollTop - lg.clientHeight < 40;
  el.innerHTML = html;
  el.dataset.h = html;
  const nb = el.querySelector(".gb");
  if (nb) { nb.scrollTop = top; nb.scrollLeft = left; }
  const nl = el.querySelector("pre.log");
  if (nl) nl.scrollTop = stick ? nl.scrollHeight : lt;
  el.scrollTop = own;
  return true;
}

function ensureBody(kind, html, onNew) {
  if (bodyKind === kind) return;
  bodyKind = kind;
  document.getElementById("pbody").innerHTML = html;
  if (onNew) onNew();
}

const paneHead = c => `<button class="dismiss close" id="close">Close</button>
  <h3>${esc(c.title)}</h3>
  ${c.tree ? `<div style="font:12px ui-monospace,monospace;color:var(--blue)">${esc(c.tree.branch)}</div>` : ""}
  <div class="s">${esc(c.phase)}${c.tree ? ` · ${c.tree.ahead} ahead · ${c.tree.dirty} uncommitted` : ""}</div>`;

const tabsHtml = c => `<button class="tab2" role="tab" data-t="info" aria-selected="${tab2 === "info"}">Information</button>
  <button class="tab2" role="tab" data-t="git" aria-selected="${tab2 === "git"}" ${c.tree ? "" : "disabled"}>Git changes${c.tree && c.tree.dirty ? ` <span class="badge">${c.tree.dirty}</span>` : ""}</button>`;

function detailHtml(r) {
  const live = LIVE(r);
  const tone = live ? "live" : r.flags.length || r.state !== "done" ? "bad" : "ok";
  const flags = r.flags.map(f => `<span class="chip bad">${esc(FLAG_TEXT[f] || f)}</span>`).join(" ");
  return `<div class="detail">
    <div><b>End of task</b> ${stateChip(r)} ${flags}</div>
    ${live ? '<div class="s">Still running — the result lands here when it finishes.</div>' : r.summary ? `<pre>${esc(r.summary)}</pre>` : '<div class="s">No result text was recorded.</div>'}
    ${r.open_risks.length ? `<div class="s"><b>Open risks:</b> ${esc(r.open_risks.join(" · "))}</div>` : ""}
    <div class="row" style="margin:6px 0 0"><button class="dismiss" data-log="1" style="margin-left:0">${showLog ? "Hide log" : "Show log"}</button></div>
    ${showLog ? `<pre class="log" id="log">${esc(logSeen || "loading…")}</pre>` : ""}
    <div class="endbar ${tone}"><button class="dismiss" data-collapse="1" title="Collapse this task">Hide ▴</button></div>
  </div>`;
}

function infoHtml(c) {
  const tasks = c.runs.map(r => {
    const open = openRun === r.id;
    return `<li class="task${open ? " open" : ""}" data-run="${esc(r.id)}">
      <input type="checkbox" disabled ${r.state === "done" ? "checked" : ""} aria-label="${esc(r.state)}">
      <div class="th"><span class="tn">${esc(r.unit || r.id)}</span> ${stateChip(r)} <span class="s">${LIVE(r) ? `<span class="live-dot"></span>running ${dur(r)}` : `took ${dur(r)} · ${ago(r.updated)} ago`}</span><span class="caret">${open ? "▾" : "▸"}</span></div>
      ${r.goal ? `<div class="snip tg">${esc(r.goal)}</div>` : ""}
      ${open ? detailHtml(r) : ""}</li>`;
  }).join("");
  const desc = c.desc || c.goal;
  const steps = stepsHtml(c);
  return `${c.now && c.now.length ? `<h4>Session id</h4>${c.now.map(resumeHtml).join("")}` : ""}
    ${c.now && c.now.length ? `<h4>Session</h4>${c.now.map(nowHtml).join("")}` : ""}
    ${steps ? `<h4>Steps${c.steps.length ? ` · ${stepsDone(c)}/${c.steps.length}` : ""}</h4>${steps}` : ""}
    ${c.declared && c.declared.note ? `<h4>Phase note</h4><div class="snip">${esc(c.declared.note)}</div>` : ""}
    ${desc ? `<h4>Brief</h4><div class="snip">${esc(desc)}</div>` : ""}
    <h4>Implementer runs</h4>${tasks ? `<ul class="tasks">${tasks}</ul>` : '<div class="s">None — no code has been handed to an implementer for this task.</div>'}`;
}

async function pollLog(id) {
  if (document.hidden) return;
  try {
    const t = await (await fetch("/api/log?id=" + enc(id), {cache: "no-store"})).text();
    if (openRun !== id || !showLog || t === logSeen) return;
    logSeen = t || "(log is empty)";
    paintPanel();
  } catch (e) {}
}

function stopLog() { clearInterval(logTimer); logTimer = null; }

function wireInfo() {
  document.querySelectorAll("#info .task").forEach(li => li.onclick = ev => { if (!ev.target.closest(".detail")) toggleTask(li.dataset.run); });
  const lb = document.querySelector("#info [data-log]");
  if (lb) lb.onclick = ev => { ev.stopPropagation(); showLog = !showLog; logSeen = ""; stopLog(); paintPanel(); };
  const cb = document.querySelector("#info [data-collapse]");
  if (cb) cb.onclick = ev => { ev.stopPropagation(); toggleTask(openRun); };
}

function paintInfo(c) {
  if (openRun && !c.runs.some(x => x.id === openRun)) { openRun = null; showLog = false; stopLog(); }
  ensureBody("info", '<div id="info"></div>');
  if (setIfChanged("info", infoHtml(c))) wireInfo();
  const r = openRun && c.runs.find(x => x.id === openRun);
  if (!r || !showLog) return stopLog();
  if (LIVE(r)) {
    wasLive = true;
    if (!logTimer) { pollLog(r.id); logTimer = setInterval(() => pollLog(r.id), 2500); }
  } else {
    stopLog();
    if (wasLive || !logSeen) { wasLive = false; pollLog(r.id); }
  }
}

function toggleTask(id) {
  openRun = openRun === id ? null : id;
  showLog = false;
  logSeen = "";
  wasLive = false;
  stopLog();
  paintPanel();
}

const stc = s => s === "?" ? "U" : s;
const diffHtml = t => (t || "").split("\n").map(l => `<span class="${l.startsWith("+") && !l.startsWith("+++") ? "a" : l.startsWith("-") && !l.startsWith("---") ? "d" : l.startsWith("@@") ? "h" : ""}">${esc(l) || "&#8203;"}</span>`).join("");

function col1Html(c) {
  if (git.hide1) return '<button class="rail" data-show="1" title="Show changes" aria-label="Show changes">»</button>';
  const it = git.items, unc = it ? it.dirty : c.tree ? c.tree.dirty : 0, n = it ? it.commits.length : 0;
  let h = '<div class="gh"><span class="gt">Changes</span><button class="dismiss" data-hide="1" title="Hide changes">Hide «</button></div><div class="gb">';
  h += `<button class="grp" data-g="unc">${git.open.unc ? "▾" : "▸"} Uncommitted changes <span class="badge">${unc}</span></button>`;
  if (git.open.unc) h += unc ? `<button class="gi${git.item === "WORKTREE" ? " on" : ""}" data-ref="WORKTREE"><b>Working tree</b><span class="sub">${unc} file${unc === 1 ? "" : "s"} · not committed yet</span></button>` : '<div class="hint">Working tree is clean.</div>';
  h += `<button class="grp" data-g="com">${git.open.com ? "▾" : "▸"} ${it && it.recent ? "Recent commits" : "Commits ahead of main"} <span class="badge">${n}</span></button>`;
  if (git.open.com) h += !it ? '<div class="hint">Loading…</div>' : n ? it.commits.map(m => `<button class="gi${git.item === m.sha ? " on" : ""}" data-ref="${esc(m.sha)}"><span class="sha">${esc(m.sha)}</span>${esc(m.subject)}<span class="sub">${ago(m.at)} ago</span></button>`).join("") : '<div class="hint">No commits.</div>';
  return h + "</div>";
}

function col2Html() {
  if (git.hide2) return '<button class="rail" data-show="2" title="Show files" aria-label="Show files">»</button>';
  let h = '<div class="gh"><span class="gt">Files</span><button class="dismiss" data-hide="2" title="Hide files">Hide «</button></div><div class="gb">';
  if (!git.item) h += '<div class="hint">Pick a change on the left.</div>';
  else if (!git.files) h += '<div class="hint">Loading…</div>';
  else if (!git.files.length) h += '<div class="hint">No files.</div>';
  else h += git.files.map(f => {
    const i = f.path.lastIndexOf("/");
    return `<button class="gf${git.file === f.path ? " on" : ""}" data-file="${esc(f.path)}"><span class="st st-${esc(stc(f.status))}">${esc(f.status)}</span><span class="fn">${esc(f.path.slice(i + 1))}</span><span class="fd">${esc(i < 0 ? "" : f.path.slice(0, i))}</span></button>`;
  }).join("");
  return h + "</div>";
}

const col3Html = () => `<div class="gh"><span class="gt">${esc(git.file || "Changes")}</span></div><div class="gb">${git.file ? `<pre class="diff">${diffHtml(git.diff)}</pre>` : '<div class="hint">Pick a file to see its changes.</div>'}</div>`;

function wireGit(c) {
  const root = document.querySelector(".gitview");
  if (!root) return;
  root.querySelectorAll("[data-g]").forEach(b => b.onclick = () => { git.open[b.dataset.g] = !git.open[b.dataset.g]; paintGit(c); });
  root.querySelectorAll("[data-ref]").forEach(b => b.onclick = () => pickItem(c, b.dataset.ref));
  root.querySelectorAll("[data-file]").forEach(b => b.onclick = () => pickFile(c, b.dataset.file));
  root.querySelectorAll("[data-hide]").forEach(b => b.onclick = () => { git["hide" + b.dataset.hide] = true; paintGit(c); });
  root.querySelectorAll("[data-show]").forEach(b => b.onclick = () => { git["hide" + b.dataset.show] = false; paintGit(c); });
}

function paintGit(c) {
  ensureBody("git", '<div class="gitview"><section class="gcol g1" id="g1"></section><section class="gcol g2" id="g2"></section><section class="gcol g3" id="g3"></section></div>');
  document.getElementById("g1").classList.toggle("hid", git.hide1);
  document.getElementById("g2").classList.toggle("hid", git.hide2);
  const changed = [setIfChanged("g1", col1Html(c)), setIfChanged("g2", col2Html()), setIfChanged("g3", col3Html())];
  if (changed.some(Boolean)) wireGit(c);
}

async function getJson(url) { return (await fetch(url, {cache: "no-store"})).json(); }

async function loadChanges(c, force) {
  const sig = c.tree ? `${c.tree.head}|${c.tree.dirty}|${c.tree.edited}` : "";
  if (!force && git.items && git.sig === sig && Date.now() - git.at < 15000) return;
  git.sig = sig;
  git.at = Date.now();
  try { git.items = await getJson("/api/changes?key=" + enc(c.key)); } catch (e) { return; }
  if (openKey !== c.key || tab2 !== "git") return;
  const it = git.items, pick = it.dirty ? "WORKTREE" : (it.commits[0] || {}).sha;
  if (!git.item && pick) return pickItem(c, pick);
  paintGit(c);
  if (git.item) loadFiles(c);
}

function pickItem(c, ref) {
  git.item = ref;
  git.files = null;
  git.file = null;
  git.diff = "";
  paintGit(c);
  loadFiles(c);
}

async function loadFiles(c) {
  const ref = git.item;
  if (!ref) return;
  try { git.files = await getJson(`/api/files?key=${enc(c.key)}&ref=${enc(ref)}`); } catch (e) { return; }
  if (git.item !== ref || openKey !== c.key) return;
  if (git.file && !git.files.some(f => f.path === git.file)) git.file = null;
  if (!git.file && git.files.length) return pickFile(c, git.files[0].path);
  paintGit(c);
  if (git.file) loadGitDiff(c);
}

function pickFile(c, path) {
  git.file = path;
  git.diff = "";
  paintGit(c);
  const gb = document.querySelector("#g3 .gb");
  if (gb) { gb.scrollTop = 0; gb.scrollLeft = 0; }
  loadGitDiff(c);
}

async function loadGitDiff(c) {
  const ref = git.item, path = git.file;
  if (!ref || !path) return;
  try {
    const t = await (await fetch(`/api/diff?key=${enc(c.key)}&ref=${enc(ref)}&path=${enc(path)}`, {cache: "no-store"})).text();
    if (git.item !== ref || git.file !== path) return;
    git.diff = t;
    paintGit(c);
  } catch (e) {}
}

function paintPanel() {
  const c = openKey && state && state.cards.find(x => x.key === openKey);
  if (!c) return closePanel();
  const p = panel();
  if (!document.getElementById("pbody")) {
    p.innerHTML = '<div id="phead"></div><div class="ptabs" id="ptabs" role="tablist"></div><div class="pbody" id="pbody"></div>';
    bodyKind = "";
  }
  if (setIfChanged("phead", paneHead(c))) document.getElementById("close").onclick = closePanel;
  if (setIfChanged("ptabs", tabsHtml(c))) document.querySelectorAll("#ptabs [data-t]").forEach(b => b.onclick = () => { tab2 = b.dataset.t; paintPanel(); });
  if (tab2 === "git" && c.tree) {
    stopLog();
    paintGit(c);
    loadChanges(c, false);
  } else {
    paintInfo(c);
  }
}

function openCard(key) {
  if (openKey !== key) git = {...freshGit(), hide1: git.hide1, hide2: git.hide2};
  openKey = key;
  openRun = null;
  showLog = false;
  logSeen = "";
  tab2 = "info";
  bodyKind = "";
  panel().innerHTML = "";
  panel().classList.add("open");
  document.documentElement.classList.add("lock");
  paintPanel();
}

function closePanel() {
  stopLog();
  openKey = openRun = null;
  showLog = false;
  bodyKind = "";
  git = {...freshGit(), hide1: git.hide1, hide2: git.hide2};
  panel().classList.remove("open");
  panel().innerHTML = "";
  document.documentElement.classList.remove("lock");
}

function toast(text, tone, target) {
  const t = document.createElement("div");
  t.className = "toast " + tone;
  t.innerHTML = text;
  t.onclick = () => { if (target) openCard(target); t.remove(); };
  document.getElementById("toasts").appendChild(t);
  setTimeout(() => t.remove(), 15000);
}

function notify() {
  const ids = {waiting: new Set(state.waiting.map(s => s.key + s.updated)), still_open: new Set(state.still_open.map(s => s.key + s.updated))};
  if (seen) {
    state.waiting.filter(s => !seen.waiting.has(s.key + s.updated)).forEach(s => toast(`<b>Needs you:</b> ${esc(s.name)}<div class="s">${esc(s.snippet.slice(-140))}</div>`, "", s.card));
    state.still_open.filter(s => !seen.still_open.has(s.key + s.updated)).forEach(s => toast(`<b>Stopped:</b> ${esc(s.name)}`, "blue", s.card));
  }
  seen = ids;
  const n = state.cards.filter(needsHuman).length;
  document.title = n ? `(${n}) Agents` : "Agents";
}


async function load() {
  try {
    const r = await fetch("/api/state", {cache: "no-store"});
    if (!r.ok) throw new Error(r.status);
    state = await r.json();
    if (uiSeen && state.ui && uiSeen !== state.ui) return location.reload();
    uiSeen = state.ui;
    const meta = document.getElementById("meta");
    meta.title = state.repo;
    meta.className = "status";
    meta.innerHTML = `<span class="dot"></span>${esc(state.repo.split("/").pop())} · ${state.locks.deploy ? '<span class="lock">deploy lock held</span> · ' : ""}${new Date(state.generated * 1000).toLocaleTimeString()}`;
    notify();
    render();
    if (openKey) paintPanel();
  } catch (e) {
    const meta = document.getElementById("meta");
    meta.className = "status error";
    meta.innerHTML = '<span class="dot"></span>offline — retrying';
  }
}

function copyText(text) {
  if (navigator.clipboard && window.isSecureContext) return navigator.clipboard.writeText(text);
  const ta = document.createElement("textarea");
  ta.value = text;
  ta.style.position = "fixed";
  ta.style.opacity = "0";
  (document.querySelector("dialog[open]") || document.body).appendChild(ta);
  ta.select();
  const ok = document.execCommand("copy");
  ta.remove();
  return ok ? Promise.resolve() : Promise.reject(new Error("copy failed"));
}

let out = null, outTimer = null;
const outEl = id => document.getElementById(id);

function outItems() {
  return (sessionOf(out.sid) || {}).agents || [];
}

function paintOutItems() {
  const items = outItems();
  if (!items.some(x => x.id === out.id) && items.length) out.id = items[0].id;
  const cur = items.find(x => x.id === out.id);
  outEl("out-title").textContent = "Subagents · " + ((sessionOf(out.sid) || {}).name || out.sid);
  outEl("out-meta").textContent = cur ? cur.state : "";
  outEl("out-items").innerHTML = items.map(x => `<button data-oid="${esc(x.id)}" aria-pressed="${x.id === out.id}" title="${esc(x.label)}">${x.state === "running" ? '<span class="live-dot"></span>' : ""}${esc(x.label || x.id)}</button>`).join("");
  outEl("out-items").querySelectorAll("[data-oid]").forEach(b => b.onclick = () => { out.id = b.dataset.oid; out.text = null; outEl("out-pre").textContent = "loading…"; paintOutItems(); pollOutput(); });
}

async function pollOutput() {
  if (!out || document.hidden) return;
  const want = {...out};
  try {
    const r = await fetch(`/api/output?sid=${enc(want.sid)}&id=${enc(want.id)}`, {cache: "no-store"});
    const text = r.ok ? await r.text() : r.status === 404 ? "(this subagent is no longer listed)" : `(error ${r.status})`;
    if (!out || out.sid !== want.sid || out.id !== want.id || text === out.text) return;
    const pre = outEl("out-pre"), atEnd = out.text === null || pre.scrollHeight - pre.scrollTop - pre.clientHeight < 40;
    out.text = text;
    pre.textContent = text || "(no output yet)";
    if (atEnd) pre.scrollTop = pre.scrollHeight;
  } catch (e) {}
}

function openAgent(sid, id) {
  out = {sid, id, text: null};
  outEl("out-pre").textContent = "loading…";
  paintOutItems();
  outEl("out").showModal();
  pollOutput();
  clearInterval(outTimer);
  outTimer = setInterval(() => { if (out) { paintOutItems(); pollOutput(); } }, 3000);
}

outEl("out").addEventListener("close", () => { out = null; clearInterval(outTimer); outTimer = null; });
outEl("out-close").onclick = () => outEl("out").close();
outEl("out-copy").onclick = () => {
  const b = outEl("out-copy"), done = label => { b.textContent = label; setTimeout(() => { b.textContent = "Copy"; }, 1500); };
  copyText(outEl("out-pre").textContent).then(() => done("Copied"), () => done("Copy failed"));
};

let ctxCard = null;
const ctx = () => document.getElementById("ctx");

function closeCtx() {
  if (ctx().hidden) return false;
  ctx().hidden = true;
  if (ctxCard && document.contains(ctxCard)) ctxCard.focus();
  ctxCard = null;
  return true;
}

function openCtx(card, x, y) {
  ctxCard = card;
  const m = ctx(), d = card.querySelector("[data-dismiss]");
  m.querySelector('[data-act="open"]').disabled = !card.dataset.key;
  m.querySelector('[data-act="copy"]').disabled = !card.dataset.sid;
  m.querySelector('[data-act="dismiss"]').disabled = !d;
  m.hidden = false;
  m.style.left = Math.max(8, Math.min(x, innerWidth - m.offsetWidth - 8)) + "px";
  m.style.top = Math.max(8, Math.min(y, innerHeight - m.offsetHeight - 8)) + "px";
  const first = m.querySelector("button:not(:disabled)");
  if (first) first.focus();
}

document.addEventListener("contextmenu", e => {
  const card = e.target.closest("#main .card");
  if (!card) return closeCtx();
  e.preventDefault();
  const r = card.getBoundingClientRect();
  openCtx(card, e.clientX || r.left + 12, e.clientY || r.top + 12);
});
document.addEventListener("click", e => { if (!e.target.closest("#ctx")) closeCtx(); });
addEventListener("scroll", closeCtx, true);
addEventListener("resize", closeCtx);
ctx().addEventListener("keydown", e => {
  if (e.key !== "ArrowDown" && e.key !== "ArrowUp") return;
  e.preventDefault();
  const items = [...ctx().querySelectorAll("button:not(:disabled)")], i = items.indexOf(document.activeElement);
  items[(i + (e.key === "ArrowDown" ? 1 : items.length - 1)) % items.length].focus();
});
ctx().addEventListener("click", e => {
  const b = e.target.closest("[data-act]");
  if (!b || b.disabled || !ctxCard) return;
  const card = ctxCard, act = b.dataset.act;
  closeCtx();
  if (act === "open") openCard(card.dataset.key);
  else if (act === "copy") copyText(card.dataset.sid).then(() => toast(`<b>Copied</b> ${esc(card.dataset.sid)}`, "blue"), () => toast("<b>Copy failed</b>", "red"));
  else dismiss(card.querySelector("[data-dismiss]").dataset.dismiss);
});

document.addEventListener("keydown", e => { if (e.key !== "Escape" || out) return; if (closeCtx()) return; if (openRun) toggleTask(openRun); else closePanel(); });
document.addEventListener("visibilitychange", () => { if (!document.hidden && openRun) pollLog(openRun); });
load();
setInterval(load, 4000);
</script>
</body>
</html>
