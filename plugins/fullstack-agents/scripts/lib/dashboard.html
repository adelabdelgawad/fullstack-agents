<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Agents</title>
<link rel="stylesheet" href="/static/xterm/xterm.css">
<link rel="stylesheet" href="/static/fleet.css">
<script src="/static/fleet.js"></script>
<script src="/static/orchestrators.js"></script>
<style>
:root {
  --bg: #f4f5f8; --panel: #ffffff; --card: #ffffff; --card-hover: #f7f8fb; --ink: #1b1d26; --muted: #5d6273; --faint: #8b90a3; --line: #dfe2ea;
  --active: #2563eb; --pass: #1d7f3e; --changes: #a85a00; --human: #b0246f;
  --amber: #a85a00; --amber-bg: #fff1dd; --blue: #2563eb; --blue-bg: #e6eefe;
  --red: #b42318; --red-bg: #fde8e6; --green: #1d7f3e; --green-bg: #e2f4e8; --chip: #eef0f5; --yellow: #a85a00;
  --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0b0f17; --panel: #0f1520; --card: #141b27; --card-hover: #18212f; --ink: #e5e9f0; --muted: #8c96a8; --faint: #5d6779; --line: #222b3a;
    --active: #4f8ff7; --pass: #4ade80; --changes: #f2b24c; --human: #f472b6;
    --amber: #f2b24c; --amber-bg: #2e2412; --blue: #4f8ff7; --blue-bg: #14233d;
    --red: #f47272; --red-bg: #33171b; --green: #4ade80; --green-bg: #12291c; --chip: #1b2331; --yellow: #f2b24c;
  }
}
:root[data-theme="dark"] {
    --bg: #0b0f17; --panel: #0f1520; --card: #141b27; --card-hover: #18212f; --ink: #e5e9f0; --muted: #8c96a8; --faint: #5d6779; --line: #222b3a;
    --active: #4f8ff7; --pass: #4ade80; --changes: #f2b24c; --human: #f472b6;
    --amber: #f2b24c; --amber-bg: #2e2412; --blue: #4f8ff7; --blue-bg: #14233d;
    --red: #f47272; --red-bg: #33171b; --green: #4ade80; --green-bg: #12291c; --chip: #1b2331; --yellow: #f2b24c;
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 14px/1.5 -apple-system, BlinkMacSystemFont, "Inter", "Segoe UI", sans-serif; -webkit-font-smoothing: antialiased; }
.action-button { margin-left: auto; border: 1px solid var(--line); background: var(--panel); color: var(--muted); border-radius: 6px; font-size: 11px; padding: 2px 8px; cursor: pointer; }
.action-button:hover { color: var(--ink); border-color: var(--muted); }
header { display: flex; align-items: baseline; justify-content: space-between; gap: 16px; flex-wrap: wrap; padding: 24px 32px 4px; }
header h1 { margin: 0; font-size: 18px; font-weight: 600; letter-spacing: -0.01em; }
.viewtabs { display: inline-flex; gap: 3px; padding: 3px; border: 1px solid var(--line); border-radius: 8px; background: var(--panel); }
.viewtab { border: 0; border-radius: 5px; padding: 4px 11px; background: none; color: var(--muted); font: inherit; font-weight: 600; cursor: pointer; }
.viewtab[aria-selected="true"] { background: var(--chip); color: var(--ink); }
.status { font-family: var(--mono); font-size: 12px; color: var(--muted); }
.status .dot { display: inline-block; width: 7px; height: 7px; border-radius: 50%; background: var(--pass); margin-right: 6px; vertical-align: 1px; }
.status.error { color: var(--human); }
.status.error .dot { background: var(--human); }
.status .lock { color: var(--changes); }
.hright { display: flex; align-items: center; gap: 16px; flex-wrap: wrap; }
.favsw { display: inline-flex; align-items: center; gap: 8px; border: 0; background: none; color: var(--muted); font: inherit; font-size: 12px; cursor: pointer; padding: 2px 0; }
.favsw[hidden], .newsess[hidden] { display: none; }
.newsess { border: 1px solid var(--line); border-radius: 6px; background: none; color: var(--ink); font: inherit; font-size: 12px; padding: 3px 10px; cursor: pointer; }
.newsess:hover { border-color: var(--ink); }
.favsw:hover { color: var(--ink); }
.favsw:focus-visible { outline: 2px solid var(--active); outline-offset: 2px; border-radius: 4px; }
.favsw .track { position: relative; width: 28px; height: 16px; border-radius: 8px; background: var(--line); transition: background .15s; }
.favsw .track::after { content: ""; position: absolute; top: 2px; left: 2px; width: 12px; height: 12px; border-radius: 50%; background: var(--panel); box-shadow: 0 1px 2px rgba(0,0,0,.3); transition: left .15s; }
.favsw[aria-checked="true"] { color: var(--ink); }
.favsw[aria-checked="true"] .track { background: var(--amber); }
.favsw[aria-checked="true"] .track::after { left: 14px; }
@keyframes pulse { 50% { transform: scale(1.25); } }
@keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: .25; } }
@keyframes breathe { 0%, 100% { opacity: 1; } 50% { opacity: .45; } }
main { padding: 0; }
.card { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 11px 12px 9px; margin-bottom: 10px; cursor: pointer; transition: background .15s, border-color .15s, transform .15s; }
.card:hover { background: var(--card-hover); transform: translateY(-1px); }
.card:focus-visible { outline: 2px solid var(--active); outline-offset: 2px; }
.card.live { border-color: color-mix(in srgb, var(--active) 40%, var(--line)); }
.card.human { border-color: var(--human); box-shadow: 0 0 0 1px color-mix(in srgb, var(--human) 40%, transparent), 0 8px 24px -12px color-mix(in srgb, var(--human) 60%, transparent); }
.card.quiet:not(:hover):not(:focus-within) { opacity: .72; }
.star { margin-left: auto; flex: none; border: 0; background: none; padding: 0 2px; font-size: 15px; line-height: 1; color: var(--faint); cursor: pointer; }
.star:hover { color: var(--amber); }
.star:focus-visible { outline: 2px solid var(--active); outline-offset: 1px; border-radius: 4px; }
.star[aria-pressed="true"] { color: var(--amber); }
.flag + .star { margin-left: 0; }
.flag { margin-left: auto; flex: none; font-size: 10px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--human); white-space: nowrap; }
.card .t { font-size: 13px; font-weight: 600; line-height: 1.4; word-break: break-word; }
.card .s { color: var(--muted); font-size: 12px; margin-top: 2px; word-break: break-word; }
.feature { font-size: 13px; line-height: 1.4; margin: 0 0 4px; word-break: break-word; display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 2; overflow: hidden; flex: none; }
.wt { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 6px; width: 100%; min-width: 0; padding: 4px 6px; border: 1px solid var(--line); border-radius: 6px; background: transparent; color: inherit; font: 11px var(--mono); text-align: left; cursor: pointer; }
.wt:hover, .wt:focus-visible, .wt[aria-current="true"] { background: var(--card-hover); border-color: var(--blue); }
.wt .wt-name { flex: 1 1 100%; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.wt .chip { margin: 0; }
.wtbar { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 8px; }
.wtbar .wt { width: auto; max-width: 100%; flex-wrap: nowrap; }
.wtbar .wt .wt-name { flex: 0 1 auto; }
.branch { font: 11px var(--mono); color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.rounds { margin-top: 10px; display: grid; gap: 5px; }
.round { display: grid; gap: 2px; }
.cell { flex: 1; min-width: 0; text-align: center; font: 10px/1.3 var(--mono); padding: 2px 0; border-radius: 4px; border: 1px dashed var(--faint); color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: clip; }
.cell.wait, .cell.live { border-style: solid; border-color: color-mix(in srgb, var(--active) 55%, transparent); color: var(--active); animation: breathe 1.6s ease-in-out infinite; }
.cell.PASS { border: 1px solid transparent; color: var(--pass); background: color-mix(in srgb, var(--pass) 14%, transparent); }
.cell.CHANGES { border: 1px solid transparent; color: var(--changes); background: color-mix(in srgb, var(--changes) 16%, transparent); }
.cell.bad { border: 1px solid var(--human); color: var(--human); }
.cell[role="button"] { cursor: pointer; }
.cell[role="button"]:hover, .cell[role="button"]:focus-visible { text-decoration: underline; outline: 1px solid var(--active); }
.cell.done { border: 1px solid var(--line); color: var(--muted); }
.chips { display: flex; gap: 4px; flex-wrap: wrap; margin-top: 6px; }
.chips:empty { display: none; }
.chip { font: 10.5px var(--mono); padding: 1px 6px; border-radius: 4px; background: var(--chip); color: var(--muted); }
.chip.ok { background: color-mix(in srgb, var(--pass) 14%, transparent); color: var(--pass); }
.chip.bad { background: color-mix(in srgb, var(--human) 14%, transparent); color: var(--human); }
.chip.st-working { background: color-mix(in srgb, var(--active) 14%, transparent); color: var(--active); }
.paths { font: 11px/1.4 var(--mono); color: var(--human); margin-top: 6px; word-break: break-all; }
@media (hover: hover) { .card .foot .action-button { opacity: 0; } .card:hover .foot .action-button, .card:focus-within .foot .action-button { opacity: 1; } }
.row { display: flex; gap: 8px; align-items: center; margin-top: 8px; }
.list { display: grid; gap: 10px; max-width: 980px; }
.list .card { cursor: default; }
.snip { white-space: pre-wrap; margin-top: 6px; font-size: 13px; }
.said-full table.md { border-collapse: collapse; margin: 6px 0; font-size: 12px; }
.said-full table.md th, .said-full table.md td { border: 1px solid var(--line); padding: 3px 6px; text-align: left; vertical-align: top; }
.said-full table.md th { white-space: nowrap; }
.said-full .mdh { font-weight: 600; margin-top: 8px; }
.said-full .mdgap { height: 6px; }
.said-full code { font: 12px var(--mono); }
.docs { max-height: calc(5 * 26px); overflow-y: auto; font-size: 12px; }
.doc { line-height: 26px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.doc .s { margin-left: 4px; }
.copy-ico { vertical-align: middle; margin-left: 4px; padding: 2px 4px; border: 1px solid transparent; border-radius: 4px; background: none; color: var(--muted); cursor: pointer; line-height: 0; }
.copy-ico:hover, .copy-ico:focus-visible { color: var(--ink); border-color: var(--line); }
.copy-ico.ok { color: #2e8b57; }
.said-full { font-size: 13px; line-height: 1.45; margin: 0; max-height: 60vh; overflow: auto; overflow-wrap: anywhere; border-left: 2px solid var(--line); padding-left: 8px; }
.mono { font: 12px ui-monospace, monospace; user-select: all; word-break: break-all; }
.empty { color: var(--muted); padding: 20px 0; }
aside { position: fixed; top: 0; right: 0; bottom: 0; width: min(1280px, 96vw); background: var(--panel); border-left: 1px solid var(--line); display: flex; flex-direction: column; overflow: hidden; transform: translateX(100%); transition: transform .18s, width .18s; z-index: 10; }
aside.open { transform: none; }
html.lock, html.lock body { overflow: hidden; }
html.herdr-page, html.herdr-page body { height: 100%; overflow: hidden; }
html.herdr-page body { display: flex; flex-direction: column; }
html.herdr-page header { flex: none; }
html.herdr-page main { flex: 1; min-height: 0; }
aside h3 { margin: 0 0 4px; font-size: 16px; }
aside h4 { margin: 14px 0 4px; font-size: 12px; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); }
aside pre { background: var(--chip); padding: 10px; border-radius: 8px; white-space: pre-wrap; word-break: break-word; font-size: 12px; max-height: 360px; overflow: auto; }
#phead { flex: none; padding: 16px 18px 6px; }
#phead .close { float: right; }
.ptabs { flex: none; display: flex; gap: 4px; padding: 0 18px; border-bottom: 1px solid var(--line); }
.tab2 { border: 0; background: none; color: var(--muted); font: inherit; padding: 8px 12px; cursor: pointer; border-bottom: 2px solid transparent; display: flex; gap: 6px; align-items: center; }
.tab2[aria-selected="true"] { color: var(--ink); font-weight: 600; border-bottom-color: var(--blue); }
.tab2:disabled { opacity: .4; cursor: default; }
.pbody { flex: 1; min-height: 0; display: flex; flex-direction: column; }
.info-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; align-items: start; }
.info-card { border: 1px solid var(--line); border-radius: 6px; padding: 12px; min-width: 0; }
.info-card h4 { margin: 0 0 10px; }
.info-card summary { cursor: pointer; font-weight: 600; }
.info-top > summary h4 { display: inline; margin: 0 8px 0 0; font: inherit; text-transform: none; letter-spacing: normal; color: inherit; }
.info-top[open] > summary { margin-bottom: 10px; }
.info-top.live { grid-column: 1 / -1; }
.live-group { margin-top: 10px; }
.live-group h5 { margin: 0 0 4px; font-size: 12px; display: flex; gap: 6px; align-items: center; }
.live-group .agents { grid-template-columns: repeat(auto-fill, minmax(min(100%, 220px), 1fr)); margin-top: 0; }
.live-group .agent { font-size: 11px; }
.live-lead { margin-bottom: 4px; overflow-wrap: anywhere; min-width: 0; }
.lead-act { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.ask-q { color: var(--amber); font-size: 12px; overflow-wrap: anywhere; }
.card .ask-q { margin-top: 6px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.work { display: block; width: 100%; text-align: left; border: 1px solid var(--line); background: var(--bg); color: var(--ink); border-radius: 6px; padding: 5px 7px; cursor: pointer; font: inherit; }
.work:hover, .work:focus-visible { border-color: var(--active); }
.overview { margin-top: 6px; }
.ov-live { background: var(--active); }
.ov-done { background: var(--pass); opacity: .7; }
.ov-bad { background: var(--red); }
.live-top { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.live-top > .action-button { margin-left: 0; }
.live-top > div { flex: 1; min-width: 0; }
.pill { display: inline-block; font: 10.5px/1.5 var(--mono); padding: 0 7px; border-radius: 999px; background: var(--chip); color: var(--muted); white-space: nowrap; }
.pill.live { background: var(--green-bg); color: var(--green); }
.pill.bad { background: var(--red-bg); color: var(--red); }
.pill.warn { background: var(--amber-bg); color: var(--amber); }
.ls-time { margin-left: auto; color: var(--faint); font: 11px var(--mono); white-space: nowrap; }
.ls-sub { color: var(--muted); font: 11px/1.5 var(--mono); margin-top: 2px; overflow-wrap: anywhere; }
.ls-head .ls-title { flex: 0 1 auto; min-width: 0; display: -webkit-box; -webkit-line-clamp: 2; line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; overflow-wrap: anywhere; line-height: 1.35; }
.ls-sub b { color: var(--ink); font-weight: 600; }
.goal { margin-top: 6px; font-size: 12px; line-height: 1.45; max-height: calc(2 * 1.45em); overflow: auto; overscroll-behavior: contain; overflow-wrap: anywhere; color: var(--ink); padding-right: 4px; }
#out-info .goal { margin: 0 0 8px; font-size: 13px; padding: 6px 8px; max-height: calc(2 * 1.45em); background: var(--bg); border: 1px solid var(--line); border-radius: 6px; }
.ls-badges { display: flex; gap: 4px; flex-wrap: wrap; margin-top: 6px; }
.live-shell > details { margin-top: 6px; }
.live-shell > details > summary { cursor: pointer; color: var(--muted); font-size: 11.5px; }
.live-shell .ls-actions { margin-top: auto; padding-top: 8px; align-items: center; }
.ls-actions .action-button { margin-left: 0; }
.ls-actions .action-button.dismiss { margin-left: auto; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 7px; overflow: hidden; margin-top: 10px; }
.seg button { border: 0; background: transparent; color: var(--muted); padding: 4px 14px; font-size: 12px; cursor: pointer; }
.seg button + button { border-left: 1px solid var(--line); }
.seg button[aria-pressed="true"] { background: var(--blue-bg); color: var(--blue); font-weight: 600; }
.flist { display: flex; flex-direction: column; gap: 1px; max-height: 170px; overflow: auto; margin-top: 6px; border: 1px solid var(--line); border-radius: 7px; padding: 3px; }
.flist button { display: flex; align-items: center; gap: 8px; width: 100%; text-align: left; border: 0; background: transparent; color: var(--ink); padding: 3px 6px; border-radius: 5px; cursor: pointer; font: 12px var(--mono); }
.flist button:hover { background: var(--chip); }
.flist button[aria-pressed="true"] { background: var(--blue-bg); }
.flist .fp { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; flex: 1; min-width: 0; }
#out pre.diff { white-space: pre; word-break: normal; }
#out-info .shell-facts { grid-template-columns: max-content minmax(0, 1fr) max-content minmax(0, 1fr); }
.live-shells { --card-h: 156px; display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 340px), 1fr)); grid-auto-rows: var(--card-h); gap: 8px; max-height: calc(2 * var(--card-h) + 8px); overflow-y: auto; overscroll-behavior: contain; padding-right: 2px; }
.live-shells.agents { --card-h: 112px; }
.live-shell { display: flex; flex-direction: column; border: 1px solid var(--line); border-radius: 6px; padding: 8px; min-width: 0; min-height: 0; overflow: auto; overscroll-behavior: contain; font-size: 12px; }
.live-shell.running { border-color: color-mix(in srgb, var(--pass) 60%, transparent); }
.live-shell .ls-head { display: flex; gap: 6px; align-items: flex-start; overflow-wrap: anywhere; }
.shell-facts { display: grid; grid-template-columns: max-content 1fr; gap: 2px 10px; margin: 6px 0; font-size: 12px; }
.shell-facts dt { color: var(--muted); }
.shell-facts dd { margin: 0; overflow-wrap: anywhere; font-family: var(--mono); font-size: 11px; }
.ls-actions { display: flex; gap: 6px; flex-wrap: wrap; }
.live-shell details pre, #out-info details pre { max-height: 160px; overflow: auto; font: 11px/1.45 var(--mono); height: auto; margin: 4px 0 0; padding: 6px 8px; white-space: pre-wrap; overflow-wrap: anywhere; background: var(--bg); border: 1px solid var(--line); border-radius: 6px; }
.info-card pre { white-space: pre-wrap; overflow-wrap: anywhere; }
.info-facts { display: grid; grid-template-columns: auto 1fr; gap: 6px 12px; }
.info-facts dd { margin: 0; overflow-wrap: anywhere; }
.info-timeline { padding-left: 20px; }
.info-timeline time { font-size: 12px; }
.info-run { margin-top: 12px; }
#info { flex: 1; min-height: 0; overflow: auto; padding: 4px 18px 18px; }
.tasks { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
.task { display: grid; grid-template-columns: 18px 1fr; gap: 2px 8px; align-items: start; padding: 10px; border: 1px solid var(--line); border-radius: 10px; cursor: pointer; background: var(--panel); }
.task:hover { border-color: var(--muted); }
.task input { margin: 3px 0 0; }
.task .tn { font-weight: 600; }
.task .tg { grid-column: 2; margin-top: 2px; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
.steps { list-style: none; margin: 0; padding: 0; display: grid; gap: 4px; }
.steps li { display: grid; grid-template-columns: 22px 1fr; gap: 0 6px; font-size: 13px; }
.steps .mk { font-weight: 700; text-align: center; color: var(--muted); }
.steps .active .mk, .steps .active .tx { color: var(--blue); font-weight: 600; }
.steps .done .mk { color: var(--green); }
.steps .skipped .tx { text-decoration: line-through; color: var(--muted); }
.steps .nt { grid-column: 2; color: var(--muted); font-size: 12px; }
.now { border: 1px solid var(--line); border-radius: 10px; padding: 10px; display: grid; gap: 4px; margin-bottom: 8px; }
.now .lbl { color: var(--muted); font-size: 11px; text-transform: uppercase; letter-spacing: .04em; margin-top: 4px; }
.card .act { font: 11px/1.4 var(--mono); color: var(--muted); margin-top: 6px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.card .act.run { color: var(--ink); }
.card .say { font-size: 12px; line-height: 1.4; margin-top: 6px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.task .th { cursor: pointer; display: flex; flex-wrap: wrap; align-items: center; gap: 6px; }
.task .caret { margin-left: auto; color: var(--muted); }
.task .tg { cursor: pointer; }
.task .detail { grid-column: 1 / -1; margin-top: 8px; cursor: default; }
.task .detail pre { margin: 6px 0 0; max-height: 220px; }
aside .task .detail pre.log { max-height: 260px; font-size: 11px; }
.endbar { display: flex; justify-content: flex-end; margin-top: 10px; padding-top: 8px; border-top: 3px solid var(--line); }
.endbar.ok { border-top-color: var(--green); }
.endbar.bad { border-top-color: var(--red); }
.endbar.live { border-top-color: var(--blue); }
.endbar .action-button { margin-left: 0; }
.card .br { font: 11px/1.3 ui-monospace, SFMono-Regular, Menlo, monospace; color: var(--blue); margin-top: 3px; word-break: break-all; }
.gitview { flex: 1; min-height: 0; display: flex; }
.gcol { display: flex; flex-direction: column; min-width: 0; min-height: 0; border-right: 1px solid var(--line); }
.g1, .g2 { flex: 0 0 20%; }
.g3 { flex: 1; border-right: 0; }
.g1.hid, .g2.hid { flex: 0 0 30px; }
.gh { flex: none; display: flex; align-items: center; justify-content: space-between; gap: 6px; padding: 8px 10px; border-bottom: 1px solid var(--line); }
.gh .gt { font-weight: 600; font-size: 12px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
.gh .action-button { margin-left: 0; flex: none; }
.gb { flex: 1; min-height: 0; overflow: auto; }

.task-stage-timeline li.in_progress, .task-stage-timeline li.running { color: var(--blue); }
.task-stage-timeline li.done { color: var(--green); }

.task-current { margin-top: 5px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.session-activity { grid-column: 1 / -1; display: grid; gap: 12px; min-width: 0; }
.tracked-tasks { max-height: 640px; overflow-y: auto; overscroll-behavior: contain; scrollbar-gutter: stable; }
@media (max-width: 760px) { .info-grid { grid-template-columns: minmax(0, 1fr); } }

.task-status-icon { display: inline-flex; flex: 0 0 24px; align-items: center; justify-content: center; width: 24px; height: 24px; color: var(--muted); vertical-align: middle; }

.task-status-icon.executing { border-radius: 50%; background: color-mix(in srgb, var(--blue) 12%, transparent); outline: 1px solid var(--blue); }
.task-stage-timeline li .task-status-icon { width: 21px; height: 21px; border: 0; }
.task-stage-timeline li .task-status-icon svg { width: 17px; height: 17px; }
.task-activity { margin-top: 4px; }

/* Session panel: dark navy cards, icon headers, pill tabs, outlined badges. */
aside { background: var(--bg); }
#phead { padding: 18px 20px 10px; }
#phead h3 { font-size: 17px; font-weight: 600; letter-spacing: -0.01em; }

.ptabs { gap: 2px; margin: 4px 20px 6px; padding: 3px; border: 1px solid var(--line); border-radius: 8px; background: var(--panel); align-self: flex-start; }
.tab2 { border-bottom: 0; border-radius: 6px; padding: 5px 12px; font-size: 12.5px; }
.tab2:hover:not(:disabled) { color: var(--ink); }
.tab2[aria-selected="true"] { background: var(--blue-bg); color: var(--blue); box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--blue) 35%, transparent); }
.tab2:focus-visible { outline: 2px solid var(--blue); outline-offset: 1px; }
.tab2 .badge { font: 10.5px/1.5 var(--mono); padding: 0 6px; border-radius: 999px; background: var(--amber-bg); color: var(--amber); }
#info { padding: 8px 20px 20px; }
.info-grid { gap: 14px; }
.info-card { background: var(--card); border-color: var(--line); border-radius: 8px; box-shadow: inset 0 1px 0 color-mix(in srgb, var(--blue) 28%, transparent); }
.info-card > summary { display: flex; align-items: center; gap: 9px; flex-wrap: wrap; list-style: none; margin: -12px -12px 0; padding: 10px 12px; font-size: 13px; }
.info-card > summary::-webkit-details-marker { display: none; }
.info-card > summary::before { content: ""; flex: none; width: 22px; height: 22px; border-radius: 6px; background: var(--blue-bg) radial-gradient(circle, var(--blue) 0 3px, transparent 3.5px); box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--blue) 30%, transparent); }
.info-card > summary::after { content: "›"; margin-left: auto; color: var(--faint); font-size: 15px; line-height: 1; transition: transform .15s; }
.info-card[open] > summary { margin-bottom: 12px; border-bottom: 1px solid var(--line); }
.info-card[open] > summary::after { transform: rotate(90deg); }
.info-card > summary:hover::after { color: var(--ink); }
.info-top[open] > summary { margin-bottom: 12px; }
aside h4 { font-size: 10.5px; letter-spacing: .06em; color: var(--muted); }
aside .info-facts dt, aside .shell-facts dt { color: var(--muted); font-size: 11px; text-transform: uppercase; letter-spacing: .04em; }
aside .pill { background: transparent; border: 1px solid var(--line); }
aside .pill.live { background: var(--green-bg); border-color: color-mix(in srgb, var(--green) 40%, transparent); }
aside .pill.bad { background: var(--red-bg); border-color: color-mix(in srgb, var(--red) 40%, transparent); }
aside .pill.warn { background: var(--amber-bg); border-color: color-mix(in srgb, var(--amber) 40%, transparent); }
aside .chip { border: 1px solid var(--line); background: transparent; }
aside .chip.ok { border-color: color-mix(in srgb, var(--pass) 40%, transparent); }

aside .action-button { background: var(--card); border-color: var(--line); color: var(--ink); border-radius: 6px; padding: 4px 10px; font-size: 11.5px; }
aside .action-button:hover { border-color: var(--blue); color: var(--ink); }
aside .live-shell, aside .task, aside .now, aside .task-overview { background: var(--panel); border-color: var(--line); border-radius: 8px; }
aside .live-shell.running { border-color: color-mix(in srgb, var(--pass) 45%, var(--line)); }
aside pre:not(.diff):not(.terminal-screen) { background: var(--panel); border: 1px solid var(--line); }

/* Session panel structure: overview strip, KPI tiles, labelled rows, timeline. */
.session-overview { grid-column: 1 / -1; background: var(--card); border: 1px solid var(--line); border-radius: 8px; padding: 12px; box-shadow: inset 0 1px 0 color-mix(in srgb, var(--blue) 28%, transparent); }
.so-head { display: flex; align-items: center; gap: 9px; flex-wrap: wrap; font-size: 13px; }
.so-ico { flex: none; width: 22px; height: 22px; border-radius: 6px; background: var(--blue-bg) radial-gradient(circle, var(--blue) 0 3px, transparent 3.5px); box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--blue) 30%, transparent); }
.so-right { margin-left: auto; display: flex; gap: 6px; flex-wrap: wrap; }
.so-tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 10px; margin-top: 12px; }
.so-tile { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 9px 11px; min-width: 0; }
.so-l { color: var(--muted); font-size: 10.5px; text-transform: uppercase; letter-spacing: .06em; }
.so-v { margin-top: 2px; font-size: 20px; font-weight: 600; line-height: 1.25; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-variant-numeric: tabular-nums; }
.so-tile.time .so-v { font-size: 13px; padding-top: 5px; }
.so-tile.live .so-v { color: var(--blue); }
.so-tile.bad .so-v { color: var(--red); }
.so-bar { height: 5px; margin-top: 6px; border-radius: 3px; background: var(--chip); overflow: hidden; }
.so-bar span { display: block; height: 100%; background: var(--blue); border-radius: 3px; }
.info-card > summary > h4 { flex: 1; }
.info-card.live { --sec: var(--green); } .info-card.progress { --sec: var(--amber); } .info-card.result { --sec: var(--human); }
.info-card.live, .info-card.progress, .info-card.result { box-shadow: inset 0 1px 0 color-mix(in srgb, var(--sec) 45%, transparent); }
.info-card.live > summary::before, .info-card.progress > summary::before, .info-card.result > summary::before { background: color-mix(in srgb, var(--sec) 14%, transparent) radial-gradient(circle, var(--sec) 0 3px, transparent 3.5px); box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--sec) 35%, transparent); }
aside .info-facts { grid-template-columns: auto minmax(0, 1fr); gap: 0 12px; }
aside .info-facts dt, aside .info-facts dd { padding: 7px 0; border-top: 1px solid var(--line); }
aside .info-facts dt:first-of-type, aside .info-facts dt:first-of-type + dd { border-top: 0; }

.info-card .snip { padding-top: 8px; margin-top: 8px; border-top: 1px solid var(--line); }
.info-timeline { list-style: none; margin: 0; padding: 0 0 0 16px; border-left: 1px solid var(--line); }

.live-group h5 { text-transform: uppercase; letter-spacing: .06em; font-size: 10.5px; color: var(--muted); margin-top: 4px; }

/* Tasks section: plan header, status tiles, incident-style rows. */
.tp-head { display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.tp-title { display: grid; gap: 1px; min-width: 0; }
.tp-title b { font-size: 13.5px; }
.tp-file { font: 11px var(--mono); color: var(--blue); text-decoration: none; overflow-wrap: anywhere; }
.tp-file:hover { text-decoration: underline; }
.tp-done { display: flex; gap: 8px; align-items: baseline; font-size: 12px; color: var(--muted); }
.tp-done b { color: var(--ink); font-size: 13px; }
aside .tracked-plan progress { appearance: none; -webkit-appearance: none; height: 6px; border: 0; border-radius: 3px; background: var(--chip); overflow: hidden; margin: 8px 0 12px; }
aside .tracked-plan progress::-webkit-progress-bar { background: var(--chip); border-radius: 3px; }
aside .tracked-plan progress::-webkit-progress-value { background: var(--blue); border-radius: 3px; }
aside .tracked-plan progress::-moz-progress-bar { background: var(--blue); border-radius: 3px; }
.task-counts { display: grid; grid-template-columns: repeat(auto-fit, minmax(110px, 1fr)); gap: 8px; margin: 0 0 12px; }
.tt-tile { display: flex; align-items: center; gap: 8px; padding: 8px 10px; background: var(--panel); border: 1px solid var(--line); border-radius: 8px; }
.tt-tile .task-status-icon { flex-basis: 20px; width: 20px; height: 20px; }
.tt-n { font-size: 18px; font-weight: 600; line-height: 1.2; font-variant-numeric: tabular-nums; }
.tt-tile.in_progress .tt-n { color: var(--blue); } .tt-tile.blocked .tt-n { color: var(--red); } .tt-tile.done .tt-n { color: var(--green); }
.tracked-tasks { margin: 0; border: 1px solid var(--line); border-radius: 8px; background: var(--panel); }
.tracked-task { grid-template-columns: 22px minmax(0, 1fr); gap: 10px; padding: 10px 12px 10px 10px; border-top: 1px solid var(--line); border-left: 3px solid transparent; }
.tracked-task:first-child { border-top: 0; }
.tracked-task.blocked { border-left-color: var(--red); background: color-mix(in srgb, var(--red) 5%, transparent); }
.tracked-task.in_progress { border-left-color: color-mix(in srgb, var(--blue) 45%, transparent); }
.tracked-task.executing { border-left-color: var(--blue); background: color-mix(in srgb, var(--blue) 6%, transparent); }
.tracked-task.done .tt-title, .tracked-task.skipped .tt-title, .tracked-task.canceled .tt-title { color: var(--muted); }
.tt-main { min-width: 0; }
.tt-top { display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap; }
.tt-top > b { font: 600 11px var(--mono); color: var(--muted); padding: 1px 6px; border: 1px solid var(--line); border-radius: 4px; }
.tt-title { flex: 1; min-width: 0; font-weight: 600; font-size: 13px; }
.tt-badges { display: flex; gap: 5px; margin-left: auto; }
.tt-badge { font: 10.5px/1.6 var(--mono); padding: 0 7px; border-radius: 999px; border: 1px solid var(--line); color: var(--muted); white-space: nowrap; }
.tt-badge.in_progress, .tt-badge.live { color: var(--blue); border-color: color-mix(in srgb, var(--blue) 40%, transparent); background: var(--blue-bg); }
.tt-badge.blocked { color: var(--red); border-color: color-mix(in srgb, var(--red) 40%, transparent); background: var(--red-bg); }
.tt-badge.done { color: var(--green); border-color: color-mix(in srgb, var(--green) 40%, transparent); background: var(--green-bg); }
.tt-owner { color: var(--ink); font-family: var(--mono); font-size: 11px; }
.tt-note { margin-top: 3px; font-size: 12px; }

.info-card .session-task-overview { margin-bottom: 12px; background: var(--panel); }

/* Running now: each group is one row of fixed-width cards that scrolls sideways. */
.live-shells { grid-template-columns: none; grid-auto-flow: column; grid-auto-columns: minmax(min(85%, 300px), 340px); max-height: none; overflow-x: auto; overflow-y: hidden; padding: 0 0 8px; scroll-snap-type: x proximity; scrollbar-width: thin; scrollbar-color: var(--line) transparent; }
.live-group .live-shells { grid-template-columns: none; }
.live-shells > * { scroll-snap-align: start; }
.live-shells:focus-visible { outline: 2px solid var(--blue); outline-offset: 2px; border-radius: 6px; }
.live-shells::-webkit-scrollbar { height: 6px; } .live-shells::-webkit-scrollbar-thumb { background: var(--line); border-radius: 3px; }
.live-group .live-shells.agents { grid-auto-columns: minmax(200px, 240px); }

.terminal-caption [data-terminal-status].lagging { color: var(--herdr-yellow); }

</style>
</head>
<body>
<header>
  <div class="viewtabs" role="tablist" aria-label="Dashboard view">

  </div>
  <div class="hright">
    <button class="newsess" id="newsess" title="Open a new herdr tab and start Claude, Codex or Grok in it">+ New session</button>
    <button class="favsw" id="favsw" role="switch" aria-checked="false"><span class="track" aria-hidden="true"></span>Favourites only</button>
    <button class="tbtn" id="ffeed" aria-pressed="true" title="Show or hide the activity feed">Activity</button>
    <button class="favsw" id="fwall" role="switch" aria-checked="false" title="Wall mode: hide the sidebar, filters and feed (key w)"><span class="track" aria-hidden="true"></span>Wall mode</button>

<script>
const STAGES = [
  {key: "investigate", label: "Investigate", who: "lead", phases: ["idle", "investigate"], flow: true},
  {key: "plan", label: "Plan", who: "lead", phases: ["plan"], flow: true},
  {key: "build", label: "Build", who: "implementer", phases: ["implement", "rework"], flow: true},
  {key: "review", label: "Review", who: "lead audit · test-runner · diff-reviewer", phases: ["audit", "validate"], flow: true},
  {key: "complete", label: "Done", who: "lead", phases: ["complete"]},
  {key: "human", label: "Needs human", who: "you · approve · rework", phases: ["review"]},
];
const QUIET = new Set(["idle", "complete"]);
const FLAG_TEXT = {failed:"run failed", stalled:"run stalled", out_of_scope:"edited files outside its brief", no_changes:"changed nothing", retries_exhausted:"retries used up"};
let favOnly = false;
try { favOnly = localStorage.getItem("fsa-fav-only") === "1"; } catch (e) {}
let view = "agents";
try { const v = localStorage.getItem("fsa-view"); view = ["herdr", "history"].includes(v) ? v : "agents"; } catch (e) {}
let uiSeen = null, state = null, seen = null, herdrData = null, herdrLoading = null, selectedHerdrPane = null, herdrKnownTabs = null;
let herdrSidebarRatio = .5, herdrOverlay = null, herdrDragging = false, herdrActionError = "";
try { const storedRatio = localStorage.getItem("fsa-herdr-sidebar-ratio"), value = Number(storedRatio); if (storedRatio !== null && Number.isFinite(value)) herdrSidebarRatio = Math.max(.1, Math.min(.9, value)); } catch (e) {}
let terminal = null, terminalTimer = null;
const cardPaneChoice = new Map();

const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

function ansiHtml(input) {
  const basic = ["#000000", "#aa0000", "#00aa00", "#aa5500", "#0000aa", "#aa00aa", "#00aaaa", "#aaaaaa"];
  const bright = ["#555555", "#ff5555", "#55ff55", "#ffff55", "#5555ff", "#ff55ff", "#55ffff", "#ffffff"];
  const indexed = n => {
    if (n < 8) return basic[n];
    if (n < 16) return bright[n - 8];
    if (n < 232) { const x = n - 16, v = z => z ? 55 + z * 40 : 0; return `rgb(${v(Math.floor(x / 36))},${v(Math.floor(x / 6) % 6)},${v(x % 6)})`; }
    const v = 8 + (n - 232) * 10;
    return `rgb(${v},${v},${v})`;
  };
  const s = {bold: false, dim: false, italic: false, underline: false, inverse: false, fg: "", bg: ""};
  const reset = () => Object.assign(s, {bold: false, dim: false, italic: false, underline: false, inverse: false, fg: "", bg: ""});
  const style = () => {
    let fg = s.fg, bg = s.bg;
    if (s.inverse) [fg, bg] = [bg || "#e8e8e8", fg || "#101218"];
    return [s.bold && "font-weight:bold", s.dim && "opacity:.65", s.italic && "font-style:italic", s.underline && "text-decoration:underline", fg && `color:${fg}`, bg && `background-color:${bg}`].filter(Boolean).join(";");
  };
  const sgr = raw => {
    const codes = raw === "" ? [0] : raw.split(";").map(x => Number(x || 0));
    for (let i = 0; i < codes.length; i++) {
      const c = codes[i];
      if (c === 0) reset();
      else if (c === 1) s.bold = true;
      else if (c === 2) s.dim = true;
      else if (c === 3) s.italic = true;
      else if (c === 4) s.underline = true;
      else if (c === 7) s.inverse = true;
      else if (c === 22) s.bold = s.dim = false;
      else if (c === 23) s.italic = false;
      else if (c === 24) s.underline = false;
      else if (c === 27) s.inverse = false;
      else if (c >= 30 && c <= 37) s.fg = basic[c - 30];
      else if (c >= 90 && c <= 97) s.fg = bright[c - 90];
      else if (c >= 40 && c <= 47) s.bg = basic[c - 40];
      else if (c >= 100 && c <= 107) s.bg = bright[c - 100];
      else if (c === 39) s.fg = "";
      else if (c === 49) s.bg = "";
      else if ((c === 38 || c === 48) && codes[i + 1] === 5 && Number.isInteger(codes[i + 2])) { s[c === 38 ? "fg" : "bg"] = indexed(Math.max(0, Math.min(255, codes[i + 2]))); i += 2; }
      else if ((c === 38 || c === 48) && codes[i + 1] === 2 && i + 4 < codes.length && codes.slice(i + 2, i + 5).every(Number.isFinite)) { s[c === 38 ? "fg" : "bg"] = `rgb(${codes.slice(i + 2, i + 5).map(x => Math.max(0, Math.min(255, x))).join(",")})`; i += 4; }
    }
  };
  const text = String(input ?? "").replace(/\x1b\][\s\S]*?(?:\x07|\x1b\\|$)/g, "");
  const csi = /\x1b\[([0-?]*)([ -\/]*)([@-~])/g;
  let out = "", at = 0, m;
  const add = part => { if (!part) return; const css = style(); out += css ? `<span style="${css}">${esc(part)}</span>` : esc(part); };
  while ((m = csi.exec(text))) { add(text.slice(at, m.index)); if (m[3] === "m" && !m[2]) sgr(m[1]); at = csi.lastIndex; }
  add(text.slice(at));
  return out.replace(/\x1b/g, "");
}

const statusMeta = status => ({
  working: {icon: "●", word: "working"}, blocked: {icon: "●", word: "blocked"}, done: {icon: "●", word: "done"},
  idle: {icon: "○", word: "idle"}, unknown: {icon: "·", word: "unknown"},
}[status] || {icon: "·", word: "unknown"});

const statusHtml = status => {
  const meta = statusMeta(status);
  return `<span class="herdr-status herdr-status-${esc(meta.word)}" title="${esc(meta.word)}">${esc(meta.icon)}</span>`;
};

function terminalHtml(pane, panes, pickMessage) {
  const options = (panes || []).map(x => `<option value="${esc(x.pane_id)}" ${pane && x.pane_id === pane.pane_id ? "selected" : ""}>${esc(x.title || x.pane_id)}</option>`).join("");
  const pick = pickMessage ? `<div class="terminal-pick">${esc(pickMessage)} ${options ? `<label>Pick a pane <select data-pane-pick><option value="">—</option>${options}</select></label>` : ""}</div>` : "";
  if (!pane) return `<div class="terminal">${pick || '<div class="hint">No Herdr panes are available.</div>'}</div>`;
  return `<div class="terminal" data-terminal-pane="${esc(pane.pane_id)}">${pick}
    <div class="terminal-head"><span class="terminal-pane-title"> ${esc(pane.title || pane.pane_id)} </span><span class="chip st-${esc(pane.status)}">${esc(pane.status)}</span><div class="terminal-source"><button data-mode="live" aria-pressed="true">Live</button><button data-mode="history" aria-pressed="false">History</button><button data-attach aria-label="Attach files" title="Attach files: their paths are typed into the session">+</button><input type="file" multiple hidden data-attach-input></div></div>
    <div class="terminal-screen-box" data-herdr-pane-context="${esc(pane.pane_id)}"><div class="terminal-live"></div><div class="terminal-drop" aria-hidden="true"><span>+</span><b>Drop to attach</b></div><div class="terminal-disconnected" hidden><div class="terminal-blocked"><span data-terminal-reason></span><button data-takeover>take over</button></div></div><pre class="terminal-screen" tabindex="0" hidden>loading…</pre><button class="terminal-jump" hidden>New output — jump to latest</button></div>
    <div class="terminal-caption"><span data-terminal-status>live · connecting</span><span data-terminal-reconnect hidden><button data-reconnect>reconnect</button><button data-takeover>take over</button></span></div>
    <div class="terminal-error" aria-live="polite"></div></div>`;
}

function stopTerminal() {
  clearInterval(terminalTimer);
  terminalTimer = null;
  if (terminal) disposeLiveTerminal(terminal);
  terminal = null;
}

function terminalFocusSelector(root) {
  const active = document.activeElement;
  if (!active || !root.contains(active)) return null;
  if (terminal && terminal.root === root && terminal.term?.textarea === active) return "live";
  for (const selector of [".terminal-screen", ".terminal-jump", "[data-pane-pick]"])
    if (active.matches(selector)) return selector;
  for (const attr of ["mode"]) {
    const value = active.getAttribute(`data-${attr}`);
    if (value !== null) return `[data-${attr}="${value}"]`;
  }
  return null;
}

function terminalSnapshot() {
  if (!terminal || !document.contains(terminal.root)) return null;
  const pre = terminal.root.querySelector(".terminal-screen");
  return {pane: terminal.pane, mode: terminal.mode, text: terminal.text, hash: terminal.hash, pending: terminal.pending, scroll: pre.scrollTop,
    atEnd: pre.scrollHeight - pre.scrollTop - pre.clientHeight < 40, focus: terminalFocusSelector(terminal.root)};
}

function terminalCanStay(pane, panes) {
  return pane && terminal && terminal.pane === pane.pane_id && document.contains(terminal.root);
}

function updateTerminalStatus(pane) {
  const chip = terminal && terminal.root.querySelector(".terminal-head .chip");
  if (!chip || !pane) return;
  chip.className = `chip st-${pane.status}`;
  chip.textContent = pane.status;
}

const terminalAtEnd = pre => pre.scrollHeight - pre.scrollTop - pre.clientHeight < 40;

function setTerminalPending(current, text) {
  current.pending = text;
  current.root.querySelector(".terminal-jump").hidden = text === null;
}

function applyTerminalText(current, text) {
  const pre = current.root.querySelector(".terminal-screen");
  current.text = text;
  setTerminalPending(current, null);
  pre.innerHTML = ansiHtml(text) || "&nbsp;";
  pre.scrollTop = pre.scrollHeight;
}

function updateTerminalCaption(current) {
  if (current.mode === "history") current.root.querySelector("[data-terminal-status]").textContent = "Showing the last 1000 lines from herdr";
}

async function pollTerminal() {
  const current = terminal;
  if (!current || document.hidden || !document.contains(current.root)) return;
  if (current.mode !== "history") return;
  if (current.polling) { current.pollAgain = true; return; }
  current.polling = true;
  const source = "recent";
  try {
    const since = current.hash ? `&since=${enc(current.hash)}` : "";
    const r = await fetch(`/api/herdr/screen?pane=${enc(current.pane)}&source=${enc(source)}${since}`, {cache: "no-store"});
    if (terminal !== current || current.mode !== "history" || !document.contains(current.root)) return;
    const hash = r.headers.get("X-Screen-Hash");
    if (hash) current.hash = hash;
    if (r.status === 204) return;
    const text = await r.text();
    if (terminal !== current || current.mode !== "history" || !document.contains(current.root)) return;
    if (!r.ok) throw new Error(text || `screen error ${r.status}`);
    current.root.querySelector(".terminal-error").textContent = "";
    const pre = current.root.querySelector(".terminal-screen");
    if (text === current.text && current.pending === null) return;
    if (current.text === null || terminalAtEnd(pre)) applyTerminalText(current, text);
    else setTerminalPending(current, text);
  } catch (e) {
    if (terminal === current && current.mode === "history" && document.contains(current.root))
      current.root.querySelector(".terminal-error").textContent = e.message || "Could not read the pane";
  } finally {
    if (terminal === current) {
      current.polling = false;
      if (current.pollAgain) { current.pollAgain = false; pollTerminal(); }
    }
  }
}

const terminalBytes64 = bytes => {
  let binary = "";
  for (let i = 0; i < bytes.length; i += 0x8000) binary += String.fromCharCode(...bytes.subarray(i, i + 0x8000));
  return btoa(binary);
};

const terminalBase64Bytes = value => Uint8Array.from(atob(value), c => c.charCodeAt(0));

const LIVE_UPLOAD_MAX_BYTES = 50 * 1024 * 1024;

function focusTerminalAfterAttach(current) {
  if (terminal !== current || !document.contains(current.root)) return;
  (current.mode === "live" ? current.term : current.root.querySelector(".terminal-screen"))?.focus();
}

function showTerminalStatus(current, message, resetAfter = 0) {
  if (terminal !== current || !document.contains(current.root)) return;
  clearTimeout(current.imageStatusTimer);
  current.imageStatus = message;
  current.root.querySelector("[data-terminal-status]").textContent = message;
  if (resetAfter) current.imageStatusTimer = setTimeout(() => {
    if (terminal !== current || !document.contains(current.root) || current.imageStatus !== message) return;
    current.imageStatus = "";
    current.imageStatusTimer = null;
    if (current.mode === "history") updateTerminalCaption(current);
    else if (current.session) liveTerminalStatus(current, null);
  }, resetAfter);
}

async function attachLiveFiles(current, files) {
  if (terminal !== current || current.mode !== "live" || !current.session || !current.term) {
    showTerminalStatus(current, "connect live to attach files");
    focusTerminalAfterAttach(current);
    return;
  }
  if (files.some(file => file.size > LIVE_UPLOAD_MAX_BYTES)) {
    showTerminalStatus(current, "file is too large (50 MB maximum)");
    focusTerminalAfterAttach(current);
    return;
  }
  const session = current.session, paths = [];
  showTerminalStatus(current, files.length === 1 ? `uploading ${files[0].name}…` : `uploading ${files.length} files…`);
  try {
    for (const file of files) {
      const response = await fetch(`/api/herdr/live/file?session=${enc(session)}&name=${enc(file.name || "file")}`, {method: "POST", headers: {"Content-Type": "application/octet-stream"}, body: file});
      if (!response.ok) throw new Error((await response.text()) || `upload failed (${response.status})`);
      const data = await response.json();
      if (!data.ok || typeof data.path !== "string") throw new Error("invalid upload response");
      paths.push(data.path);
    }
    if (terminal !== current || current.mode !== "live" || current.session !== session || !current.term) {
      showTerminalStatus(current, "connect live to attach files");
      return;
    }
    current.term.paste(paths.join(" ") + " ");
    showTerminalStatus(current, paths.length === 1 ? "file attached" : `${paths.length} files attached`, 2000);
  } catch (error) {
    if (terminal !== current || current.mode !== "live" || current.session !== session || !current.term)
      showTerminalStatus(current, "connect live to attach files");
    else showTerminalStatus(current, error.message || "upload failed");
  } finally {
    focusTerminalAfterAttach(current);
  }
}

function mountTerminalCopy(current) {
  const host = current.root.querySelector(".terminal-live"), history = current.root.querySelector(".terminal-screen");
  const copy = (text, restore) => { if (text && text.trim()) copySelection(text, restore); };
  host.addEventListener("mouseup", () => setTimeout(() => {
    if (terminal !== current || !current.term?.hasSelection()) return;
    copy(current.term.getSelection(), () => current.term.focus());
  }));
  history.addEventListener("mouseup", () => setTimeout(() => {
    const selection = getSelection();
    if (!selection.rangeCount || !history.contains(selection.anchorNode)) return;
    const range = selection.getRangeAt(0).cloneRange();
    copy(selection.toString(), () => { selection.removeAllRanges(); selection.addRange(range); });
  }));
}

function terminalSelection(current) {
  if (current.mode === "live") return current.term?.hasSelection() ? current.term.getSelection() : "";
  const selection = getSelection(), history = current.root.querySelector(".terminal-screen");
  return selection.rangeCount && history?.contains(selection.anchorNode) ? selection.toString() : "";
}

async function copySelection(text, restore) {
  let ok = false;
  try { ok = await writeClipboard(text); } catch (err) { ok = false; }
  if (restore) restore();
  showHerdrToast(ok ? "Copied" : "Copy failed");
}

function mountTerminalFiles(current) {
  const host = current.root.querySelector(".terminal-live"), history = current.root.querySelector(".terminal-screen"), box = current.root.querySelector(".terminal-screen-box");
  const picker = current.root.querySelector("[data-attach-input]");
  const pasteFile = event => {
    const files = [...(event.clipboardData?.items || [])].filter(entry => entry.kind === "file").map(entry => entry.getAsFile()).filter(Boolean);
    if (!files.length) return;
    event.preventDefault();
    event.stopPropagation();
    attachLiveFiles(current, files);
  };
  host.addEventListener("paste", pasteFile, true);
  history.addEventListener("paste", pasteFile, true);
  current.root.querySelector("[data-attach]").onclick = () => picker.click();
  picker.onchange = () => {
    const files = [...picker.files];
    picker.value = "";
    if (files.length) attachLiveFiles(current, files);
  };
  const hasFiles = event => [...(event.dataTransfer?.types || [])].includes("Files");
  box.addEventListener("dragover", event => {
    if (!hasFiles(event)) return;
    event.preventDefault();
    event.dataTransfer.dropEffect = "copy";
    box.classList.add("file-drag-over");
  });
  box.addEventListener("dragleave", event => {
    if (!event.relatedTarget || !box.contains(event.relatedTarget)) box.classList.remove("file-drag-over");
  });
  box.addEventListener("drop", event => {
    box.classList.remove("file-drag-over");
    const files = [...(event.dataTransfer?.files || [])];
    if (!files.length) return;
    event.preventDefault();
    event.stopPropagation();
    attachLiveFiles(current, files);
  });
}

function setLiveLag(current, epoch, lagging) {
  if (terminal !== current || current.liveEpoch !== epoch || !current.session) return;
  current.lagging = lagging;
  const status = current.root.querySelector("[data-terminal-status]");
  if (!current.imageStatus && current.root.querySelector(".terminal-disconnected").hidden) {
    status.textContent = liveStatusText(current);
    status.classList.toggle("lagging", lagging);
  }
}

function postLiveTerminal(current, body) {
  if (!current.session || terminal !== current) return Promise.resolve();
  const session = current.session, epoch = current.liveEpoch;
  current.postChain = current.postChain.then(async () => {
    if (current.liveEpoch !== epoch || terminal !== current) return;
    const started = performance.now();
    const slow = setTimeout(() => setLiveLag(current, epoch, true), 400);
    let response;
    try {
      response = await fetch("/api/herdr/live/input", {method: "POST", headers: {"Content-Type": "application/json"}, body: JSON.stringify({session, ...body}), signal: current.postAbort?.signal});
    } finally {
      clearTimeout(slow);
    }

    current.rtt = current.rtt ? current.rtt * 0.7 + took * 0.3 : took;
    setLiveLag(current, epoch, false);
    if (!response.ok) throw new Error((await response.text()) || `terminal input error ${response.status}`);
    if (terminal === current && current.liveEpoch === epoch) current.root.querySelector(".terminal-error").textContent = "";
  }).catch(error => {
    if (error.name !== "AbortError" && terminal === current && current.liveEpoch === epoch) current.root.querySelector(".terminal-error").textContent = error.message || "Could not write to the pane";
  });

}

function flushTerminalInput(current) {
  current.inputFrame = 0;
  if (!current.session || !current.inputQueue.length || current.inputSending) return;
  const size = current.inputQueue.reduce((sum, bytes) => sum + bytes.length, 0), joined = new Uint8Array(size);
  let offset = 0;
  current.inputQueue.forEach(bytes => { joined.set(bytes, offset); offset += bytes.length; });
  current.inputQueue.length = 0;
  current.inputSending = true;
  postLiveTerminal(current, {type: "input", bytes: terminalBytes64(joined)}).finally(() => {
    current.inputSending = false;
    if (current.inputQueue.length) flushTerminalInput(current);
  });
}

function queueTerminalInput(current, bytes) {
  current.inputQueue.push(bytes);
  if (!current.inputFrame) current.inputFrame = requestAnimationFrame(() => flushTerminalInput(current));
}

const liveStatusText = current => `live · ${current.term.cols}×${current.term.rows}${current.lagging ? " · sending…" : current.rtt ? ` · ${Math.round(current.rtt)} ms` : ""}`;

function liveTerminalStatus(current, reason) {
  const status = current.root.querySelector("[data-terminal-status]"), actions = current.root.querySelector("[data-terminal-reconnect]");
  if (reason === null) {
    status.textContent = current.imageStatus || liveStatusText(current);
    status.classList.toggle("lagging", !!current.lagging);
    actions.hidden = true;
    current.root.querySelector(".terminal-disconnected").hidden = true;
  } else {
    clearTimeout(current.imageStatusTimer);
    current.imageStatus = "";
    current.imageStatusTimer = null;
    status.classList.remove("lagging");
    status.textContent = `${reason} · ${current.term.cols}×${current.term.rows}`;
    current.root.querySelector("[data-terminal-reason]").textContent = /already has an attached client/.test(reason)
      ? "This pane is open live in another view" : reason;
    actions.hidden = false;
    current.root.querySelector(".terminal-disconnected").hidden = false;
  }
}

function closeLiveStream(current) {
  current.liveEpoch += 1;
  current.postAbort?.abort();
  current.postAbort = null;
  clearTimeout(current.reconnectTimer);
  current.reconnectTimer = null;
  if (current.stream) current.stream.close();
  current.stream = null;
  current.session = null;
}

// Wheel ticks arrive ~60 per second; posting each one serially queues a round trip per tick, which over a
// slow link keeps scrolling long after the wheel stops. Sum them and keep at most one scroll request in flight.
function queueTerminalScroll(current, lines) {
  current.scrollLines = (current.scrollLines || 0) + lines;
  if (!current.scrollFrame) current.scrollFrame = requestAnimationFrame(() => flushTerminalScroll(current));
}

function flushTerminalScroll(current) {
  current.scrollFrame = 0;
  if (!current.session) { current.scrollLines = 0; return; }
  if (current.scrollSending || !current.scrollLines) return;
  const lines = Math.max(-100, Math.min(100, current.scrollLines));
  current.scrollLines -= lines;
  current.scrollSending = true;
  postLiveTerminal(current, {type: "scroll", direction: lines < 0 ? "up" : "down", lines: Math.abs(lines)}).finally(() => {
    current.scrollSending = false;
    if (current.scrollLines) flushTerminalScroll(current);
  });
}

function disposeLiveTerminal(current) {
  closeLiveStream(current);
  clearTimeout(current.resizeTimer);
  clearTimeout(current.imageStatusTimer);
  current.imageStatus = "";
  current.imageStatusTimer = null;
  if (current.inputFrame) cancelAnimationFrame(current.inputFrame);
  current.inputFrame = 0;
  current.inputQueue.length = 0;
  if (current.scrollFrame) cancelAnimationFrame(current.scrollFrame);
  current.scrollFrame = 0;
  current.scrollLines = 0;
  current.scrollSending = false;
  current.postChain = Promise.resolve();
  current.resizeObserver?.disconnect();
  current.liveDisposables?.forEach(disposable => disposable.dispose());
  current.liveDisposables = [];
  current.term?.dispose();
  current.term = current.fit = null;
}

function openLiveStream(current, takeover = false) {
  closeLiveStream(current);
  current.postAbort = new AbortController();
  current.postChain = Promise.resolve();
  const cols = current.term.cols, rows = current.term.rows;
  const quiet = current.retries && current.retries <= RECONNECT_QUIET;
  if (!quiet) current.root.querySelector("[data-terminal-status]").textContent = `live · connecting · ${cols}×${rows}`;
  current.root.querySelector("[data-terminal-reconnect]").hidden = true;
  current.root.querySelector(".terminal-disconnected").hidden = !!quiet;
  const stream = new EventSource(`/api/herdr/live?pane=${enc(current.pane)}&cols=${cols}&rows=${rows}${takeover ? "&takeover=1" : ""}`);
  current.stream = stream;
  stream.addEventListener("ready", event => {
    if (terminal !== current || current.stream !== stream) return;
    try { current.session = JSON.parse(event.data).session; } catch (e) { return liveTerminalClosed(current, "Invalid terminal session"); }
    current.retries = 0;
    liveTerminalStatus(current, null);
    flushTerminalInput(current);
    const active = document.activeElement;
    if (!active || active === document.body || active.matches(".tab2, [data-pane-pick], .herdr-tab, .herdr-agent, [data-mode]")) current.term.focus();
  });
  stream.addEventListener("frame", event => {
    if (terminal !== current || current.stream !== stream) return;
    try { current.term.write(terminalBase64Bytes(JSON.parse(event.data).bytes)); }
    catch (e) { liveTerminalClosed(current, "Invalid terminal frame"); }
  });
  stream.addEventListener("closed", event => {
    if (terminal !== current || current.stream !== stream) return;
    let reason = "Terminal closed";
    try { reason = JSON.parse(event.data).reason || reason; } catch (e) {}
    liveTerminalClosed(current, reason);
  });
  stream.onerror = () => {
    if (terminal === current && current.stream === stream) liveTerminalClosed(current, "Connection closed");
  };
}

// Slow or flaky links drop the stream now and then: retry with backoff for as long as the pane is open live,
// and keep the last screen visible (status line only) for the first few attempts.
const RECONNECT_QUIET = 3;
const reconnectDelay = attempt => Math.min(10000, 1000 * 2 ** Math.max(0, attempt - 1));

function liveTerminalClosed(current, reason) {
  closeLiveStream(current);
  current.lagging = false;
  if (/ownership|owner|conflict|already.*control|attached client|in use/i.test(reason)) return liveTerminalStatus(current, reason);
  current.retries = (current.retries || 0) + 1;
  const delay = reconnectDelay(current.retries);
  if (current.retries > RECONNECT_QUIET) liveTerminalStatus(current, reason);
  else {
    const status = current.root.querySelector("[data-terminal-status]");
    status.classList.add("lagging");
    status.textContent = `reconnecting in ${Math.round(delay / 1000)}s · ${reason}`;
  }
  current.reconnectTimer = setTimeout(() => { if (terminal === current && current.mode === "live") openLiveStream(current); }, delay);
}

addEventListener("online", () => {
  if (terminal?.mode === "live" && terminal.term && !terminal.stream && terminal.reconnectTimer) openLiveStream(terminal);
});

function startLiveTerminal(current, restoreFocus = false) {
  const host = current.root.querySelector(".terminal-live"), box = current.root.querySelector(".terminal-screen-box");
  current.root.querySelector(".terminal-screen").hidden = true;
  current.root.querySelector(".terminal-jump").hidden = true;
  host.hidden = false;
  current.retries = 0;
  if (!window.Terminal || !window.FitAddon?.FitAddon) return liveTerminalStatus(current, "Terminal assets unavailable");
  const css = getComputedStyle(current.root), colour = name => css.getPropertyValue(name).trim();
  current.term = new window.Terminal({scrollback: 0, fontFamily: getComputedStyle(document.documentElement).getPropertyValue("--mono").trim(), fontSize: 12, cursorBlink: true, theme: {
    background: colour("--herdr-panel-bg"), foreground: colour("--herdr-text"), cursor: colour("--herdr-accent"), selectionBackground: colour("--herdr-selection-bg"),
    black: "#282c34", red: "#e06c75", green: "#98c379", yellow: "#e5c07b", blue: "#61afef", magenta: "#c678dd", cyan: "#56b6c2", white: "#abb2bf",
    brightBlack: "#5c6370", brightRed: "#e06c75", brightGreen: "#98c379", brightYellow: "#e5c07b", brightBlue: "#61afef", brightMagenta: "#c678dd", brightCyan: "#56b6c2", brightWhite: "#ffffff"
  }});

    current.fit.fit();
    const next = `${current.term.cols}x${current.term.rows}`;
    if (next === dimensions) return;
    dimensions = next;
    if (current.session) liveTerminalStatus(current, null);
    else current.root.querySelector("[data-terminal-status]").textContent = `live · connecting · ${current.term.cols}×${current.term.rows}`;
    clearTimeout(current.resizeTimer);
    current.resizeTimer = setTimeout(() => postLiveTerminal(current, {type: "resize", cols: current.term.cols, rows: current.term.rows}), 100);
  });

  box.onclick = () => { if (terminal === current && current.mode === "live") current.term.focus(); };

}

function switchTerminalMode(current, mode, restoreFocus = false) {
  if (terminal !== current) return;
  if (current.started && current.mode === mode) {
    if (restoreFocus) (mode === "live" ? current.term : current.root.querySelector(".terminal-screen"))?.focus();
    return;
  }
  clearInterval(terminalTimer);
  terminalTimer = null;
  clearTimeout(current.imageStatusTimer);
  current.imageStatus = "";
  current.imageStatusTimer = null;
  if (current.mode === "live" && mode !== "live") disposeLiveTerminal(current);
  current.mode = mode;
  current.root.querySelectorAll("[data-mode]").forEach(button => button.setAttribute("aria-pressed", String(button.dataset.mode === mode)));
  const history = current.root.querySelector(".terminal-screen"), host = current.root.querySelector(".terminal-live");
  if (mode === "live") {
    startLiveTerminal(current, restoreFocus);
  } else {
    host.hidden = true;
    history.hidden = false;
    current.root.querySelector(".terminal-disconnected").hidden = true;
    current.root.querySelector("[data-terminal-reconnect]").hidden = true;
    updateTerminalCaption(current);
    pollTerminal();
    terminalTimer = setInterval(pollTerminal, 1500);
    if (restoreFocus) history.focus();
  }
  current.started = true;
}

function mountTerminal(container, pane, panes, restore) {
  stopTerminal();
  const root = container.querySelector(".terminal[data-terminal-pane]");
  if (!root || !pane) return;
  const old = restore && restore.pane === pane.pane_id ? restore : null;
  terminal = {root, pane: pane.pane_id, mode: old ? old.mode : "live",
    text: old ? old.text : null, hash: old ? old.hash : null, pending: old ? old.pending : null, polling: false, pollAgain: false,
    term: null, fit: null, stream: null, session: null, resizeObserver: null, resizeTimer: null, reconnectTimer: null,
    retries: 0, inputQueue: [], inputFrame: 0, postChain: Promise.resolve(), postAbort: null, liveEpoch: 0, liveDisposables: [],

  jump.onclick = applyPending;
