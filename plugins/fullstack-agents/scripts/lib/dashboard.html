  root.querySelector("[data-reconnect]").onclick = () => { if (terminal?.root !== root || !terminal.term) return; terminal.retries = 0; openLiveStream(terminal); terminal.term.focus(); };
  root.querySelectorAll("[data-takeover]").forEach(button => button.onclick = () => { if (terminal?.root !== root || !terminal.term) return; terminal.retries = 0; openLiveStream(terminal, true); terminal.term.focus(); });
  mountTerminalFiles(terminal);
  mountTerminalCopy(terminal);
  switchTerminalMode(terminal, terminal.mode, old?.focus === "live");
  if (old?.focus && old.focus !== "live") root.querySelector(old.focus)?.focus();
}

function followNewHerdrTab(data) {
  const panes = data.panes || [], seen = herdrKnownTabs;
  const ready = (data.tabs || []).filter(tab => panes.some(pane => pane.tab_id === tab.tab_id));
  herdrKnownTabs = data.running ? new Set(ready.map(tab => tab.tab_id)) : null;
  const fresh = seen ? ready.filter(tab => !seen.has(tab.tab_id)).pop() : null;
  if (fresh) selectedHerdrPane = panes.find(pane => pane.tab_id === fresh.tab_id).pane_id;
}

async function loadHerdr(force = false) {
  if (herdrLoading) {
    if (!force) return herdrLoading;
    await herdrLoading;
  }
  herdrLoading = fetch("/api/herdr", {cache: "no-store"}).then(r => {
    if (!r.ok) throw new Error(r.status);
    return r.json();
  }).then(data => { herdrData = data; followNewHerdrTab(data); }).catch(() => {
    herdrData = {running: false, workspaces: [], tabs: [], panes: [], focused_pane_id: null};
  }).finally(() => {
    herdrLoading = null;
    if (view === "herdr") renderHerdrPage();
    if (openKey && tab2 === "terminal") paintPanel();
  });
  return herdrLoading;
}

const workspaceStatus = panes => {
  const priority = {unknown: 0, idle: 1, working: 2, done: 3, blocked: 4};
  return (panes || []).reduce((best, pane) => (priority[pane.status] ?? 0) > priority[best] ? pane.status : best, "unknown");
};

function herdrErrorMessage(error) {
  const text = typeof error === "string" ? error : JSON.stringify(error || "");
  try {
    const parsed = JSON.parse(text);
    return parsed?.error?.message || parsed?.message || text || "Herdr action failed";
  } catch (e) {
    return text || "Herdr action failed";
  }
}

function setHerdrError(message, ownerRoot = null) {
  herdrActionError = herdrErrorMessage(message);
  document.querySelectorAll(".herdr-page-error").forEach(x => x.textContent = herdrActionError);
  ownerRoot?.querySelectorAll(".herdr-modal-error").forEach(x => x.textContent = herdrActionError);
}

async function herdrAction(action, params = {}, ownerRoot = null) {
  herdrActionError = "";
  document.querySelectorAll(".herdr-page-error").forEach(x => x.textContent = "");
  ownerRoot?.querySelectorAll(".herdr-modal-error").forEach(x => x.textContent = "");
  let data;
  try {
    const response = await fetch("/api/herdr/action", {method: "POST", headers: {"Content-Type": "application/json"}, body: JSON.stringify({action, ...params})});
    data = response.headers.get("Content-Type")?.includes("application/json") ? await response.json() : {ok: false, error: await response.text()};
    if (!response.ok || !data.ok) setHerdrError(data.error || `Herdr action failed (${response.status})`, ownerRoot);
  } catch (error) {
    data = {ok: false, error: error.message || "Herdr action failed"};
    setHerdrError(data.error, ownerRoot);
  }
  await loadHerdr(true);
  return data;
}

function closeHerdrOverlay(restoreFocus = true) {
  if (!herdrOverlay) return false;
  const {root, returnFocus} = herdrOverlay;
  herdrOverlay = null;
  root.remove();
  if (restoreFocus && returnFocus && document.contains(returnFocus)) returnFocus.focus();
  return true;
}

function positionHerdrMenu(menu, x, y) {
  menu.style.left = Math.max(8, Math.min(x, innerWidth - menu.offsetWidth - 8)) + "px";
  menu.style.top = Math.max(8, Math.min(y, innerHeight - menu.offsetHeight - 8)) + "px";
}

function openHerdrMenu(items, x, y, returnFocus, above = false) {
  closeHerdrOverlay(false);
  const menu = document.createElement("div");
  menu.className = "herdr-menu";
  menu.setAttribute("role", "menu");
  menu.innerHTML = items.map((item, index) => `<button role="menuitem" data-herdr-menu-item="${index}" ${item.disabled ? `disabled title="${esc(item.title || "")}"` : ""}>${esc(item.label)}</button>`).join("");
  document.body.appendChild(menu);
  herdrOverlay = {root: menu, type: "menu", returnFocus};
  positionHerdrMenu(menu, x, above ? y - menu.offsetHeight : y);
  const enabled = () => [...menu.querySelectorAll("button:not(:disabled)")];
  const select = button => {
    menu.querySelectorAll("button").forEach(x => x.classList.toggle("herdr-menu-selected", x === button));
    button?.focus();
  };
  menu.onclick = event => {
    const button = event.target.closest("[data-herdr-menu-item]");
    if (!button || button.disabled) return;
    const item = items[Number(button.dataset.herdrMenuItem)];
    closeHerdrOverlay(false);
    item.run();
  };
  menu.onkeydown = event => {
    const buttons = enabled();
    if (event.key === "Escape") { event.preventDefault(); event.stopPropagation(); closeHerdrOverlay(); return; }
    if (event.key === "Enter") { event.preventDefault(); document.activeElement?.click(); return; }
    if (!buttons.length || !["ArrowDown", "ArrowUp"].includes(event.key)) return;
    event.preventDefault();
    const at = buttons.indexOf(document.activeElement);
    select(buttons[(at + (event.key === "ArrowDown" ? 1 : buttons.length - 1)) % buttons.length]);
  };
  select(enabled()[0]);
}

function herdrModal(html, returnFocus, onSubmit) {
  closeHerdrOverlay(false);
  const backdrop = document.createElement("div");
  backdrop.className = "herdr-modal-backdrop";
  backdrop.innerHTML = `<div class="herdr-modal" role="dialog" aria-modal="true">${html}</div>`;
  document.body.appendChild(backdrop);
  herdrOverlay = {root: backdrop, type: "modal", returnFocus};
  const form = backdrop.querySelector("form");
  form.onsubmit = event => { event.preventDefault(); onSubmit(form); };
  backdrop.querySelector("[data-herdr-cancel]").onclick = () => closeHerdrOverlay();
  backdrop.querySelector("input, select, button")?.focus();
  return backdrop;
}

function openHerdrPrompt(title, value, action, params, returnFocus) {
  const root = herdrModal(`<form><h2>${esc(title)}</h2><label>name<input name="label" value="${esc(value)}" maxlength="80" autocomplete="off"></label><div class="herdr-modal-error" aria-live="polite"></div><div class="herdr-modal-actions"><button type="button" data-herdr-cancel>cancel</button><button type="submit" class="primary">save</button></div></form>`, returnFocus, async form => {
    const label = form.elements.label.value;
    if (!label || label.length > 80 || label.startsWith("-")) { setHerdrError('Name must be 1–80 characters and not start with "-"', root); return; }
    const button = form.querySelector('[type="submit"]');
    button.disabled = true;
    const result = await herdrAction(action, {...params, label}, root);
    button.disabled = false;
    if (result.ok && herdrOverlay?.root === root) { closeHerdrOverlay(false); renderHerdrPage(); }
  });
  const input = root.querySelector("input");
  input.select();
}

function openHerdrConfirm(title, detail, action, params, returnFocus, {confirm = "close", after = renderHerdrPage} = {}) {
  const root = herdrModal(`<form><h2>${esc(title)}</h2><p class="herdr-modal-detail">${esc(detail)}</p><div class="herdr-modal-error" aria-live="polite"></div><div class="herdr-modal-actions"><button type="submit" class="danger">${esc(confirm)}</button><button type="button" data-herdr-cancel>cancel</button></div></form>`, returnFocus, async form => {
    const button = form.querySelector('[type="submit"]');
    button.disabled = true;
    const result = await herdrAction(action, params, root);
    button.disabled = false;
    if (result.ok && herdrOverlay?.root === root) { closeHerdrOverlay(false); after(); }
  });
}

const SESSION_ENGINES = {
  claude: {label: "Claude", note: "Opens a new tab in the space and runs cc -n '<name>'"},
  codex: {label: "Codex", note: "Opens a new tab in the space, named <name>, and runs codex"},
  grok: {label: "Grok", note: "Opens a new tab in the space, named <name>, and runs opencode -m xai/grok-4.7"},
};

async function openNewSession(returnFocus) {
  if (!herdrData) await loadHerdr();
  const workspaces = herdrData.workspaces || [];
  if (!herdrData.running || !workspaces.length) {
    herdrModal('<form><h2>new session</h2><p class="herdr-modal-note">herdr is not running or has no spaces</p><div class="herdr-modal-actions"><button type="button" data-herdr-cancel>close</button></div></form>', returnFocus, () => closeHerdrOverlay());
    return;
  }
  const focused = (herdrData.panes || []).find(x => x.pane_id === herdrData.focused_pane_id);
  const current = (focused || {}).workspace_id || workspaces[0].workspace_id;
  const options = workspaces.map(x => `<option value="${esc(x.workspace_id)}" ${x.workspace_id === current ? "selected" : ""}>${esc(x.label || x.workspace_id)}</option>`).join("");
  const engines = Object.entries(SESSION_ENGINES).map(([k, e]) => `<option value="${k}"${k === "claude" ? " selected" : ""}>${esc(e.label)}</option>`).join("");
  const root = herdrModal(`<form><h2>new session</h2><label>agent<select name="engine">${engines}</select></label><label>name<input name="name" maxlength="80" autocomplete="off" required></label><label>space<select name="space">${options}</select></label><p class="herdr-modal-note" data-engine-note>${esc(SESSION_ENGINES.claude.note)}</p><div class="herdr-modal-error" aria-live="polite"></div><div class="herdr-modal-actions"><button type="button" data-herdr-cancel>cancel</button><button type="submit" class="primary">start</button></div></form>`, returnFocus, async form => {
    const name = form.elements.name.value.trim();
    if (!name || name.length > 80 || name.startsWith("-")) { setHerdrError('Name must be 1–80 characters and not start with "-"', root); return; }
    const button = form.querySelector('[type="submit"]');
    button.disabled = true;
    button.textContent = "starting…";
    const result = await herdrAction("session.create", {workspace_id: form.elements.space.value, name, engine: form.elements.engine.value}, root);
    button.disabled = false;
    button.textContent = "start";
    if (result.ok && herdrOverlay?.root === root) { closeHerdrOverlay(); load(); }
  });
  const engine = root.querySelector('[name="engine"]');
  engine.onchange = () => { root.querySelector("[data-engine-note]").textContent = SESSION_ENGINES[engine.value].note; };
}

function openStartAgent(pane, returnFocus) {
  const kinds = herdrData.agent_kinds || [];
  const kind = kinds.includes("claude") ? "claude" : kinds[0] || "claude";
  const options = (kinds.length ? kinds : [kind]).map(x => `<option value="${esc(x)}" ${x === kind ? "selected" : ""}>${esc(x)}</option>`).join("");
  const root = herdrModal(`<form><h2>start agent</h2><label>kind<select name="kind">${options}</select></label><label>name<input name="name" value="${esc(kind)}" maxlength="80" autocomplete="off"></label><p class="herdr-modal-note">The pane must be at a shell prompt</p><div class="herdr-modal-error" aria-live="polite"></div><div class="herdr-modal-actions"><button type="button" data-herdr-cancel>cancel</button><button type="submit" class="primary">start</button></div></form>`, returnFocus, async form => {
    const button = form.querySelector('[type="submit"]');
    const name = form.elements.name.value;
    if (!name || name.length > 80 || name.startsWith("-")) { setHerdrError('Name must be 1–80 characters and not start with "-"', root); return; }
    button.disabled = true;
    button.textContent = "starting…";
    const selectedKind = form.elements.kind.value;
    const result = await herdrAction("agent.start", {pane_id: pane.pane_id, kind: selectedKind, name}, root);
    button.disabled = false;
    button.textContent = "start";
    if (result.ok && herdrOverlay?.root === root) { closeHerdrOverlay(false); renderHerdrPage(); }
    else {
      const errorText = typeof result.error === "string" ? result.error : JSON.stringify(result.error || "");
      if (errorText.includes("agent_not_ready") && herdrOverlay?.root === root) {
        herdrActionError = "";
        document.querySelectorAll(".herdr-page-error").forEach(x => x.textContent = "");
        closeHerdrOverlay(false);
        selectedHerdrPane = pane.pane_id;
        renderHerdrPage();
        showHerdrToast(`${selectedKind} started — waiting for input in the pane`);
      }
    }
  });
  const select = root.querySelector("select"), input = root.querySelector("input");
  select.onchange = () => { if (!input.value || input.value === kind || kinds.includes(input.value)) input.value = select.value; };
}

function showHerdrToast(message) {
  document.querySelector(".herdr-copy-toast")?.remove();
  const toast = document.createElement("div");
  toast.className = "herdr-copy-toast";
  toast.innerHTML = `<span class="dot">●</span><b>${esc(message)}</b>`;
  document.body.appendChild(toast);
  setTimeout(() => toast.remove(), 1800);
}

function openHerdrGlobalMenu(button) {
  const rect = button.getBoundingClientRect();
  openHerdrMenu([
    {label: "settings", disabled: true, title: "Available in the herdr terminal"},
    {label: "keybinds", disabled: true, title: "Available in the herdr terminal"},
    {label: "reload config", run: async () => { const result = await herdrAction("server.reload_config"); if (result.ok) showHerdrToast("config reloaded"); }},
    {label: "detach", disabled: true, title: "Available in the herdr terminal"},
  ], rect.left, rect.top, button, true);
}

function openHerdrContextMenu(kind, record, x, y, returnFocus) {
  const panes = herdrData.panes || [], tabs = herdrData.tabs || [];
  let items;
  if (kind === "workspace") {
    const count = panes.filter(x => x.workspace_id === record.workspace_id).length;
    items = [
      {label: "Rename", run: () => openHerdrPrompt("rename workspace", record.label || record.workspace_id, "workspace.rename", {workspace_id: record.workspace_id}, returnFocus)},
      {label: "Close", run: () => openHerdrConfirm("Close workspace?", `${record.label || record.workspace_id} — ${count} ${count === 1 ? "pane" : "panes"}`, "workspace.close", {workspace_id: record.workspace_id}, returnFocus)},
    ];
  } else if (kind === "tab") {
    const count = panes.filter(x => x.tab_id === record.tab_id).length;
    const number = tabs.filter(x => x.workspace_id === record.workspace_id).length + 1;
    items = [
      {label: "New tab", run: () => openHerdrPrompt("new tab", String(number), "tab.create", {workspace_id: record.workspace_id}, returnFocus)},
      {label: "Rename", run: () => openHerdrPrompt("rename tab", record.label || `Tab ${record.number}`, "tab.rename", {tab_id: record.tab_id}, returnFocus)},
      {label: "Close", run: () => openHerdrConfirm("Close tab?", `${record.label || `Tab ${record.number}`} — ${count} ${count === 1 ? "pane" : "panes"}`, "tab.close", {tab_id: record.tab_id}, returnFocus)},
    ];
  } else {
    const focused = herdrData.focused_pane_id;
    const selected = terminal && terminal.pane === record.pane_id ? terminalSelection(terminal) : "";
    items = [
      ...(selected ? [{label: "Copy", run: () => copySelection(selected)}] : []),
      ...(paneSaid(record.pane_id) ? [{label: "Copy last message", run: () => copyPaneSaid(record.pane_id)}] : []),
      {label: "Rename pane", run: () => openHerdrPrompt("rename pane", record.title || record.agent || record.pane_id, "pane.rename", {pane_id: record.pane_id}, returnFocus)},
      {label: "Clear pane name", run: () => herdrAction("pane.clear_name", {pane_id: record.pane_id})},
      ...(focused && focused !== record.pane_id ? [{label: "Swap with focused pane", run: () => herdrAction("pane.swap", {source_pane_id: record.pane_id, target_pane_id: focused})}] : []),
      {label: "Split right", run: () => herdrAction("pane.split", {pane_id: record.pane_id, direction: "right"})},
      {label: "Split down", run: () => herdrAction("pane.split", {pane_id: record.pane_id, direction: "down"})},
      {label: "Zoom", run: () => herdrAction("pane.zoom", {pane_id: record.pane_id})},
      {label: "Start agent…", run: () => openStartAgent(record, returnFocus)},
      {label: "Close pane", run: () => openHerdrConfirm("Close pane?", record.title || record.agent || record.pane_id, "pane.close", {pane_id: record.pane_id}, returnFocus)},
    ];
  }
  openHerdrMenu(items, x, y, returnFocus);
}

function herdrSidebarHtml(data, panes, selectedPane) {
  const tabs = data.tabs || [], focused = data.focused_pane_id;
  const workspaces = (data.workspaces || []).map(workspace => {
    const items = panes.filter(pane => pane.workspace_id === workspace.workspace_id);
    const target = items.find(pane => pane.pane_id === focused) || items[0];
    const selected = items.some(pane => pane.pane_id === selectedPane);
    return `<button class="herdr-workspace" data-herdr-pane="${esc((target || {}).pane_id || "")}" data-herdr-context="workspace" data-herdr-workspace-id="${esc(workspace.workspace_id)}" aria-selected="${selected}">${statusHtml(workspaceStatus(items))}<span class="workspace-label">${esc(workspace.label || workspace.workspace_id)}</span></button>`;
  }).join("");
  const agents = panes.filter(pane => pane.agent).map(pane => {
    const workspace = (data.workspaces || []).find(item => item.workspace_id === pane.workspace_id);
    const tab = tabs.find(item => item.tab_id === pane.tab_id);
    const meta = statusMeta(pane.status);
    return `<button class="herdr-agent" data-herdr-pane="${esc(pane.pane_id)}" data-herdr-context="pane" aria-selected="${pane.pane_id === selectedPane}" title="${esc(meta.word)}"><span class="agent-context">${statusHtml(pane.status)} <span>${esc((workspace || {}).label || pane.workspace_id)}</span><span class="agent-separator"> · </span><span class="agent-tab">${esc((tab || {}).label || `Tab ${(tab || {}).number || ""}`.trim())}</span></span><span class="agent-name">${esc(pane.title || pane.agent)}</span></button>`;
  }).join("");
  return `<div class="herdr-sidebar-edge" aria-hidden="true">│</div><section class="herdr-sidebar-section herdr-spaces"><div class="herdr-section-title"><span> spaces</span></div><div class="herdr-sidebar-rows">${workspaces}</div><footer class="herdr-sidebar-footer"><button data-herdr-action="workspace.create"> new</button><button data-herdr-global-menu>menu</button></footer></section><div class="herdr-sidebar-divider" role="separator" aria-label="Resize spaces and agents">${"─".repeat(25)}</div><section class="herdr-sidebar-section herdr-agents"><div class="herdr-section-title"><span> agents</span><span>grouped </span></div><div class="herdr-sidebar-rows">${agents}</div></section>`;
}

function herdrTabsHtml(data, panes, selectedPane) {
  const pane = panes.find(item => item.pane_id === selectedPane);
  const tabs = (data.tabs || []).filter(tab => pane && tab.workspace_id === pane.workspace_id).map(tab => {
    const members = panes.filter(item => item.tab_id === tab.tab_id), first = members[0], label = tab.label || `Tab ${tab.number}`;
    const selected = tab.tab_id === pane.tab_id;
    return `<div class="herdr-tab" role="tab" tabindex="${selected ? 0 : -1}" title="${esc(label)}" data-herdr-pane="${esc((first || {}).pane_id || "")}" data-herdr-context="tab" data-herdr-tab-id="${esc(tab.tab_id)}" aria-selected="${selected}" ${first ? "" : 'aria-disabled="true"'}><span class="herdr-tab-sep" aria-hidden="true"></span>${statusHtml(workspaceStatus(members))}<span class="herdr-tab-title">${esc(label)}</span><button class="herdr-tab-close" data-herdr-close-tab="${esc(tab.tab_id)}" tabindex="-1" aria-label="Close ${esc(label)}" title="Close tab">×</button></div>`;
  }).join("");
  const add = pane ? `<button class="herdr-tab-new" data-herdr-new-tab="${esc(pane.workspace_id)}" aria-label="New tab" title="New tab">+</button>` : "";
  return `<div class="herdr-tabs" role="tablist" aria-label="Workspace tabs">${tabs}${add}</div>`;
}

function updateHerdrTabOverflow(root) {
  root.querySelector('.herdr-tab[aria-selected="true"]')?.scrollIntoView({block: "nearest", inline: "nearest"});
}

function closeHerdrTab(tabId, returnFocus) {
  const tab = (herdrData.tabs || []).find(x => x.tab_id === tabId);
  if (!tab) return;
  const count = (herdrData.panes || []).filter(x => x.tab_id === tabId).length;
  openHerdrConfirm("Close tab?", `${tab.label || `Tab ${tab.number}`} — ${count} ${count === 1 ? "pane" : "panes"}`, "tab.close", {tab_id: tabId}, returnFocus);
}

function applyHerdrSidebarRatio(root) {
  const list = root.querySelector(".herdr-list");
  if (list) list.style.gridTemplateRows = `minmax(0, ${herdrSidebarRatio}fr) auto minmax(0, ${1 - herdrSidebarRatio}fr)`;
}

function herdrChromeSnapshot(root) {
  const active = document.activeElement;
  let focus = null;
  if (root.contains(active)) {
    if (active.matches(".herdr-workspace")) focus = ["workspace", active.dataset.herdrWorkspaceId];
    else if (active.matches(".herdr-agent")) focus = ["pane", active.dataset.herdrPane];
    else if (active.matches(".herdr-tab")) focus = ["tab", active.dataset.herdrTabId];
    else if (active.matches('[data-herdr-action="workspace.create"]')) focus = ["new", ""];
    else if (active.matches("[data-herdr-global-menu]")) focus = ["menu", ""];
  }
  return {scroll: [...root.querySelectorAll(".herdr-sidebar-rows")].map(x => x.scrollTop), focus};
}

function restoreHerdrChrome(root, snapshot) {
  root.querySelectorAll(".herdr-sidebar-rows").forEach((x, index) => { x.scrollTop = snapshot.scroll[index] || 0; });
  if (!snapshot.focus) return;
  const [kind, id] = snapshot.focus;
  const target = kind === "workspace" ? [...root.querySelectorAll(".herdr-workspace")].find(x => x.dataset.herdrWorkspaceId === id)
    : kind === "pane" ? [...root.querySelectorAll(".herdr-agent")].find(x => x.dataset.herdrPane === id)
      : kind === "tab" ? [...root.querySelectorAll(".herdr-tab")].find(x => x.dataset.herdrTabId === id)
        : root.querySelector(kind === "new" ? '[data-herdr-action="workspace.create"]' : "[data-herdr-global-menu]");
  target?.focus();
}

function wireHerdrPicks(root) {
  root.querySelectorAll("[data-herdr-pane]").forEach(button => button.onclick = () => {
    if (!button.dataset.herdrPane) return;
    selectedHerdrPane = button.dataset.herdrPane;
    renderHerdrPage();
  });
  root.querySelector('[data-herdr-action="workspace.create"]')?.addEventListener("click", event => herdrAction("workspace.create"));
  root.querySelectorAll("[data-herdr-close-tab]").forEach(button => button.onclick = event => {
    event.stopPropagation();
    closeHerdrTab(button.dataset.herdrCloseTab, button.closest(".herdr-tab"));
  });
  root.querySelectorAll(".herdr-tab").forEach(tab => {
    tab.onauxclick = event => { if (event.button === 1) { event.preventDefault(); closeHerdrTab(tab.dataset.herdrTabId, tab); } };
    tab.onmousedown = event => { if (event.button === 1) event.preventDefault(); };
    tab.onkeydown = event => {
      if (event.key === "Enter" || event.key === " ") { event.preventDefault(); tab.click(); return; }
      if (event.key !== "ArrowRight" && event.key !== "ArrowLeft") return;
      const all = [...root.querySelectorAll(".herdr-tab")], next = all[(all.indexOf(tab) + (event.key === "ArrowRight" ? 1 : all.length - 1)) % all.length];
      event.preventDefault();
      next?.focus();
    };
  });
  root.querySelectorAll("[data-herdr-new-tab]").forEach(button => button.onclick = () => {
    const workspace = button.dataset.herdrNewTab, number = (herdrData.tabs || []).filter(x => x.workspace_id === workspace).length + 1;
    openHerdrPrompt("new tab", String(number), "tab.create", {workspace_id: workspace}, button);
  });
  const globalMenu = root.querySelector("[data-herdr-global-menu]");
  if (globalMenu) globalMenu.onclick = () => openHerdrGlobalMenu(globalMenu);
  root.querySelectorAll("[data-herdr-context]").forEach(target => target.oncontextmenu = event => {
    event.preventDefault();
    const kind = target.dataset.herdrContext;
    const record = kind === "workspace"

const mdCells = l => l.trim().replace(/^\||\|$/g, "").split("|").map(x => x.trim());

function mdHtml(text) {
  const out = [], lines = text.split("\n");
  for (let i = 0; i < lines.length; i++) {
    const l = lines[i];
    if (/^\s*\|.*\|\s*$/.test(l) && /^\s*\|[\s:|-]+\|\s*$/.test(lines[i + 1] || "")) {
      const head = mdCells(l), rows = [];
      for (i += 2; i < lines.length && /^\s*\|.*\|\s*$/.test(lines[i]); i++) rows.push(mdCells(lines[i]));
      i--;
      out.push(`<table class="md"><tr>${head.map(h => `<th>${mdInline(h)}</th>`).join("")}</tr>${rows.map(r => `<tr>${r.map(c => `<td>${mdInline(c)}</td>`).join("")}</tr>`).join("")}</table>`);
    } else if (/^#{1,6} /.test(l)) out.push(`<div class="mdh">${mdInline(l.replace(/^#+ /, ""))}</div>`);
    else if (/^\s*([-*]|\d+\.) /.test(l)) out.push(`<div class="mdli" style="padding-left:${12 + l.search(/\S/) * 6}px">${/^\s*\d/.test(l) ? esc(l.trim().split(" ")[0]) : "•"} ${mdInline(l.trim().replace(/^([-*]|\d+\.) /, ""))}</div>`);
    else out.push(l.trim() ? `<div>${mdInline(l)}</div>` : '<div class="mdgap"></div>');
  }
  return out.join("");
}
