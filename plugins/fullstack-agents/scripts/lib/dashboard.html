<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Agents</title>
<style>
:root {
  --bg: #f6f5f2; --panel: #ffffff; --ink: #1d1c1a; --muted: #6b6862; --line: #e4e1da;
  --amber: #b26a00; --amber-bg: #fff3dc; --blue: #2459c9; --blue-bg: #e6eeff;
  --red: #b42318; --red-bg: #fde8e6; --green: #1f7a3d; --green-bg: #e3f4e8; --chip: #efede8;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #161514; --panel: #201f1d; --ink: #ecebe7; --muted: #a09d96; --line: #34322e;
    --amber: #f2b24c; --amber-bg: #3a2c12; --blue: #8fb0ff; --blue-bg: #1b2744;
    --red: #ff8a7f; --red-bg: #43201c; --green: #7fd59a; --green-bg: #183323; --chip: #2c2a27;
  }
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 14px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif; }
header { display: flex; align-items: center; gap: 16px; padding: 12px 20px; border-bottom: 1px solid var(--line); background: var(--panel); position: sticky; top: 0; z-index: 5; flex-wrap: wrap; }
header h1 { font-size: 15px; margin: 0; font-weight: 650; }
.meta { color: var(--muted); font-size: 12px; margin-left: auto; }
nav { display: flex; gap: 4px; flex-wrap: wrap; }
nav button { border: 1px solid transparent; background: none; color: var(--ink); padding: 6px 12px; border-radius: 8px; cursor: pointer; font: inherit; display: flex; gap: 6px; align-items: center; }
nav button[aria-selected="true"] { background: var(--chip); border-color: var(--line); font-weight: 600; }
.badge { min-width: 20px; padding: 0 6px; border-radius: 10px; font-size: 12px; font-weight: 700; text-align: center; background: var(--chip); color: var(--muted); }
.badge.amber { background: var(--amber); color: var(--panel); }
.badge.blue { background: var(--blue); color: var(--panel); }
.badge.red { background: var(--red); color: var(--panel); }
.badge.pulse { animation: pulse 1.2s ease-in-out infinite; }
@keyframes pulse { 50% { transform: scale(1.25); } }
main { padding: 16px 20px 40px; }
.strip { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 14px; }
.board { display: grid; grid-template-columns: repeat(9, minmax(170px, 1fr)); gap: 10px; overflow-x: auto; }
.col h2 { font-size: 12px; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); margin: 0 0 8px; display: flex; justify-content: space-between; }
.card { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 10px; margin-bottom: 8px; cursor: pointer; border-left-width: 4px; }
.card:hover { border-color: var(--muted); }
.card.red { border-left-color: var(--red); background: var(--red-bg); }
.card.amber { border-left-color: var(--amber); background: var(--amber-bg); }
.card.blue { border-left-color: var(--blue); background: var(--blue-bg); }
.card .t { font-weight: 600; word-break: break-word; }
.card .s { color: var(--muted); font-size: 12px; margin-top: 2px; word-break: break-word; }
.chips { display: flex; gap: 4px; flex-wrap: wrap; margin-top: 6px; }
.chip { font-size: 11px; padding: 1px 6px; border-radius: 6px; background: var(--chip); }
.chip.ok { background: var(--green-bg); color: var(--green); }
.chip.bad { background: var(--red-bg); color: var(--red); }
.row { display: flex; gap: 8px; align-items: center; margin-top: 8px; }
.dismiss { margin-left: auto; border: 1px solid var(--line); background: var(--panel); color: var(--muted); border-radius: 6px; font-size: 11px; padding: 2px 8px; cursor: pointer; }
.list { display: grid; gap: 10px; max-width: 980px; }
.list .card { cursor: default; }
.snip { white-space: pre-wrap; margin-top: 6px; font-size: 13px; }
.empty { color: var(--muted); padding: 20px 0; }
aside { position: fixed; top: 0; right: 0; bottom: 0; width: min(620px, 100%); background: var(--panel); border-left: 1px solid var(--line); display: flex; flex-direction: column; overflow: hidden; transform: translateX(100%); transition: transform .18s, width .18s; z-index: 10; }
aside.open { transform: none; }
aside.wide { width: min(1280px, 96vw); }
aside h3 { margin: 0 0 4px; font-size: 16px; }
aside h4 { margin: 14px 0 4px; font-size: 12px; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); }
aside pre { background: var(--chip); padding: 10px; border-radius: 8px; white-space: pre-wrap; word-break: break-word; font-size: 12px; max-height: 360px; overflow: auto; }
#phead { flex: none; padding: 16px 18px 6px; }
#phead .close { float: right; }
.ptabs { flex: none; display: flex; gap: 4px; padding: 0 18px; border-bottom: 1px solid var(--line); }
.tab2 { border: 0; background: none; color: var(--muted); font: inherit; padding: 8px 12px; cursor: pointer; border-bottom: 2px solid transparent; display: flex; gap: 6px; align-items: center; }
.tab2[aria-selected="true"] { color: var(--ink); font-weight: 600; border-bottom-color: var(--blue); }
.tab2:disabled { opacity: .4; cursor: default; }
.pbody { flex: 1; min-height: 0; display: flex; flex-direction: column; }
#info { flex: 1; min-height: 0; overflow: auto; padding: 4px 18px 18px; }
.tasks { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
.task { display: grid; grid-template-columns: 18px 1fr; gap: 2px 8px; align-items: start; padding: 10px; border: 1px solid var(--line); border-radius: 10px; cursor: pointer; background: var(--panel); }
.task:hover { border-color: var(--muted); }
.task input { margin: 3px 0 0; }
.task .tn { font-weight: 600; }
.task .tg { grid-column: 2; margin-top: 2px; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
.sheet { display: flex; flex-direction: column; flex: 1; min-height: 0; padding: 0 18px; }
.sheet h3 { margin-top: 10px; }
aside .sheet pre.log { flex: 1; min-height: 120px; max-height: none; margin: 10px 0; font-size: 11px; }
.end { flex: none; margin: 0 -18px; padding: 12px 18px; border-top: 3px solid var(--line); background: var(--panel); }
.end.ok { border-top-color: var(--green); }
.end.bad { border-top-color: var(--red); }
.end.live { border-top-color: var(--blue); }
aside .end pre { max-height: 140px; margin: 6px 0 0; }
.card .br { font: 11px/1.3 ui-monospace, SFMono-Regular, Menlo, monospace; color: var(--blue); margin-top: 3px; word-break: break-all; }
.gitview { flex: 1; min-height: 0; display: flex; }
.gcol { display: flex; flex-direction: column; min-width: 0; min-height: 0; border-right: 1px solid var(--line); }
.g1, .g2 { flex: 0 0 20%; }
.g3 { flex: 1; border-right: 0; }
.g1.hid, .g2.hid { flex: 0 0 30px; }
.gh { flex: none; display: flex; align-items: center; justify-content: space-between; gap: 6px; padding: 8px 10px; border-bottom: 1px solid var(--line); }
.gh .gt { font-weight: 600; font-size: 12px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
.gh .dismiss { margin-left: 0; flex: none; }
.gb { flex: 1; min-height: 0; overflow: auto; }
.rail { flex: 1; border: 0; background: none; color: var(--muted); cursor: pointer; font-size: 16px; }
.rail:hover { background: var(--chip); color: var(--ink); }
.grp { display: flex; align-items: center; gap: 6px; width: 100%; text-align: left; border: 0; background: var(--chip); color: var(--ink); font: inherit; font-weight: 600; font-size: 12px; padding: 6px 10px; cursor: pointer; position: sticky; top: 0; z-index: 1; }
.gi, .gf { display: block; width: 100%; text-align: left; border: 0; background: none; color: inherit; font: inherit; padding: 6px 10px; border-bottom: 1px solid var(--line); cursor: pointer; }
.gi:hover, .gf:hover { background: var(--chip); }
.gi.on, .gf.on { background: var(--blue-bg); }
.gi .sha { font: 11px ui-monospace, SFMono-Regular, Menlo, monospace; color: var(--blue); margin-right: 6px; }
.gi .sub, .gf .fd { display: block; color: var(--muted); font-size: 11px; word-break: break-all; }
.gf .fn { font: 12px ui-monospace, SFMono-Regular, Menlo, monospace; word-break: break-all; }
.st { display: inline-block; min-width: 16px; text-align: center; font: 700 11px ui-monospace, SFMono-Regular, Menlo, monospace; border-radius: 4px; margin-right: 6px; background: var(--chip); }
.st-A, .st-U { color: var(--green); }
.st-D { color: var(--red); }
.st-M, .st-R { color: var(--amber); }
aside .gcol pre.diff { margin: 0; border-radius: 0; background: none; padding: 0; white-space: pre; font: 11px/1.45 ui-monospace, SFMono-Regular, Menlo, monospace; max-height: none; overflow: visible; min-width: max-content; }
.diff span { display: block; padding: 0 10px; }
.diff .a { color: var(--green); background: var(--green-bg); }
.diff .d { color: var(--red); background: var(--red-bg); }
.diff .h { color: var(--blue); }
.hint { color: var(--muted); padding: 14px 10px; font-size: 12px; }
.live-dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: var(--blue); margin-right: 6px; animation: pulse 1.2s ease-in-out infinite; }
#toasts { position: fixed; top: 64px; right: 16px; display: grid; gap: 8px; z-index: 20; width: min(360px, calc(100% - 32px)); }
.toast { background: var(--panel); border: 1px solid var(--line); border-left: 5px solid var(--amber); border-radius: 10px; padding: 10px 12px; box-shadow: 0 6px 24px rgba(0,0,0,.18); cursor: pointer; animation: slide .2s ease-out; }
.toast.blue { border-left-color: var(--blue); }
.toast.red { border-left-color: var(--red); }
@keyframes slide { from { transform: translateX(30px); opacity: 0; } }
@media (max-width: 700px) { main, header { padding-left: 16px; padding-right: 16px; } .board { grid-template-columns: repeat(9, 78vw); } }
</style>
</head>
<body>
<header>
  <h1>Agents</h1>
  <nav role="tablist">
    <button role="tab" data-tab="board" aria-selected="true">Board <span class="badge" id="b-board">0</span></button>
    <button role="tab" data-tab="waiting">Waiting on you <span class="badge" id="b-waiting">0</span></button>
    <button role="tab" data-tab="still_open">Still open <span class="badge" id="b-still_open">0</span></button>
    <button role="tab" data-tab="abandoned">Old runs <span class="badge" id="b-abandoned">0</span></button>
  </nav>
  <span class="meta" id="meta">loading…</span>
</header>
<main id="main"></main>
<aside id="panel" aria-label="Details"></aside>
<div id="toasts" aria-live="polite"></div>
<script>
const PHASES = [["investigate","Investigate"],["plan","Plan"],["implement","Implement"],["rework","Rework"],["audit","Audit"],["review","Review"],["merged","Merged"],["deploying","Deploying"],["deployed","Deployed"]];
const FLAG_TEXT = {failed:"run failed", stalled:"run stalled", out_of_scope:"changed outside its paths", no_changes:"changed nothing", retries_exhausted:"retries used up"};
let uiSeen = null, tab = "board", state = null, seen = null, unseen = {waiting: false, still_open: false};
try { tab = localStorage.getItem("fsa-tab") || "board"; } catch (e) {}

const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const ago = t => { const s = Math.max(0, Date.now()/1000 - t); return s < 90 ? `${Math.round(s)}s` : s < 5400 ? `${Math.round(s/60)}m` : s < 172800 ? `${Math.round(s/3600)}h` : `${Math.round(s/86400)}d`; };
const chip = c => { const good = /^(GREEN|PASS)$/.test(c.verdict), bad = /^(RED|CHANGES)$/.test(c.verdict); return `<span class="chip ${good ? "ok" : bad ? "bad" : ""}" title="${esc(c.label)}">${esc(c.kind)} ${esc(c.verdict)}</span>`; };

async function dismiss(key, ev) {
  ev?.stopPropagation();
  await fetch("/api/dismiss", {method: "POST", headers: {"Content-Type": "application/json"}, body: JSON.stringify({key})});
  load();
}

function cardHtml(c) {
  const tone = c.needs_you.length ? "red" : c.sessions.some(s => s.state === "waiting") ? "amber" : c.sessions.some(s => s.state === "still_open") ? "blue" : "";
  const sess = c.sessions.map(s => s.name).filter(n => n !== c.title).join(", ");
  const branch = c.tree ? c.tree.branch : (c.sessions[0] || {}).branch;
  const sub = [c.label && c.label !== c.title ? c.label : "", sess, c.declared ? c.declared.note : ""].filter(Boolean).join(" · ");
  const chips = [
    c.round > 1 ? `<span class="chip">round ${c.round}</span>` : "",
    ...c.needs_you.map(f => `<span class="chip bad">${esc(FLAG_TEXT[f] || f)}</span>`),
    ...c.chips.map(chip),
    c.tree && c.tree.dirty ? `<span class="chip">${c.tree.dirty} uncommitted</span>` : "",
  ].join("");
  return `<div class="card ${tone}" tabindex="0" data-key="${esc(c.key)}">
    <div class="t">${esc(c.title)}</div>
    ${branch ? `<div class="br">${esc(branch)}</div>` : ""}
    ${sub ? `<div class="s">${esc(sub)}</div>` : ""}
    <div class="chips">${chips}</div>
    <div class="row"><span class="s">${ago(c.updated)} ago</span><button class="dismiss" data-dismiss="${esc(c.key)}">Dismiss</button></div></div>`;
}

function attentionHtml(items, tone, emptyText) {
  if (!items.length) return `<div class="empty">${emptyText}</div>`;
  return `<div class="list">${items.map(s => `<div class="card ${tone}">
    <div class="t">${esc(s.name)}</div>
    <div class="s">idle ${ago(s.updated)} · ${esc(s.phase || "no task card")}${s.branch ? " · " + esc(s.branch) : ""}</div>
    <div class="snip">${esc(s.snippet)}</div>
    <div class="row"><span class="s">${esc(s.id)}</span><button class="dismiss" data-dismiss="${esc(s.key)}">Dismiss</button></div></div>`).join("")}</div>`;
}

function render() {
  if (!state) return;
  const m = document.getElementById("main");
  const red = state.cards.filter(c => c.needs_you.length);
  if (tab === "board") {
    const strip = red.length ? `<div class="strip">${red.map(c => `<div class="card red" data-key="${esc(c.key)}"><b>Needs you:</b> ${esc(c.title)} — ${esc(c.needs_you.map(f => FLAG_TEXT[f] || f).join(", "))}</div>`).join("")}</div>` : "";
    m.innerHTML = strip + `<div class="board">${PHASES.map(([k, label]) => {
      const cs = state.cards.filter(c => c.phase === k);
      return `<section class="col"><h2>${label}<span>${cs.length}</span></h2>${cs.map(cardHtml).join("")}</section>`;
    }).join("")}</div>`;
  } else if (tab === "waiting") {
    m.innerHTML = attentionHtml(state.waiting, "amber", "No session is waiting on you.");
  } else if (tab === "still_open") {
    m.innerHTML = attentionHtml(state.still_open, "blue", "No session stopped with unfinished work.");
  } else {
    m.innerHTML = state.abandoned.length ? `<div class="list">${state.abandoned.map(r => `<div class="card"><div class="t">${esc(r.unit || r.id)}</div><div class="s">${esc(r.goal)}</div><div class="s">${esc(r.root || "")} · last log ${ago(r.updated)} ago</div></div>`).join("")}</div>` : `<div class="empty">No abandoned runs.</div>`;
  }
  document.querySelectorAll("[data-key]").forEach(el => el.onclick = () => openCard(el.dataset.key));
  document.querySelectorAll("[data-dismiss]").forEach(el => el.onclick = ev => dismiss(el.dataset.dismiss, ev));
  document.querySelectorAll("nav button").forEach(b => b.setAttribute("aria-selected", String(b.dataset.tab === tab)));
}

const freshGit = () => ({sig: "", at: 0, items: null, open: {unc: true, com: true}, item: null, files: null, file: null, diff: ""});
let openKey = null, openRun = null, tab2 = "info", bodyKind = "", logSeen = "", logTimer = null, wasLive = false;
let git = {...freshGit(), hide1: false, hide2: false};
const LIVE = r => r.state === "running" || r.state === "stalled";
const stateChip = r => `<span class="chip ${r.flags.length ? "bad" : r.state === "done" ? "ok" : ""}">${esc(r.state)}</span>`;
const panel = () => document.getElementById("panel");
const enc = encodeURIComponent;

function setIfChanged(id, html) {
  const el = document.getElementById(id);
  if (!el || el.dataset.h === html) return false;
  const gb = el.querySelector(".gb"), top = gb ? gb.scrollTop : 0, left = gb ? gb.scrollLeft : 0, own = el.scrollTop;
  el.innerHTML = html;
  el.dataset.h = html;
  const nb = el.querySelector(".gb");
  if (nb) { nb.scrollTop = top; nb.scrollLeft = left; }
  el.scrollTop = own;
  return true;
}

function ensureBody(kind, html, onNew) {
  if (bodyKind === kind) return;
  bodyKind = kind;
  document.getElementById("pbody").innerHTML = html;
  if (onNew) onNew();
}

const paneHead = c => `<button class="dismiss close" id="close">Close</button>
  <h3>${esc(c.title)}</h3>
  ${c.tree ? `<div style="font:12px ui-monospace,monospace;color:var(--blue)">${esc(c.tree.branch)}</div>` : ""}
  <div class="s">${esc(c.phase)}${c.tree ? ` · ${c.tree.ahead} ahead · ${c.tree.dirty} uncommitted` : ""}</div>`;

const tabsHtml = c => `<button class="tab2" role="tab" data-t="info" aria-selected="${tab2 === "info"}">Information</button>
  <button class="tab2" role="tab" data-t="git" aria-selected="${tab2 === "git"}" ${c.tree ? "" : "disabled"}>Git changes${c.tree && c.tree.dirty ? ` <span class="badge">${c.tree.dirty}</span>` : ""}</button>`;

function infoHtml(c) {
  const tasks = c.runs.map(r => `<li class="task" data-run="${esc(r.id)}">
    <input type="checkbox" disabled ${r.state === "done" ? "checked" : ""} aria-label="${esc(r.state)}">
    <div><span class="tn">${esc(r.unit || r.id)}</span> ${stateChip(r)} <span class="s">${LIVE(r) ? '<span class="live-dot"></span>live · ' : ""}${ago(r.updated)} ago</span></div>
    ${r.goal ? `<div class="snip tg">${esc(r.goal)}</div>` : ""}</li>`).join("");
  return `<h4>Description</h4>
    <div class="snip">${esc(c.desc || c.goal || "No brief has been recorded for this work yet.")}</div>
    <div class="s" style="margin-top:6px">${esc(c.worktree)}</div>
    <p style="margin:8px 0 0"><b>Sessions:</b> ${c.sessions.map(s => `${esc(s.name)} (${esc(s.state)}, ${ago(s.updated)} ago)`).join(", ") || "none"}</p>
    <h4>Tasks</h4>${tasks ? `<ul class="tasks">${tasks}</ul>` : '<div class="empty">No implementer tasks yet.</div>'}`;
}

function headHtml(c, r) {
  return `<div class="row" style="margin:0"><button class="dismiss" id="back" style="margin-left:0">← Tasks</button></div>
    <h3>${LIVE(r) ? '<span class="live-dot"></span>' : ""}${esc(r.unit || r.id)} ${stateChip(r)}</h3>
    <div class="s">${esc(c.title)} · ${esc(r.engine)} · <span id="sh-age"></span></div>
    ${r.goal ? `<div class="snip">${esc(r.desc || r.goal)}</div>` : ""}`;
}

function endHtml(r) {
  if (LIVE(r)) return `<b>End of task</b> <span class="s">— still running; the result lands here when it finishes.</span>`;
  const flags = r.flags.map(f => `<span class="chip bad">${esc(FLAG_TEXT[f] || f)}</span>`).join(" ");
  return `<b>End of task</b> ${stateChip(r)} ${flags}
    ${r.summary ? `<pre>${esc(r.summary)}</pre>` : '<div class="s">No result text was recorded.</div>'}
    ${r.open_risks.length ? `<div class="s"><b>Open risks:</b> ${esc(r.open_risks.join(" · "))}</div>` : ""}`;
}

async function pollLog(id) {
  if (document.hidden) return;
  try {
    const t = await (await fetch("/api/log?id=" + enc(id), {cache: "no-store"})).text();
    const el = document.getElementById("log");
    if (!el || openRun !== id || t === logSeen) return;
    const stick = !logSeen || el.scrollHeight - el.scrollTop - el.clientHeight < 40;
    el.textContent = logSeen = t || "(log is empty)";
    if (stick) el.scrollTop = el.scrollHeight;
  } catch (e) {}
}

function stopLog() { clearInterval(logTimer); logTimer = null; }

function paintInfo(c) {
  const r = openRun && c.runs.find(x => x.id === openRun);
  if (openRun && !r) openRun = null;
  if (!r) {
    stopLog();
    ensureBody("info", '<div id="info"></div>');
    if (setIfChanged("info", infoHtml(c))) document.querySelectorAll("#info [data-run]").forEach(li => li.onclick = () => openTask(li.dataset.run));
    return;
  }
  ensureBody("sheet:" + r.id, '<div class="sheet"><div id="sh-head"></div><pre class="log" id="log" tabindex="0">loading…</pre><div class="end" id="sh-end"></div></div>', () => {
    stopLog();
    logSeen = "";
    wasLive = LIVE(r);
  });
  if (setIfChanged("sh-head", headHtml(c, r))) document.getElementById("back").onclick = () => { openRun = null; paintPanel(); };
  document.getElementById("sh-age").textContent = `${ago(r.updated)} ago${LIVE(r) ? " · live" : ""}`;
  document.getElementById("sh-end").className = "end " + (LIVE(r) ? "live" : r.flags.length || r.state !== "done" ? "bad" : "ok");
  setIfChanged("sh-end", endHtml(r));
  if (LIVE(r)) {
    if (!logTimer) { pollLog(r.id); logTimer = setInterval(() => pollLog(r.id), 2500); }
  } else {
    stopLog();
    if (wasLive || !logSeen) pollLog(r.id);
    wasLive = false;
  }
}

const stc = s => s === "?" ? "U" : s;
const diffHtml = t => (t || "").split("\n").map(l => `<span class="${l.startsWith("+") && !l.startsWith("+++") ? "a" : l.startsWith("-") && !l.startsWith("---") ? "d" : l.startsWith("@@") ? "h" : ""}">${esc(l) || "&#8203;"}</span>`).join("");

function col1Html(c) {
  if (git.hide1) return '<button class="rail" data-show="1" title="Show changes" aria-label="Show changes">»</button>';
  const it = git.items, unc = it ? it.dirty : c.tree ? c.tree.dirty : 0, n = it ? it.commits.length : 0;
  let h = '<div class="gh"><span class="gt">Changes</span><button class="dismiss" data-hide="1" title="Hide changes">Hide «</button></div><div class="gb">';
  h += `<button class="grp" data-g="unc">${git.open.unc ? "▾" : "▸"} Uncommitted changes <span class="badge">${unc}</span></button>`;
  if (git.open.unc) h += unc ? `<button class="gi${git.item === "WORKTREE" ? " on" : ""}" data-ref="WORKTREE"><b>Working tree</b><span class="sub">${unc} file${unc === 1 ? "" : "s"} · not committed yet</span></button>` : '<div class="hint">Working tree is clean.</div>';
  h += `<button class="grp" data-g="com">${git.open.com ? "▾" : "▸"} ${it && it.recent ? "Recent commits" : "Commits ahead of main"} <span class="badge">${n}</span></button>`;
  if (git.open.com) h += !it ? '<div class="hint">Loading…</div>' : n ? it.commits.map(m => `<button class="gi${git.item === m.sha ? " on" : ""}" data-ref="${esc(m.sha)}"><span class="sha">${esc(m.sha)}</span>${esc(m.subject)}<span class="sub">${ago(m.at)} ago</span></button>`).join("") : '<div class="hint">No commits.</div>';
  return h + "</div>";
}

function col2Html() {
  if (git.hide2) return '<button class="rail" data-show="2" title="Show files" aria-label="Show files">»</button>';
  let h = '<div class="gh"><span class="gt">Files</span><button class="dismiss" data-hide="2" title="Hide files">Hide «</button></div><div class="gb">';
  if (!git.item) h += '<div class="hint">Pick a change on the left.</div>';
  else if (!git.files) h += '<div class="hint">Loading…</div>';
  else if (!git.files.length) h += '<div class="hint">No files.</div>';
  else h += git.files.map(f => {
    const i = f.path.lastIndexOf("/");
    return `<button class="gf${git.file === f.path ? " on" : ""}" data-file="${esc(f.path)}"><span class="st st-${esc(stc(f.status))}">${esc(f.status)}</span><span class="fn">${esc(f.path.slice(i + 1))}</span><span class="fd">${esc(i < 0 ? "" : f.path.slice(0, i))}</span></button>`;
  }).join("");
  return h + "</div>";
}

const col3Html = () => `<div class="gh"><span class="gt">${esc(git.file || "Changes")}</span></div><div class="gb">${git.file ? `<pre class="diff">${diffHtml(git.diff)}</pre>` : '<div class="hint">Pick a file to see its changes.</div>'}</div>`;

function wireGit(c) {
  const root = document.querySelector(".gitview");
  if (!root) return;
  root.querySelectorAll("[data-g]").forEach(b => b.onclick = () => { git.open[b.dataset.g] = !git.open[b.dataset.g]; paintGit(c); });
  root.querySelectorAll("[data-ref]").forEach(b => b.onclick = () => pickItem(c, b.dataset.ref));
  root.querySelectorAll("[data-file]").forEach(b => b.onclick = () => pickFile(c, b.dataset.file));
  root.querySelectorAll("[data-hide]").forEach(b => b.onclick = () => { git["hide" + b.dataset.hide] = true; paintGit(c); });
  root.querySelectorAll("[data-show]").forEach(b => b.onclick = () => { git["hide" + b.dataset.show] = false; paintGit(c); });
}

function paintGit(c) {
  ensureBody("git", '<div class="gitview"><section class="gcol g1" id="g1"></section><section class="gcol g2" id="g2"></section><section class="gcol g3" id="g3"></section></div>');
  document.getElementById("g1").classList.toggle("hid", git.hide1);
  document.getElementById("g2").classList.toggle("hid", git.hide2);
  const changed = [setIfChanged("g1", col1Html(c)), setIfChanged("g2", col2Html()), setIfChanged("g3", col3Html())];
  if (changed.some(Boolean)) wireGit(c);
}

async function getJson(url) { return (await fetch(url, {cache: "no-store"})).json(); }

async function loadChanges(c, force) {
  const sig = c.tree ? `${c.tree.head}|${c.tree.dirty}|${c.tree.edited}` : "";
  if (!force && git.items && git.sig === sig && Date.now() - git.at < 15000) return;
  git.sig = sig;
  git.at = Date.now();
  try { git.items = await getJson("/api/changes?key=" + enc(c.key)); } catch (e) { return; }
  if (openKey !== c.key || tab2 !== "git") return;
  const it = git.items, pick = it.dirty ? "WORKTREE" : (it.commits[0] || {}).sha;
  if (!git.item && pick) return pickItem(c, pick);
  paintGit(c);
  if (git.item) loadFiles(c);
}

function pickItem(c, ref) {
  git.item = ref;
  git.files = null;
  git.file = null;
  git.diff = "";
  paintGit(c);
  loadFiles(c);
}

async function loadFiles(c) {
  const ref = git.item;
  if (!ref) return;
  try { git.files = await getJson(`/api/files?key=${enc(c.key)}&ref=${enc(ref)}`); } catch (e) { return; }
  if (git.item !== ref || openKey !== c.key) return;
  if (git.file && !git.files.some(f => f.path === git.file)) git.file = null;
  if (!git.file && git.files.length) return pickFile(c, git.files[0].path);
  paintGit(c);
  if (git.file) loadGitDiff(c);
}

function pickFile(c, path) {
  git.file = path;
  git.diff = "";
  paintGit(c);
  const gb = document.querySelector("#g3 .gb");
  if (gb) { gb.scrollTop = 0; gb.scrollLeft = 0; }
  loadGitDiff(c);
}

async function loadGitDiff(c) {
  const ref = git.item, path = git.file;
  if (!ref || !path) return;
  try {
    const t = await (await fetch(`/api/diff?key=${enc(c.key)}&ref=${enc(ref)}&path=${enc(path)}`, {cache: "no-store"})).text();
    if (git.item !== ref || git.file !== path) return;
    git.diff = t;
    paintGit(c);
  } catch (e) {}
}

function paintPanel() {
  const c = openKey && state && state.cards.find(x => x.key === openKey);
  if (!c) return closePanel();
  const p = panel();
  if (!document.getElementById("pbody")) {
    p.innerHTML = '<div id="phead"></div><div class="ptabs" id="ptabs" role="tablist"></div><div class="pbody" id="pbody"></div>';
    bodyKind = "";
  }
  p.classList.toggle("wide", tab2 === "git");
  if (setIfChanged("phead", paneHead(c))) document.getElementById("close").onclick = closePanel;
  if (setIfChanged("ptabs", tabsHtml(c))) document.querySelectorAll("#ptabs [data-t]").forEach(b => b.onclick = () => { tab2 = b.dataset.t; paintPanel(); });
  if (tab2 === "git" && c.tree) {
    stopLog();
    paintGit(c);
    loadChanges(c, false);
  } else {
    paintInfo(c);
  }
}

function openCard(key) {
  if (openKey !== key) git = {...freshGit(), hide1: git.hide1, hide2: git.hide2};
  openKey = key;
  openRun = null;
  tab2 = "info";
  bodyKind = "";
  panel().innerHTML = "";
  panel().classList.add("open");
  paintPanel();
}

function openTask(id) {
  openRun = id;
  paintPanel();
}

function closePanel() {
  stopLog();
  openKey = openRun = null;
  bodyKind = "";
  git = {...freshGit(), hide1: git.hide1, hide2: git.hide2};
  panel().classList.remove("open", "wide");
  panel().innerHTML = "";
}

function toast(text, tone, target) {
  const t = document.createElement("div");
  t.className = "toast " + tone;
  t.innerHTML = text;
  t.onclick = () => { setTab(target); t.remove(); };
  document.getElementById("toasts").appendChild(t);
  setTimeout(() => t.remove(), 15000);
}

function notify() {
  const ids = {waiting: new Set(state.waiting.map(s => s.key + s.updated)), still_open: new Set(state.still_open.map(s => s.key + s.updated))};
  if (seen) {
    state.waiting.filter(s => !seen.waiting.has(s.key + s.updated)).forEach(s => { unseen.waiting = tab !== "waiting"; toast(`<b>Waiting on you:</b> ${esc(s.name)}<div class="s">${esc(s.snippet.slice(-140))}</div>`, "", "waiting"); });
    state.still_open.filter(s => !seen.still_open.has(s.key + s.updated)).forEach(s => { unseen.still_open = tab !== "still_open"; toast(`<b>Still open:</b> ${esc(s.name)}`, "blue", "still_open"); });
  }
  seen = ids;
  const n = {board: state.cards.filter(c => c.needs_you.length).length, waiting: state.waiting.length, still_open: state.still_open.length, abandoned: state.abandoned.length};
  const tone = {board: "red", waiting: "amber", still_open: "blue", abandoned: ""};
  for (const k in n) {
    const b = document.getElementById("b-" + k);
    b.textContent = n[k];
    b.className = "badge" + (n[k] && tone[k] ? " " + tone[k] : "") + (unseen[k] ? " pulse" : "");
  }
  const total = n.waiting + n.still_open + n.board;
  document.title = total ? `(${total}) Agents` : "Agents";
}

function setTab(t) {
  tab = t;
  unseen[t] = false;
  try { localStorage.setItem("fsa-tab", t); } catch (e) {}
  render();
  if (state) notify();
}

async function load() {
  try {
    const r = await fetch("/api/state", {cache: "no-store"});
    if (!r.ok) throw new Error(r.status);
    state = await r.json();
    if (uiSeen && state.ui && uiSeen !== state.ui) return location.reload();
    uiSeen = state.ui;
    document.getElementById("meta").textContent = `${state.repo} · ${state.locks.deploy ? "deploy lock held · " : ""}updated ${new Date(state.generated * 1000).toLocaleTimeString()}`;
    notify();
    render();
    if (openKey) paintPanel();
  } catch (e) {
    document.getElementById("meta").textContent = "offline — retrying";
  }
}

document.querySelectorAll("nav button").forEach(b => b.onclick = () => setTab(b.dataset.tab));
document.addEventListener("keydown", e => { if (e.key !== "Escape") return; if (openRun) { openRun = null; paintPanel(); } else closePanel(); });
document.addEventListener("visibilitychange", () => { if (!document.hidden && openRun) pollLog(openRun); });
load();
setInterval(load, 4000);
</script>
</body>
</html>
