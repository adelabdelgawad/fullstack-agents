const gitBadge = c => !c.tree ? 0 : typeof c.tree.own === "number" ? c.tree.own : c.tree.dirty;
const rank = c => c.fresh ? -1 : c.sessions.some(s => s.state === "working") || c.runs.some(r => r.state === "running") ? 0 : needsHuman(c) ? 1 : QUIET.has(c.phase) ? 3 : 2;

const needsHuman = c => c.phase !== "complete" && (c.phase === "review" || c.needs_you.length > 0 || c.sessions.some(s => s.state === "waiting"));
const stageOf = c => needsHuman(c) ? "human" : (STAGES.find(s => s.phases.includes(c.phase)) || STAGES[0]).key;

const LENSES = [["security", "sec"], ["ux", "ux"], ["code", "code"]];
const cell = (tone, label, title, attrs = "") => `<span class="cell ${tone}" title="${esc(title)}"${attrs ? ` role="button" tabindex="0" ${attrs}` : ""}>${esc(label)}</span>`;
const agentAttrs = a => a ? `data-asid="${esc(a.sid)}" data-agent="${esc(a.id)}"` : "";
const verdictTone = v => /^(GREEN|PASS)$/.test(v) ? "PASS" : /^(RED|CHANGES|FAIL)$/.test(v) ? "CHANGES" : "done";

const unitPrefix = units => {
  const parts = units.map(u => u.split("-"));
  let n = 0;
  while (parts.length && parts.every(p => p.length > n + 1 && p[n] === parts[0][n])) n++;
  return n ? parts[0].slice(0, n).join("-") + "-" : "";
};

function roundOf(rounds, at) {
  let i = -1;
  rounds.forEach((r, n) => { if ((r.started || r.updated) <= at) i = n; });
  return i;
}

function roundsHtml(c) {
  const runs = c.rounds || [];
  const agents = (c.now || []).flatMap(s => (s.agents || []).map(a => ({...a, sid: s.id})));
  if (!runs.length) {
    const scan = agents.filter(a => a.label.startsWith("bounded-extractor"));
    const lead = c.sessions.some(s => s.state === "working") ? "live" : c.sessions.some(s => s.state === "waiting") ? "bad" : c.sessions.length ? "done" : "";
    const session = c.sessions.find(s => s.engine === "codex") || c.sessions[0] || {};
    const leadLabel = ["lead", session.engine || "claude", session.model || (session.engine === "codex" ? "" : "opus")].filter(Boolean).join(" · ");
    return `<div class="rounds"><div class="round"><div class="cells">${cell(lead, leadLabel, leadLabel + ": " + (lead || "no session"))}${scan.length ? cell(scan.some(a => a.state === "running") ? "live" : "done", "haiku scan", `bounded-extractor (haiku): ${scan.length} scan(s)`) : ""}</div></div></div>`;
  }
  const last = runs.length - 1, stage = stageOf(c), prefix = unitPrefix(runs.map(r => r.unit).filter(Boolean));
  const rows = runs.map((r, n) => {
    const at = x => roundOf(runs, x.at) === n;
    const chips = c.chips.filter(at), ags = agents.filter(at);
    const runTone = r.flags.length || r.state === "stalled" || r.state === "failed" ? "bad" : r.state === "running" ? "live" : "PASS";
    const after = n < last || r.state !== "running" && stage !== "build";
    const party = (kind, chipOf, label, name) => {
      const ch = chips.filter(chipOf).slice(-1)[0], ag = ags.filter(a => a.label.startsWith(kind));
      const open = agentAttrs(ag.find(a => a.state === "running") || ag[0]);
      if (ag.some(a => a.state === "running")) return cell("live", label, `${name}: running`, open);
      if (ch) return cell(verdictTone(ch.verdict), label, `${name}: ${ch.verdict} · ${ch.label}`, open);
      if (ag.length) return cell("done", label, `${name}: ${ag.map(a => a.state).join(", ")}`, open);
      return cell(after ? "skip" : "", label, `${name}: ${after ? "not run" : "pending"}`);
    };
    const lead = n < last ? (r.sent_back ? "CHANGES" : "PASS") : stage === "review" ? "wait" : ["human", "complete"].includes(stage) ? "PASS" : "";
    const leadTitle = {CHANGES: "lead audit: sent back for a fix", PASS: "lead audit: accepted", wait: "lead audit: in progress", "": "lead audit: pending"}[lead];
    const label = r.unit ? r.unit.slice(prefix.length) || r.unit : "no brief recorded";
    return `<div class="round" title="${esc(r.unit || r.id)}"><div class="rl"><span>${n + 1}</span><b>${esc(label)}</b><span>${esc(r.model || r.engine)}</span></div><div class="cells">${cell(runTone, "run", `implementer ${r.engine} ${r.model || ""} · ${r.unit}: ${r.state}${r.flags.length ? " · " + r.flags.join(", ") : ""} · open log`, `data-run-log="${esc(r.id)}" data-run-card="${esc(c.key)}"`)}${party("test-runner", x => x.kind === "tests", "test", "test-runner")}${LENSES.map(([k, s]) => party("diff-reviewer", x => x.kind === k, s, "diff-reviewer " + k)).join("")}${cell(lead, "lead", leadTitle)}</div></div>`;
  });
  const hidden = rows.length - 3;
  return `<div class="rounds">${hidden > 0 ? `<div class="earlier">+${hidden} earlier run${hidden > 1 ? "s" : ""}</div>` : ""}${rows.slice(-3).join("")}</div>`;
}

function cardHtml(c) {
  const human = needsHuman(c);
  const live = c.sessions.some(s => s.state === "working") || c.runs.some(r => r.state === "running");
  const branch = c.tree ? c.tree.branch : (c.sessions[0] || {}).branch;
  const sess = c.sessions.map(s => s.name).filter(n => n !== c.title).join(", ");
  const sub = [c.label && c.label !== c.title && c.label !== branch ? c.label : "", sess, c.declared ? c.declared.note : ""].filter(Boolean).join(" · ");
  const flag = c.needs_you.length ? FLAG_TEXT[c.needs_you[0]] || c.needs_you[0] : human ? "your call" : "";

  const chips = [

  const sid = ((c.now || [])[0] || c.sessions[0] || {}).id || "";

    <div class="card-top">${live ? '<span class="blink" aria-label="running"></span>' : ""}<span class="num">${esc(c.key.startsWith("session:") ? "session " + c.key.slice(8, 16) : c.key.split("/").pop())}</span>${flag ? `<span class="flag">${esc(flag)}</span>` : ""}<button class="star" data-fav="${esc(c.key)}" aria-pressed="${!!c.favourite}" aria-label="${c.favourite ? "Remove from favourites" : "Add to favourites"}" title="${c.favourite ? "Remove from favourites" : "Add to favourites"}">${c.favourite ? "★" : "☆"}</button></div>
    <p class="feature">${esc(c.title)}</p>
    ${c.repo && state && c.repo !== state.repo ? `<div class="branch">${esc(c.repo.split("/").pop())}</div>` : ""}
    ${branch ? `<div class="branch">${esc(branch)}</div>` : ""}
    <div class="cbody">${sub ? `<div class="s">${esc(sub)}</div>` : ""}
    ${roundsHtml(c)}
    ${c.sessions.filter(s => s.engine === "codex" && s.workflow_history?.length).map(s => `<div class="s" title="Recorded workflow progress for ${esc(s.name)}">${s.workflow_history.map(e => `<span title="${esc(new Date(e.timestamp * 1000).toLocaleString())}">${esc(e.phase)}</span>`).join(" → ")}</div>`).join("")}
    <div class="chips">${chips}</div>
    ${cardNow(c)}
    ${paths}

    <div class="foot"><span>${ago(c.updated)} ago</span></div></div>`;
}

const soleSid = c => c.tree && c.sessions.length === 1 ? c.sessions[0].id : "";
const worktreesOf = c => { const sid = soleSid(c); return sid ? ((state && state.cards) || []).filter(x => soleSid(x) === sid).sort((a, b) => rank(a) - rank(b) || b.updated - a.updated) : []; };
const lead = x => x.group ? x.primary : x;
const STAGE_LABEL = c => (STAGES.find(s => s.key === stageOf(c)) || {}).label || c.phase;

function groupBySession(cards) {
  const bySid = new Map();
  cards.forEach(c => { const sid = soleSid(c); if (sid) bySid.set(sid, [...(bySid.get(sid) || []), c]); });
  const out = [], done = new Set();
  for (const c of cards) {
    const sid = soleSid(c), kids = sid ? bySid.get(sid) : null;
    if (!kids || kids.length < 2) { out.push(c); continue; }
    if (done.has(sid)) continue;
    done.add(sid);
    const children = [...kids].sort((a, b) => rank(a) - rank(b) || b.updated - a.updated);
    out.push({group: true, sid, children, primary: children[0], key: children[0].key, updated: Math.max(...kids.map(k => k.updated))});
  }
  return out;
}

function wtRowHtml(c, current) {

const cardOfSession = sid => ((state && state.cards) || []).find(c => (c.now || []).some(s => s.id === sid)) || null;
const sessionOf = sid => { for (const c of (state && state.cards) || []) for (const s of c.now || []) if (s.id === sid) return s; return null; };
const AGENT_NAMES = {"shell": "bg shell", "bounded-extractor": "haiku scan", "test-runner": "test-runner", "diff-reviewer": "diff-review", "general-purpose": "general", "Explore": "explore"};

function agentTiles(c) {
  const tiles = cardAgents(c);
  return tiles.length ? `<div class="agents">${tiles.map(agentTile).join("")}</div>` : "";
}

function toolLine(s) {
  if (!s.action) return "";
  return s.action_running ? `Running ${ago(s.action_at)} · ${s.action}` : `Done ${ago(s.action_at)} ago · ${s.action}`;
}

function lastPara(text) {
  return (text || "").replace(/^… /, "").trim().split(/\n\s*\n/).pop().replace(/\s+/g, " ");
}

function cardNow(c) {
  const step = activeStep(c), s = (c.now || [])[0], wait = (c.now || []).find(x => x.state === "waiting" && x.need);
  if (!wait && s && s.state === "working") {

  }

  const line = wait ? `Needs you: ${wait.need}` : asking && asking.said ? `Needs you: ${lastPara(asking.said)}` : step ? `▸ ${step.text}` : s && s.ask ? `“${s.ask}”` : "";

  </div>`;

const mdInline = t => esc(t).replace(/`([^`]+)`/g, "<code>$1</code>").replace(/\*\*([^*]+)\*\*/g, "<b>$1</b>").replace(/(^|[^*])\*([^*\s][^*]*)\*/g, "$1<i>$2</i>");
const mdCells = l => l.trim().replace(/^\||\|$/g, "").split("|").map(x => x.trim());

function mdHtml(text) {
  const out = [], lines = text.split("\n");
  for (let i = 0; i < lines.length; i++) {
    const l = lines[i];
    if (/^\s*\|.*\|\s*$/.test(l) && /^\s*\|[\s:|-]+\|\s*$/.test(lines[i + 1] || "")) {
      const head = mdCells(l), rows = [];
      for (i += 2; i < lines.length && /^\s*\|.*\|\s*$/.test(lines[i]); i++) rows.push(mdCells(lines[i]));
      i--;
      out.push(`<table class="md"><tr>${head.map(h => `<th>${mdInline(h)}</th>`).join("")}</tr>${rows.map(r => `<tr>${r.map(c => `<td>${mdInline(c)}</td>`).join("")}</tr>`).join("")}</table>`);
    } else if (/^#{1,6} /.test(l)) out.push(`<div class="mdh">${mdInline(l.replace(/^#+ /, ""))}</div>`);
    else if (/^\s*([-*]|\d+\.) /.test(l)) out.push(`<div class="mdli" style="padding-left:${12 + l.search(/\S/) * 6}px">${/^\s*\d/.test(l) ? esc(l.trim().split(" ")[0]) : "•"} ${mdInline(l.trim().replace(/^([-*]|\d+\.) /, ""))}</div>`);
    else out.push(l.trim() ? `<div>${mdInline(l)}</div>` : '<div class="mdgap"></div>');
  }
  return out.join("");
}

function saidHtml(s) {
  const text = s.said_full || s.said;
  if (!text) return "";
  return `<div class="now"><div><b>${esc(s.name)}</b>${s.said_at ? ` <span class="s">sent ${ago(s.said_at)} ago</span>` : ""}</div><div class="said-full">${mdHtml(text)}</div>${docsHtml(s)}</div>`;
}

const COPY_ICON = '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="9" y="9" width="12" height="12" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>';
const CHECK_ICON = '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 6 9 17l-5-5"/></svg>';
const kb = n => n < 1024 ? `${n} B` : `${Math.round(n / 1024)} KB`;

function docsHtml(s) {
  const docs = s.docs || [];
  if (!docs.length) return "";
  return `<div class="lbl">Files in this message · ${docs.length}</div><div class="docs">${docs.map(d => `<div class="doc" title="${esc(d.path)}"><b>${esc(d.name)}</b><button class="copy-ico" data-doc-sid="${esc(s.id)}" data-doc="${esc(d.path)}" aria-label="Copy ${esc(d.name)}" title="Copy file content">${COPY_ICON}</button><span class="s">${esc(d.shown)} · ${kb(d.size)}</span></div>`).join("")}</div>`;
}

function saidText(sid) {
  for (const c of (state && state.cards) || []) for (const x of c.now || []) if (x.id === sid) return x.said_full || x.said || null;
  return null;
}

async function writeClipboard(text) {
  if (navigator.clipboard && window.isSecureContext) {
    await navigator.clipboard.writeText(text);
    return true;
  }
  const ta = Object.assign(document.createElement("textarea"), {value: text});
  ta.style.cssText = "position:fixed;opacity:0;top:0";
  document.body.appendChild(ta);
  ta.select();
  const ok = document.execCommand("copy");
  ta.remove();
  return ok;
}

function paneSaid(paneId) {
  const sid = Object.keys((state && state.session_panes) || {}).find(id => state.session_panes[id] === paneId);
  return sid ? saidText(sid) : null;
}

async function copyPaneSaid(paneId) {
  let ok = false;
  try { ok = await writeClipboard(paneSaid(paneId) || ""); } catch (err) { ok = false; }
  if (terminal && terminal.pane === paneId) showTerminalStatus(terminal, ok ? "Last message copied" : "Copy failed", 2000);
}

async function copyDoc(btn) {
  let ok = false;
  const title = btn.dataset.title || (btn.dataset.title = btn.title);
  try {
    const r = btn.dataset.said ? null : await fetch(`/api/doc?sid=${enc(btn.dataset.docSid)}&path=${enc(btn.dataset.doc)}`);
    const text = btn.dataset.said ? saidText(btn.dataset.said) : r.ok ? await r.text() : null;
    if (text !== null) ok = await writeClipboard(text);
  } catch (err) {
    ok = false;
  }
  btn.innerHTML = ok ? CHECK_ICON : "✕";
  btn.classList.toggle("ok", ok);
  btn.title = ok ? "Copied" : "Copy failed";
  setTimeout(() => { btn.innerHTML = COPY_ICON; btn.classList.remove("ok"); btn.title = title; }, 1500);
}

document.addEventListener("click", e => {
  const b = e.target.closest("[data-doc], [data-said]");
  if (b) { e.stopPropagation(); copyDoc(b); }
});

function resumeCmd(s) {
  if (s.engine === "codex") return `codex resume ${s.id}`;
  if (s.engine && s.engine !== "claude") return `${s.engine} in herdr pane ${((state && state.session_panes) || {})[s.id] || ""}`;
  return s.title ? `claude --resume "${s.title}"` : `claude --resume ${s.id}`;
}

function resumeHtml(s) {

}

function stepsHtml(c) {

  return `<ul class="steps">${c.steps.map(x => `<li class="${esc(x.state)}"><span class="mk" aria-label="${esc(x.state)}">${STEP_MARK[x.state] || "○"}</span><span class="tx">${esc(x.text)}</span>${x.note ? `<span class="nt">${esc(x.note)}</span>` : ""}</li>`).join("")}</ul>`;

function render() {
  if (view !== "agents" || !state) return;

  sw.lastChild.textContent = `Favourites only (${state.cards.filter(c => c.favourite).length})`;
  const cards = groupBySession(favOnly ? state.cards.filter(c => c.favourite) : state.cards);
  const cols = STAGES.map(s => ({...s, cards: cards.filter(c => stageOf(lead(c)) === s.key).sort((a, b) => rank(lead(a)) - rank(lead(b)) || b.updated - a.updated)}));
  document.getElementById("main").innerHTML = `<div class="board">${cols.map(s => {
    const loud = s.cards.filter(c => rank(lead(c)) < 3), quiet = s.cards.filter(c => rank(lead(c)) === 3);
    const open = expanded.has(s.key), shown = loud.concat(open ? quiet : quiet.slice(0, SHOWN));
    const more = quiet.length > SHOWN ? `<button class="more" data-more="${s.key}" aria-expanded="${open}">${open ? "Show fewer" : `Show all ${s.cards.length}`}</button>` : "";
    return `<section class="col ${s.key}${s.flow ? " flow" : ""}" aria-label="${s.label}">
      <div class="col-head"><h2>${s.label}</h2><span class="who" title="${esc(s.who)}">${esc(s.who)}</span><span class="count">${s.cards.length || ""}</span></div>
      ${shown.map(c => c.group ? groupHtml(c) : cardHtml(c)).join("") || '<div class="none">—</div>'}${more}</section>`;
  }).join("")}</div>`;
  document.querySelectorAll("[data-key]").forEach(el => {
    el.onclick = () => openCard(el.dataset.key);
    el.onkeydown = e => { if ((e.key === "Enter" || e.key === " ") && e.target === el) { e.preventDefault(); openCard(el.dataset.key); } };
  });
  document.querySelectorAll("#main [data-wt]").forEach(el => {
    el.onclick = ev => { ev.stopPropagation(); openCard(el.dataset.wt); };
    el.onkeydown = ev => ev.stopPropagation();
  });
  document.querySelectorAll("[data-fav]").forEach(el => {
    el.onclick = ev => toggleFavourite(el.dataset.fav, ev);
    el.onkeydown = ev => ev.stopPropagation();
  });
  document.querySelectorAll("[data-agent]").forEach(el => {
    el.onclick = ev => { ev.stopPropagation(); openAgent(el.dataset.asid, el.dataset.agent); };
    el.onkeydown = ev => { ev.stopPropagation(); if (ev.key === "Enter" || ev.key === " ") { ev.preventDefault(); el.click(); } };
  });

    el.onclick = ev => { ev.stopPropagation(); openRunLog(el.dataset.runCard, el.dataset.runLog); };

const freshGit = () => ({sig: "", at: 0, items: null, open: {unc: true, com: true, other: false}, item: null, files: null, file: null, diff: ""});
let openKey = null, openRun = null, showLog = false, tab2 = "info", bodyKind = "", logSeen = "", logTimer = null, wasLive = false;
let git = {...freshGit(), hide1: false, hide2: false};
const LIVE = r => r.state === "running" || r.state === "stalled";
const stateChip = r => `<span class="chip ${r.flags.length ? "bad" : r.state === "done" ? "ok" : ""}">${esc(r.state)}</span>`;
const dur = r => {
  const s = Math.max(0, Math.round((LIVE(r) ? Date.now() / 1000 : r.updated) - (r.started || r.updated)));
  return s < 60 ? `${s}s` : s < 3600 ? `${Math.floor(s / 60)}m ${String(s % 60).padStart(2, "0")}s` : `${Math.floor(s / 3600)}h ${String(Math.floor(s % 3600 / 60)).padStart(2, "0")}m`;
};
const STEP_MARK = {done: "✓", active: "▸", skipped: "–", pending: "○"};
const STATE_TEXT = {working: "working", waiting: "waiting on you", idle: "just finished a turn", still_open: "stopped", quiet: "no output for 5+ min"};
const stepsDone = c => c.steps.filter(x => x.state === "done" || x.state === "skipped").length;
const activeStep = c => c.steps.find(x => x.state === "active");
const panel = () => document.getElementById("panel");

function shellRun(a, c) {
  const x = a.shell || {}, runs = (c && c.runs) || [];
  return (x.run && runs.find(r => r.id === x.run)) || (x.brief && runs.filter(r => r.unit === x.brief).slice(-1)[0]) || null;
}

function shellFacts(a, c) {
  const x = a.shell || {}, s = ((c && c.now) || []).find(n => n.id === a.sid) || {}, run = shellRun(a, c);

function liveGroup(title, items, tile, cls = "agents") {

      const keys = infoOpen.get(c.key) || new Map();
      keys.set(el.dataset.infoSection, el.open);
      infoOpen.set(c.key, keys);
    };
  });
  document.querySelectorAll("#info .task").forEach(li => li.onclick = ev => { if (!ev.target.closest(".detail")) toggleTask(li.dataset.run); });
  const lb = document.querySelector("#info [data-log]");
  if (lb) lb.onclick = ev => { ev.stopPropagation(); showLog = !showLog; logSeen = ""; stopLog(); paintPanel(); };
  document.querySelectorAll("#info [data-agent]").forEach(el => el.onclick = ev => { ev.preventDefault(); openAgent(el.dataset.asid, el.dataset.agent); });
  document.querySelectorAll("#info [data-open-run]").forEach(el => el.onclick = ev => { ev.preventDefault(); showRunLog(el.dataset.openRun); });
  const cb = document.querySelector("#info [data-collapse]");
  if (cb) cb.onclick = ev => { ev.stopPropagation(); toggleTask(openRun); };
}

function paintInfo(c) {
  if (openRun && !c.runs.some(x => x.id === openRun)) { openRun = null; showLog = false; stopLog(); }
  ensureBody("info", '<div id="info"></div>');
  const currentInfo = document.getElementById("info");
  if (currentInfo?.dataset.card === c.key) {
    infoOpen.set(c.key, new Map([...currentInfo.querySelectorAll("[data-info-section]")].map(el => [el.dataset.infoSection, el.open])));
  }
  if (setIfChanged("info", infoHtml(c))) wireInfo(c);
  if (currentInfo) currentInfo.dataset.card = c.key;
  const r = openRun && c.runs.find(x => x.id === openRun);
  if (!r || !showLog) return stopLog();
  if (LIVE(r)) {
    wasLive = true;
    if (!logTimer) { pollLog(r.id); logTimer = setInterval(() => pollLog(r.id), 2500); }
  } else {
    stopLog();
    if (wasLive || !logSeen) { wasLive = false; pollLog(r.id); }
  }
}

function toggleTask(id) {
  openRun = openRun === id ? null : id;
  showLog = false;
  logSeen = "";
  wasLive = false;
  stopLog();
  paintPanel();
}

const stc = s => s === "?" ? "U" : s;
const diffHtml = t => (t || "").split("\n").map(l => `<span class="${l.startsWith("+") && !l.startsWith("+++") ? "a" : l.startsWith("-") && !l.startsWith("---") ? "d" : l.startsWith("@@") ? "h" : ""}">${esc(l) || "&#8203;"}</span>`).join("");

function col1Html(c) {
  if (git.hide1) return '<button class="rail" data-show="1" title="Show changes" aria-label="Show changes">»</button>';
  const it = git.items, unc = it ? it.dirty : c.tree ? c.tree.dirty : 0, n = it ? it.commits.length : 0;
  let h = '<div class="gh"><span class="gt">Changes</span><button class="action-button" data-hide="1" title="Hide changes">Hide «</button></div><div class="gb">';
  h += `<button class="grp" data-g="unc">${git.open.unc ? "▾" : "▸"} Uncommitted changes <span class="badge">${unc}</span></button>`;
  const own = it && typeof it.own === "number" ? ` · ${it.own} from this task, ${unc - it.own} other` : "";
  if (git.open.unc) h += unc ? `<button class="gi${git.item === "WORKTREE" ? " on" : ""}" data-ref="WORKTREE"><b>Working tree</b><span class="sub">${unc} file${unc === 1 ? "" : "s"} · not committed yet${own}</span></button>` : '<div class="hint">Working tree is clean.</div>';
  h += `<button class="grp" data-g="com">${git.open.com ? "▾" : "▸"} ${it && it.recent ? "This task's commits" : "Commits ahead of main"} <span class="badge">${n}</span></button>`;
  if (git.open.com) h += !it ? '<div class="hint">Loading…</div>' : n ? it.commits.map(m => `<button class="gi${git.item === m.sha ? " on" : ""}" data-ref="${esc(m.sha)}"><span class="sha">${esc(m.sha)}</span>${esc(m.subject)}<span class="sub">${ago(m.at)} ago</span></button>`).join("") : `<div class="hint">${it.recent ? "No commits from this task." : "No commits."}</div>`;
  return h + "</div>";
}

function col2Html() {
  if (git.hide2) return '<button class="rail" data-show="2" title="Show files" aria-label="Show files">»</button>';
  let h = '<div class="gh"><span class="gt">Files</span><button class="action-button" data-hide="2" title="Hide files">Hide «</button></div><div class="gb">';
  if (!git.item) h += '<div class="hint">Pick a change on the left.</div>';
  else if (!git.files) h += '<div class="hint">Loading…</div>';
  else if (!git.files.length) h += '<div class="hint">No files.</div>';
  else {
    const row = f => {
      const i = f.path.lastIndexOf("/");
      return `<button class="gf${git.file === f.path ? " on" : ""}" data-file="${esc(f.path)}"><span class="st st-${esc(stc(f.status))}">${esc(f.status)}</span><span class="fn">${esc(f.path.slice(i + 1))}</span><span class="fd">${esc(i < 0 ? "" : f.path.slice(0, i))}</span></button>`;
    };
    const scoped = git.files.some(f => "own" in f), mine = scoped ? git.files.filter(f => f.own) : git.files, rest = scoped ? git.files.filter(f => !f.own) : [];
    h += mine.length ? mine.map(row).join("") : '<div class="hint">No uncommitted files from this task.</div>';
    if (rest.length) {
      h += `<button class="grp" data-g="other">${git.open.other ? "▾" : "▸"} Not from this task <span class="badge">${rest.length}</span></button>`;
      if (git.open.other) h += rest.map(row).join("");
    }
  }
  return h + "</div>";
}

const col3Html = () => `<div class="gh"><span class="gt">${esc(git.file || "Changes")}</span></div><div class="gb">${git.file ? `<pre class="diff">${diffHtml(git.diff)}</pre>` : '<div class="hint">Pick a file to see its changes.</div>'}</div>`;

function wireGit(c) {
  const root = document.querySelector(".gitview");
  if (!root) return;
  root.querySelectorAll("[data-g]").forEach(b => b.onclick = () => { git.open[b.dataset.g] = !git.open[b.dataset.g]; paintGit(c); });
  root.querySelectorAll("[data-ref]").forEach(b => b.onclick = () => pickItem(c, b.dataset.ref));
  root.querySelectorAll("[data-file]").forEach(b => b.onclick = () => pickFile(c, b.dataset.file));
  root.querySelectorAll("[data-hide]").forEach(b => b.onclick = () => { git["hide" + b.dataset.hide] = true; paintGit(c); });
  root.querySelectorAll("[data-show]").forEach(b => b.onclick = () => { git["hide" + b.dataset.show] = false; paintGit(c); });
}

function paintGit(c) {
  ensureBody("git", '<div class="gitview"><section class="gcol g1" id="g1"></section><section class="gcol g2" id="g2"></section><section class="gcol g3" id="g3"></section></div>');
  document.getElementById("g1").classList.toggle("hid", git.hide1);
  document.getElementById("g2").classList.toggle("hid", git.hide2);
  const changed = [setIfChanged("g1", col1Html(c)), setIfChanged("g2", col2Html()), setIfChanged("g3", col3Html())];
  if (changed.some(Boolean)) wireGit(c);
}

function matchedCardPane(c) {
  if (!herdrData) return null;
  const owned = (state && state.session_panes) || {}, panes = herdrData.panes || [];
  const ids = [...(c.now || []), ...(c.sessions || [])].map(x => owned[x.id]).filter(Boolean);
  const byId = panes.find(p => ids.includes(p.pane_id));
  if (byId) return byId;
  const names = [...(c.now || []).flatMap(x => [x.title, x.name]), ...(c.sessions || []).map(x => x.name)].filter(Boolean);
  return panes.find(p => names.includes(p.title)) || null;
}

function paintCardTerminal(c) {
  stopLog();
  ensureBody("terminal", '<div id="card-terminal" class="herdr-detail"></div>');
  const host = document.getElementById("card-terminal");
  if (!herdrData) {
    host.innerHTML = '<div class="hint">Loading Herdr…</div>';
    loadHerdr();
    return;
  }
  if (!herdrData.running) {
    stopTerminal();
    host.innerHTML = '<div class="empty">herdr is not running on this server</div>';
    return;
  }
  const match = matchedCardPane(c), chosen = cardPaneChoice.get(c.key);
  const pane = match || (herdrData.panes || []).find(x => x.pane_id === chosen) || null;
  const missing = match ? "" : "No pane matches this card's session title or name.";
  if (terminalCanStay(pane, herdrData.panes || []) && host.contains(terminal.root)) {
    const pick = host.querySelector("[data-pane-pick]");
    if (pick) {
      const empty = document.createElement("option");
      empty.value = "";
      empty.textContent = "—";
      const options = (herdrData.panes || []).map(item => {
        const option = document.createElement("option");
        option.value = item.pane_id;
        option.textContent = item.title || item.pane_id;
        return option;
      });
      pick.replaceChildren(empty, ...options);
      pick.value = pane.pane_id;
    }
    updateTerminalStatus(pane);
    return;
  }
  const restore = terminalSnapshot();
  host.innerHTML = terminalHtml(pane, herdrData.panes || [], missing);
  const pick = host.querySelector("[data-pane-pick]");
  if (pick) pick.onchange = () => { if (pick.value) cardPaneChoice.set(c.key, pick.value); else cardPaneChoice.delete(c.key); paintCardTerminal(c); };
  mountTerminal(host, pane, herdrData.panes || [], restore);
}

async function getJson(url) { return (await fetch(url, {cache: "no-store"})).json(); }

async function loadChanges(c, force) {
  const sig = c.tree ? `${c.tree.head}|${c.tree.dirty}|${c.tree.edited}` : "";
  if (!force && git.items && git.sig === sig && Date.now() - git.at < 15000) return;
  git.sig = sig;
  git.at = Date.now();
  try { git.items = await getJson("/api/changes?key=" + enc(c.key)); } catch (e) { return; }
  if (openKey !== c.key || tab2 !== "git") return;
  const it = git.items, pick = it.dirty ? "WORKTREE" : (it.commits[0] || {}).sha;
  if (!git.item && pick) return pickItem(c, pick);
  paintGit(c);
  if (git.item) loadFiles(c);
}

function pickItem(c, ref) {
  git.item = ref;
  git.files = null;
  git.file = null;
  git.diff = "";
  paintGit(c);
  loadFiles(c);
}

async function loadFiles(c) {
  const ref = git.item;
  if (!ref) return;
  try { git.files = await getJson(`/api/files?key=${enc(c.key)}&ref=${enc(ref)}`); } catch (e) { return; }
  if (git.item !== ref || openKey !== c.key) return;
  if (git.file && !git.files.some(f => f.path === git.file)) git.file = null;
  const first = git.files.find(f => f.own !== false);
  if (!git.file && first) return pickFile(c, first.path);
  paintGit(c);
  if (git.file) loadGitDiff(c);
}

function pickFile(c, path) {
  git.file = path;
  git.diff = "";
  paintGit(c);
  const gb = document.querySelector("#g3 .gb");
  if (gb) { gb.scrollTop = 0; gb.scrollLeft = 0; }
  loadGitDiff(c);
}

async function loadGitDiff(c) {
  const ref = git.item, path = git.file;
  if (!ref || !path) return;
  try {
    const t = await (await fetch(`/api/diff?key=${enc(c.key)}&ref=${enc(ref)}&path=${enc(path)}`, {cache: "no-store"})).text();
    if (git.item !== ref || git.file !== path) return;
    git.diff = t;
    paintGit(c);
  } catch (e) {}
}

function paintPanel() {
  const c = openKey && state && state.cards.find(x => x.key === openKey);
  if (!c) return closePanel();
  const p = panel();
  if (!document.getElementById("pbody")) {
    p.innerHTML = '<div id="phead"></div><div class="ptabs" id="ptabs" role="tablist"></div><div class="pbody" id="pbody"></div>';
    bodyKind = "";
  }
  if (setIfChanged("phead", paneHead(c))) {
    document.getElementById("close").onclick = closePanel;
    document.querySelectorAll("#phead [data-wt]").forEach(b => b.onclick = () => { if (b.dataset.wt !== openKey) openCard(b.dataset.wt, true); });
  }
  if (setIfChanged("ptabs", tabsHtml(c))) document.querySelectorAll("#ptabs [data-t]").forEach(b => b.onclick = () => { tab2 = b.dataset.t; paintPanel(); });
  if (tab2 === "terminal") {
    paintCardTerminal(c);
  } else if (tab2 === "git" && c.tree) {
    stopTerminal();
    stopLog();
    paintGit(c);
    loadChanges(c, false);
  } else {
    stopTerminal();
    paintInfo(c);
  }
}

function openCard(key, keepTab = false) {
  if (openKey !== key) git = {...freshGit(), hide1: git.hide1, hide2: git.hide2};
  openKey = key;
  openRun = null;
  showLog = false;
  logSeen = "";
  if (!keepTab) tab2 = "info";
  bodyKind = "";
  panel().innerHTML = "";
  panel().classList.add("open");
  document.documentElement.classList.add("lock");
  paintPanel();
}

function openRunLog(key, id) {
  openCard(key);
  showRunLog(id);
}

function showRunLog(id) {
  openRun = id;
  showLog = true;
  logSeen = "";
  wasLive = false;
  stopLog();
  document.querySelector('#info [data-info-section="runs"]')?.setAttribute("open", "");
  paintPanel();
  document.querySelector("#info .task.open")?.scrollIntoView({block: "nearest"});
}

function closePanel() {
  stopTerminal();
  stopLog();
  openKey = openRun = null;
  showLog = false;
  bodyKind = "";
  git = {...freshGit(), hide1: git.hide1, hide2: git.hide2};
  panel().classList.remove("open");
  panel().innerHTML = "";
  document.documentElement.classList.remove("lock");
}

function sessionHerdrPane(session) {
  const panes = (herdrData && herdrData.panes) || [], owned = (state && state.session_panes) || {};
  const card = (state && state.cards || []).find(c => c.key === session.card);
  const names = [session.name, session.title].filter(Boolean);
  const tab = ((herdrData && herdrData.tabs) || []).find(t => names.includes(t.label) && panes.some(p => p.tab_id === t.tab_id));
  return panes.find(p => p.pane_id === owned[session.id]) || (card && matchedCardPane(card)) || panes.find(p => names.includes(p.title))
    || (tab && panes.find(p => p.tab_id === tab.tab_id)) || null;
}

function openToastTarget(target, session) {
  const pane = view === "herdr" && session ? sessionHerdrPane(session) : null;
  if (pane) { selectedHerdrPane = pane.pane_id; renderHerdrPage(); }
  else if (target) openCard(target);
}

function toast(text, tone, target, session) {
  const t = document.createElement("div");
  t.className = "toast " + tone;
  t.innerHTML = `<button class="toast-x" aria-label="Dismiss notification" title="Dismiss">×</button>${text}`;
  t.querySelector(".toast-x").onclick = event => { event.stopPropagation(); t.remove(); };
  t.onclick = () => { openToastTarget(target, session); t.remove(); };
  document.getElementById("toasts").appendChild(t);
  setTimeout(() => t.remove(), 15000);
}

function notify() {
  const ids = {waiting: new Set(state.waiting.map(s => s.key + s.updated)), still_open: new Set(state.still_open.map(s => s.key + s.updated))};
  if (seen) {
    state.waiting.filter(s => !seen.waiting.has(s.key + s.updated)).forEach(s => toast(`<b>Needs you:</b> ${esc(s.name)}<div class="s">${esc(s.snippet.slice(-140))}</div>`, "", s.card, s));
    state.still_open.filter(s => !seen.still_open.has(s.key + s.updated)).forEach(s => toast(`<b>Stopped:</b> ${esc(s.name)}`, "blue", s.card, s));
  }
  seen = ids;
  const n = state.cards.filter(needsHuman).length;
  document.title = n ? `(${n}) Agents` : "Agents";
}


document.getElementById("newsess").onclick = event => openNewSession(event.currentTarget);
document.getElementById("favsw").onclick = () => {
  favOnly = !favOnly;
  try { localStorage.setItem("fsa-fav-only", favOnly ? "1" : "0"); } catch (e) {}
  render();
};

async function load() {
  try {
    const r = await fetch("/api/state", {cache: "no-store"});
    if (!r.ok) throw new Error(r.status);
    state = await r.json();
    if (uiSeen && state.ui && uiSeen !== state.ui) return location.reload();
    uiSeen = state.ui;
    const meta = document.getElementById("meta");
    meta.title = state.repo;
    meta.className = "status";
    meta.innerHTML = `<span class="dot"></span>${esc(state.repo.split("/").pop())} · ${state.locks.deploy ? '<span class="lock">deploy lock held</span> · ' : ""}${new Date(state.generated * 1000).toLocaleTimeString()}`;
    notify();
    render();
    if (openKey) paintPanel();
    if (view === "herdr" || openKey && tab2 === "terminal") loadHerdr();
  } catch (e) {
    const meta = document.getElementById("meta");
    meta.className = "status error";
    meta.innerHTML = '<span class="dot"></span>offline — retrying';
  }
}

function copyText(text) {
  if (navigator.clipboard && window.isSecureContext) return navigator.clipboard.writeText(text);
  const ta = document.createElement("textarea");
  ta.value = text;
  ta.style.position = "fixed";
  ta.style.opacity = "0";
  (document.querySelector("dialog[open]") || document.body).appendChild(ta);
  ta.select();
  const ok = document.execCommand("copy");
  ta.remove();
  return ok ? Promise.resolve() : Promise.reject(new Error("copy failed"));
}

let out = null, outTimer = null;
const outEl = id => document.getElementById(id);

function outItems() {
  return (sessionOf(out.sid) || {}).agents || [];
}

function paintOutItems() {
  const items = outItems();
  if (!items.some(x => x.id === out.id) && items.length) out.id = items[0].id;
  const cur = items.find(x => x.id === out.id);
  outEl("out-title").textContent = "Subagents and shells · " + ((sessionOf(out.sid) || {}).name || out.sid);
  outEl("out-meta").textContent = cur ? cur.state : "";
  const info = cur && cur.shell ? shellFacts({...cur, sid: out.sid}, cardOfSession(out.sid)) : "";
  const box = outEl("out-info");
  if (box.dataset.html !== info) {
    const wasOpen = box.querySelector("details")?.open;
    box.innerHTML = info;
    box.dataset.html = info;
    if (wasOpen) box.querySelector("details")?.setAttribute("open", "");
  }
  outEl("out-items").innerHTML = items.map(x => `<button data-oid="${esc(x.id)}" aria-pressed="${x.id === out.id}" title="${esc(x.label)}">${x.state === "running" ? '<span class="live-dot"></span>' : ""}${esc(x.label || x.id)}</button>`).join("");
  outEl("out-items").querySelectorAll("[data-oid]").forEach(b => b.onclick = () => { out.id = b.dataset.oid; out.text = null; outEl("out-pre").textContent = "loading…"; paintOutItems(); pollOutput(); });
}

async function pollOutput() {
  if (!out || document.hidden) return;
  const want = {...out};
  try {
    const r = await fetch(`/api/output?sid=${enc(want.sid)}&id=${enc(want.id)}`, {cache: "no-store"});
    const text = r.ok ? await r.text() : r.status === 404 ? "(this subagent is no longer listed)" : `(error ${r.status})`;
    if (!out || out.sid !== want.sid || out.id !== want.id || text === out.text) return;
    const pre = outEl("out-pre"), atEnd = out.text === null || pre.scrollHeight - pre.scrollTop - pre.clientHeight < 40;
    out.text = text;
    pre.textContent = text || "(no output yet)";
    if (atEnd) pre.scrollTop = pre.scrollHeight;
  } catch (e) {}
}

function openAgent(sid, id) {
  out = {sid, id, text: null};
  outEl("out-pre").textContent = "loading…";
  paintOutItems();
  outEl("out").showModal();
  pollOutput();
  clearInterval(outTimer);
  outTimer = setInterval(() => { if (out) { paintOutItems(); pollOutput(); } }, 3000);
}

outEl("out").addEventListener("close", () => { out = null; clearInterval(outTimer); outTimer = null; });
outEl("out-close").onclick = () => outEl("out").close();
outEl("out-copy").onclick = () => {
  const b = outEl("out-copy"), done = label => { b.textContent = label; setTimeout(() => { b.textContent = "Copy"; }, 1500); };
  copyText(outEl("out-pre").textContent).then(() => done("Copied"), () => done("Copy failed"));
};

let ctxCard = null;
const ctx = () => document.getElementById("ctx");

function closeCtx() {
  if (ctx().hidden) return false;
  ctx().hidden = true;
  if (ctxCard && document.contains(ctxCard)) ctxCard.focus();
  ctxCard = null;
  return true;
}

function openCtx(card, x, y) {
  ctxCard = card;
  const m = ctx();
  m.querySelector('[data-act="open"]').disabled = !card.dataset.key;
  const fav = card.querySelector("[data-fav]");
  m.querySelector('[data-act="fav"]').disabled = !fav;
  m.querySelector('[data-act="fav"]').textContent = fav && fav.getAttribute("aria-pressed") === "true" ? "Unmark favourite" : "Mark favourite";
  m.querySelector('[data-act="copy"]').disabled = !card.dataset.sid;
  m.hidden = false;
  m.style.left = Math.max(8, Math.min(x, innerWidth - m.offsetWidth - 8)) + "px";
  m.style.top = Math.max(8, Math.min(y, innerHeight - m.offsetHeight - 8)) + "px";
  const first = m.querySelector("button:not(:disabled)");
  if (first) first.focus();
}

document.addEventListener("contextmenu", e => {
  const box = e.target.closest("[data-herdr-pane-context]");
  const pane = box && herdrData && (herdrData.panes || []).find(x => x.pane_id === box.dataset.herdrPaneContext);
  if (pane) {
    e.preventDefault();
    closeCtx();
    return openHerdrContextMenu("pane", pane, e.clientX, e.clientY, box);
  }
  const card = e.target.closest("#main .card");
  if (!card) return closeCtx();
  e.preventDefault();
  const r = card.getBoundingClientRect();
  openCtx(card, e.clientX || r.left + 12, e.clientY || r.top + 12);
});
document.addEventListener("click", e => { if (!e.target.closest("#ctx")) closeCtx(); });
addEventListener("scroll", closeCtx, true);
addEventListener("resize", closeCtx);
addEventListener("resize", () => updateHerdrTabOverflow(document));
ctx().addEventListener("keydown", e => {
  if (e.key !== "ArrowDown" && e.key !== "ArrowUp") return;
  e.preventDefault();
  const items = [...ctx().querySelectorAll("button:not(:disabled)")], i = items.indexOf(document.activeElement);
  items[(i + (e.key === "ArrowDown" ? 1 : items.length - 1)) % items.length].focus();
});
ctx().addEventListener("click", e => {
  const b = e.target.closest("[data-act]");
  if (!b || b.disabled || !ctxCard) return;
  const card = ctxCard, act = b.dataset.act;
  closeCtx();
  if (act === "open") openCard(card.dataset.key);
  else if (act === "fav") toggleFavourite(card.dataset.key);
  else if (act === "copy") copyText(card.dataset.sid).then(() => toast(`<b>Copied</b> ${esc(card.dataset.sid)}`, "blue"), () => toast("<b>Copy failed</b>", "red"));
});

document.addEventListener("keydown", e => { if (e.key !== "Escape" || out || e.target.closest?.(".terminal")) return; if (closeCtx()) return; if (openRun) toggleTask(openRun); else closePanel(); });
document.querySelectorAll("[data-view]").forEach(b => b.onclick = () => setView(b.dataset.view));
document.addEventListener("visibilitychange", () => { if (!document.hidden && openRun) pollLog(openRun); if (!document.hidden && terminal) pollTerminal(); });
addEventListener("pagehide", stopTerminal);
addEventListener("pageshow", event => {
  if (!event.persisted || terminal) return;
  if (view === "herdr") renderHerdrPage();
  else if (openKey && tab2 === "terminal") paintPanel();
});
setView(view);
load();
setInterval(load, 4000);
