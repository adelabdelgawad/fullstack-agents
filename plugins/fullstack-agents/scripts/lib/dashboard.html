<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Agents</title>
<link rel="stylesheet" href="/static/xterm/xterm.css">
<style>
:root {
  --bg: #f4f5f8; --panel: #ffffff; --card: #ffffff; --card-hover: #f7f8fb; --ink: #1b1d26; --muted: #5d6273; --faint: #8b90a3; --line: #dfe2ea;
  --active: #0b7a99; --pass: #1d7f3e; --changes: #a85a00; --human: #b0246f;
  --amber: #a85a00; --amber-bg: #fff1dd; --blue: #0b7a99; --blue-bg: #e2f3f8;
  --red: #b42318; --red-bg: #fde8e6; --green: #1d7f3e; --green-bg: #e2f4e8; --chip: #eef0f5; --yellow: #a85a00;
  --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #14151b; --panel: #1a1c24; --card: #20222c; --card-hover: #252835; --ink: #e4e5ea; --muted: #9da2b6; --faint: #6c7187; --line: #2b2e3b;
    --active: #8be9fd; --pass: #50fa7b; --changes: #ffb86c; --human: #ff79c6;
    --amber: #ffb86c; --amber-bg: #3a2c16; --blue: #8be9fd; --blue-bg: #18303a;
    --red: #ff8a7f; --red-bg: #43201c; --green: #50fa7b; --green-bg: #173322; --chip: #2a2d3a; --yellow: #ffb86c;
  }
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 14px/1.5 -apple-system, BlinkMacSystemFont, "Inter", "Segoe UI", sans-serif; -webkit-font-smoothing: antialiased; }
.action-button { margin-left: auto; border: 1px solid var(--line); background: var(--panel); color: var(--muted); border-radius: 6px; font-size: 11px; padding: 2px 8px; cursor: pointer; }
.action-button:hover { color: var(--ink); border-color: var(--muted); }
header { display: flex; align-items: baseline; justify-content: space-between; gap: 16px; flex-wrap: wrap; padding: 24px 32px 4px; }
header h1 { margin: 0; font-size: 18px; font-weight: 600; letter-spacing: -0.01em; }
.viewtabs { display: inline-flex; gap: 3px; padding: 3px; border: 1px solid var(--line); border-radius: 8px; background: var(--panel); }
.viewtab { border: 0; border-radius: 5px; padding: 4px 11px; background: none; color: var(--muted); font: inherit; font-weight: 600; cursor: pointer; }
.viewtab[aria-selected="true"] { background: var(--chip); color: var(--ink); }
.status { font-family: var(--mono); font-size: 12px; color: var(--muted); }
.status .dot { display: inline-block; width: 7px; height: 7px; border-radius: 50%; background: var(--pass); margin-right: 6px; vertical-align: 1px; }
.status.error { color: var(--human); }
.status.error .dot { background: var(--human); }
.status .lock { color: var(--changes); }
.hright { display: flex; align-items: center; gap: 16px; flex-wrap: wrap; }
.favsw { display: inline-flex; align-items: center; gap: 8px; border: 0; background: none; color: var(--muted); font: inherit; font-size: 12px; cursor: pointer; padding: 2px 0; }
.favsw[hidden], .newsess[hidden] { display: none; }
.newsess { border: 1px solid var(--line); border-radius: 6px; background: none; color: var(--ink); font: inherit; font-size: 12px; padding: 3px 10px; cursor: pointer; }
.newsess:hover { border-color: var(--ink); }
.favsw:hover { color: var(--ink); }
.favsw:focus-visible { outline: 2px solid var(--active); outline-offset: 2px; border-radius: 4px; }
.favsw .track { position: relative; width: 28px; height: 16px; border-radius: 8px; background: var(--line); transition: background .15s; }
.favsw .track::after { content: ""; position: absolute; top: 2px; left: 2px; width: 12px; height: 12px; border-radius: 50%; background: var(--panel); box-shadow: 0 1px 2px rgba(0,0,0,.3); transition: left .15s; }
.favsw[aria-checked="true"] { color: var(--ink); }
.favsw[aria-checked="true"] .track { background: var(--amber); }
.favsw[aria-checked="true"] .track::after { left: 14px; }
@keyframes pulse { 50% { transform: scale(1.25); } }
@keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: .25; } }
@keyframes breathe { 0%, 100% { opacity: 1; } 50% { opacity: .45; } }
main { padding: 0; }
.board { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 14px; padding: 18px 32px 40px; align-items: start; }
.col { min-width: 0; }
.col-head { display: flex; align-items: baseline; gap: 8px; padding: 0 2px 10px; border-bottom: 1px solid var(--line); margin-bottom: 12px; position: relative; }
.col-head h2 { margin: 0; font-size: 13px; font-weight: 600; white-space: nowrap; }
.col-head .who { font: 11px var(--mono); color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
.col-head .count { margin-left: auto; font: 11px var(--mono); color: var(--muted); }
.col.flow .col-head::after { content: "›"; position: absolute; right: -11px; top: -3px; color: var(--faint); font-size: 16px; }
.col.human .col-head { border-bottom-color: color-mix(in srgb, var(--human) 55%, transparent); }
.col.human h2 { color: var(--human); }
.col .none { color: var(--faint); font-size: 12px; padding: 4px 2px; }
.more { width: 100%; border: 1px dashed var(--line); background: none; color: var(--muted); border-radius: 8px; padding: 6px; font: inherit; font-size: 12px; cursor: pointer; }
.more:hover { color: var(--ink); border-color: var(--muted); }
.board .card { display: flex; flex-direction: column; height: 250px; overflow: hidden; }
.card { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 11px 12px 9px; margin-bottom: 10px; cursor: pointer; transition: background .15s, border-color .15s, transform .15s; }
.card:hover { background: var(--card-hover); transform: translateY(-1px); }
.card:focus-visible { outline: 2px solid var(--active); outline-offset: 2px; }
.card.live { border-color: color-mix(in srgb, var(--active) 40%, var(--line)); }
.card.human { border-color: var(--human); box-shadow: 0 0 0 1px color-mix(in srgb, var(--human) 40%, transparent), 0 8px 24px -12px color-mix(in srgb, var(--human) 60%, transparent); }
.card.quiet:not(:hover):not(:focus-within) { opacity: .72; }
.card-top { display: flex; align-items: center; gap: 7px; margin-bottom: 3px; min-width: 0; }
.card-top .num { font: 11px var(--mono); color: var(--muted); min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.blink { flex: none; width: 7px; height: 7px; border-radius: 50%; background: var(--active); animation: blink 1.6s ease-in-out infinite; }
.star { margin-left: auto; flex: none; border: 0; background: none; padding: 0 2px; font-size: 15px; line-height: 1; color: var(--faint); cursor: pointer; }
.star:hover { color: var(--amber); }
.star:focus-visible { outline: 2px solid var(--active); outline-offset: 1px; border-radius: 4px; }
.star[aria-pressed="true"] { color: var(--amber); }
.flag + .star { margin-left: 0; }
.flag { margin-left: auto; flex: none; font-size: 10px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--human); white-space: nowrap; }
.card .t { font-size: 13px; font-weight: 600; line-height: 1.4; word-break: break-word; }
.card .s { color: var(--muted); font-size: 12px; margin-top: 2px; word-break: break-word; }
.feature { font-size: 13px; line-height: 1.4; margin: 0 0 4px; word-break: break-word; display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 2; overflow: hidden; flex: none; }
.cbody { flex: 1; min-height: 0; overflow: hidden; -webkit-mask-image: linear-gradient(to bottom, #000 calc(100% - 18px), transparent); mask-image: linear-gradient(to bottom, #000 calc(100% - 18px), transparent); }
.cbody > .s { display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 2; overflow: hidden; }
.card > .cardhint, .card > .foot { flex: none; }
.wts { display: grid; gap: 4px; margin-top: 6px; }
.wt { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 6px; width: 100%; min-width: 0; padding: 4px 6px; border: 1px solid var(--line); border-radius: 6px; background: transparent; color: inherit; font: 11px var(--mono); text-align: left; cursor: pointer; }
.wt:hover, .wt:focus-visible, .wt[aria-current="true"] { background: var(--card-hover); border-color: var(--blue); }
.wt .wt-name { flex: 1 1 100%; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.wt .chip { margin: 0; }
.wtbar { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 8px; }
.wtbar .wt { width: auto; max-width: 100%; flex-wrap: nowrap; }
.wtbar .wt .wt-name { flex: 0 1 auto; }
.branch { font: 11px var(--mono); color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.rounds { margin-top: 10px; display: grid; gap: 5px; }
.round { display: grid; gap: 2px; }
.round .rl { display: flex; gap: 6px; font: 10px var(--mono); color: var(--muted); min-width: 0; }
.round .rl b { font-weight: 600; color: var(--ink); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
.round .rl span { flex: none; }
.round .cells { display: flex; gap: 3px; }
.rounds .earlier { font: 10px var(--mono); color: var(--muted); }
.cell { flex: 1; min-width: 0; text-align: center; font: 10px/1.3 var(--mono); padding: 2px 0; border-radius: 4px; border: 1px dashed var(--faint); color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: clip; }
.cell.wait, .cell.live { border-style: solid; border-color: color-mix(in srgb, var(--active) 55%, transparent); color: var(--active); animation: breathe 1.6s ease-in-out infinite; }
.cell.PASS { border: 1px solid transparent; color: var(--pass); background: color-mix(in srgb, var(--pass) 14%, transparent); }
.cell.CHANGES { border: 1px solid transparent; color: var(--changes); background: color-mix(in srgb, var(--changes) 16%, transparent); }
.cell.bad { border: 1px solid var(--human); color: var(--human); }
.cell[role="button"] { cursor: pointer; }
.cell[role="button"]:hover, .cell[role="button"]:focus-visible { text-decoration: underline; outline: 1px solid var(--active); }
.cell.done { border: 1px solid var(--line); color: var(--muted); }
.cell.skip { border: 1px dotted var(--line); color: var(--faint); opacity: .7; }
.cardhint { margin-top: 10px; padding-top: 8px; border-top: 1px solid var(--line); font: 10.5px/1.6 var(--mono); color: var(--muted); overflow-wrap: anywhere; user-select: all; }
.chips { display: flex; gap: 4px; flex-wrap: wrap; margin-top: 6px; }
.chips:empty { display: none; }
.chip { font: 10.5px var(--mono); padding: 1px 6px; border-radius: 4px; background: var(--chip); color: var(--muted); }
.chip.ok { background: color-mix(in srgb, var(--pass) 14%, transparent); color: var(--pass); }
.chip.bad { background: color-mix(in srgb, var(--human) 14%, transparent); color: var(--human); }
.chip.st-working { background: color-mix(in srgb, var(--active) 14%, transparent); color: var(--active); }
.chip.st-stopped { background: none; border: 1px solid var(--line); }
.foot { display: flex; gap: 8px; align-items: center; margin-top: 9px; padding-top: 7px; border-top: 1px solid var(--line); font: 11px var(--mono); color: var(--muted); }
.foot .action-button { font-family: inherit; }
.paths { font: 11px/1.4 var(--mono); color: var(--human); margin-top: 6px; word-break: break-all; }
@media (hover: hover) { .card .foot .action-button { opacity: 0; } .card:hover .foot .action-button, .card:focus-within .foot .action-button { opacity: 1; } }
.row { display: flex; gap: 8px; align-items: center; margin-top: 8px; }
.list { display: grid; gap: 10px; max-width: 980px; }
.list .card { cursor: default; }
.snip { white-space: pre-wrap; margin-top: 6px; font-size: 13px; }
.said-full table.md { border-collapse: collapse; margin: 6px 0; font-size: 12px; }
.said-full table.md th, .said-full table.md td { border: 1px solid var(--line); padding: 3px 6px; text-align: left; vertical-align: top; }
.said-full table.md th { white-space: nowrap; }
.said-full .mdh { font-weight: 600; margin-top: 8px; }
.said-full .mdgap { height: 6px; }
.said-full code { font: 12px var(--mono); }
.docs { max-height: calc(5 * 26px); overflow-y: auto; font-size: 12px; }
.doc { line-height: 26px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.doc .s { margin-left: 4px; }
.copy-ico { vertical-align: middle; margin-left: 4px; padding: 2px 4px; border: 1px solid transparent; border-radius: 4px; background: none; color: var(--muted); cursor: pointer; line-height: 0; }
.copy-ico:hover, .copy-ico:focus-visible { color: var(--ink); border-color: var(--line); }
.copy-ico.ok { color: #2e8b57; }
.said-full { font-size: 13px; line-height: 1.45; margin: 0; max-height: 60vh; overflow: auto; overflow-wrap: anywhere; border-left: 2px solid var(--line); padding-left: 8px; }
.mono { font: 12px ui-monospace, monospace; user-select: all; word-break: break-all; }
.empty { color: var(--muted); padding: 20px 0; }
aside { position: fixed; top: 0; right: 0; bottom: 0; width: min(1280px, 96vw); background: var(--panel); border-left: 1px solid var(--line); display: flex; flex-direction: column; overflow: hidden; transform: translateX(100%); transition: transform .18s, width .18s; z-index: 10; }
aside.open { transform: none; }
html.lock, html.lock body { overflow: hidden; }
html.herdr-page, html.herdr-page body { height: 100%; overflow: hidden; }
html.herdr-page body { display: flex; flex-direction: column; }
html.herdr-page header { flex: none; }
html.herdr-page main { flex: 1; min-height: 0; }
aside h3 { margin: 0 0 4px; font-size: 16px; }
aside h4 { margin: 14px 0 4px; font-size: 12px; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); }
aside pre { background: var(--chip); padding: 10px; border-radius: 8px; white-space: pre-wrap; word-break: break-word; font-size: 12px; max-height: 360px; overflow: auto; }
#phead { flex: none; padding: 16px 18px 6px; }
#phead .close { float: right; }
.ptabs { flex: none; display: flex; gap: 4px; padding: 0 18px; border-bottom: 1px solid var(--line); }
.tab2 { border: 0; background: none; color: var(--muted); font: inherit; padding: 8px 12px; cursor: pointer; border-bottom: 2px solid transparent; display: flex; gap: 6px; align-items: center; }
.tab2[aria-selected="true"] { color: var(--ink); font-weight: 600; border-bottom-color: var(--blue); }
.tab2:disabled { opacity: .4; cursor: default; }
.pbody { flex: 1; min-height: 0; display: flex; flex-direction: column; }
.info-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 320px), 1fr)); gap: 12px; }
.info-card { border: 1px solid var(--line); border-radius: 6px; padding: 12px; min-width: 0; }
.info-card h4 { margin: 0 0 10px; }
.info-card summary { cursor: pointer; font-weight: 600; }
.info-top > summary h4 { display: inline; margin: 0 8px 0 0; }
.info-top[open] > summary { margin-bottom: 10px; }
.info-top.live { grid-column: 1 / -1; }
.live-group { margin-top: 10px; }
.live-group h5 { margin: 0 0 4px; font-size: 12px; display: flex; gap: 6px; align-items: center; }
.live-group .agents { grid-template-columns: repeat(auto-fill, minmax(min(100%, 220px), 1fr)); margin-top: 0; }
.live-group .agent { font-size: 11px; }
.live-lead { margin-bottom: 4px; overflow-wrap: anywhere; }
.live-shells { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 340px), 1fr)); gap: 8px; }
.live-shell { border: 1px solid var(--line); border-radius: 6px; padding: 8px; min-width: 0; font-size: 12px; }
.live-shell.running { border-color: color-mix(in srgb, var(--pass) 60%, transparent); }
.live-shell .ls-head { display: flex; gap: 6px; align-items: baseline; overflow-wrap: anywhere; }
.shell-facts { display: grid; grid-template-columns: max-content 1fr; gap: 2px 10px; margin: 6px 0; font-size: 12px; }
.shell-facts dt { color: var(--muted); }
.shell-facts dd { margin: 0; overflow-wrap: anywhere; font-family: var(--mono); font-size: 11px; }
.ls-actions { display: flex; gap: 6px; flex-wrap: wrap; }
.live-shell details pre, #out-info details pre { max-height: 160px; overflow: auto; font-size: 11px; height: auto; }
.info-card pre { white-space: pre-wrap; overflow-wrap: anywhere; }
.info-facts { display: grid; grid-template-columns: auto 1fr; gap: 6px 12px; }
.info-facts dd { margin: 0; overflow-wrap: anywhere; }
.info-timeline { padding-left: 20px; }
.info-timeline time { font-size: 12px; }
.info-run { margin-top: 12px; }
#info { flex: 1; min-height: 0; overflow: auto; padding: 4px 18px 18px; }
.tasks { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
.task { display: grid; grid-template-columns: 18px 1fr; gap: 2px 8px; align-items: start; padding: 10px; border: 1px solid var(--line); border-radius: 10px; cursor: pointer; background: var(--panel); }
.task:hover { border-color: var(--muted); }
.task input { margin: 3px 0 0; }
.task .tn { font-weight: 600; }
.task .tg { grid-column: 2; margin-top: 2px; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
.steps { list-style: none; margin: 0; padding: 0; display: grid; gap: 4px; }
.steps li { display: grid; grid-template-columns: 22px 1fr; gap: 0 6px; font-size: 13px; }
.steps .mk { font-weight: 700; text-align: center; color: var(--muted); }
.steps .active .mk, .steps .active .tx { color: var(--blue); font-weight: 600; }
.steps .done .mk { color: var(--green); }
.steps .skipped .tx { text-decoration: line-through; color: var(--muted); }
.steps .nt { grid-column: 2; color: var(--muted); font-size: 12px; }
.now { border: 1px solid var(--line); border-radius: 10px; padding: 10px; display: grid; gap: 4px; margin-bottom: 8px; }
.now .lbl { color: var(--muted); font-size: 11px; text-transform: uppercase; letter-spacing: .04em; margin-top: 4px; }
.card .act { font: 11px/1.4 var(--mono); color: var(--muted); margin-top: 6px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.card .act.run { color: var(--ink); }
.card .say { font-size: 12px; line-height: 1.4; margin-top: 6px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.task .th { cursor: pointer; display: flex; flex-wrap: wrap; align-items: center; gap: 6px; }
.task .caret { margin-left: auto; color: var(--muted); }
.task .tg { cursor: pointer; }
.task .detail { grid-column: 1 / -1; margin-top: 8px; cursor: default; }
.task .detail pre { margin: 6px 0 0; max-height: 220px; }
aside .task .detail pre.log { max-height: 260px; font-size: 11px; }
.endbar { display: flex; justify-content: flex-end; margin-top: 10px; padding-top: 8px; border-top: 3px solid var(--line); }
.endbar.ok { border-top-color: var(--green); }
.endbar.bad { border-top-color: var(--red); }
.endbar.live { border-top-color: var(--blue); }
.endbar .action-button { margin-left: 0; }
.card .br { font: 11px/1.3 ui-monospace, SFMono-Regular, Menlo, monospace; color: var(--blue); margin-top: 3px; word-break: break-all; }
.gitview { flex: 1; min-height: 0; display: flex; }
.gcol { display: flex; flex-direction: column; min-width: 0; min-height: 0; border-right: 1px solid var(--line); }
.g1, .g2 { flex: 0 0 20%; }
.g3 { flex: 1; border-right: 0; }
.g1.hid, .g2.hid { flex: 0 0 30px; }
.gh { flex: none; display: flex; align-items: center; justify-content: space-between; gap: 6px; padding: 8px 10px; border-bottom: 1px solid var(--line); }
.gh .gt { font-weight: 600; font-size: 12px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
.gh .action-button { margin-left: 0; flex: none; }
.gb { flex: 1; min-height: 0; overflow: auto; }
.rail { flex: 1; border: 0; background: none; color: var(--muted); cursor: pointer; font-size: 16px; }
.rail:hover { background: var(--chip); color: var(--ink); }
.grp { display: flex; align-items: center; gap: 6px; width: 100%; text-align: left; border: 0; background: var(--chip); color: var(--ink); font: inherit; font-weight: 600; font-size: 12px; padding: 6px 10px; cursor: pointer; position: sticky; top: 0; z-index: 1; }
.gi, .gf { display: block; width: 100%; text-align: left; border: 0; background: none; color: inherit; font: inherit; padding: 6px 10px; border-bottom: 1px solid var(--line); cursor: pointer; }
.gi:hover, .gf:hover { background: var(--chip); }
.gi.on, .gf.on { background: var(--blue-bg); }
.gi .sha { font: 11px ui-monospace, SFMono-Regular, Menlo, monospace; color: var(--blue); margin-right: 6px; }
.gi .sub, .gf .fd { display: block; color: var(--muted); font-size: 11px; word-break: break-all; }
.gf .fn { font: 12px ui-monospace, SFMono-Regular, Menlo, monospace; word-break: break-all; }
.st { display: inline-block; min-width: 16px; text-align: center; font: 700 11px ui-monospace, SFMono-Regular, Menlo, monospace; border-radius: 4px; margin-right: 6px; background: var(--chip); }
.st-A, .st-U { color: var(--green); }
.st-D { color: var(--red); }
.st-M, .st-R { color: var(--amber); }
aside .gcol pre.diff { margin: 0; border-radius: 0; background: none; padding: 0; white-space: pre; font: 11px/1.45 ui-monospace, SFMono-Regular, Menlo, monospace; max-height: none; overflow: visible; min-width: max-content; }
.diff span { display: block; padding: 0 10px; }
.diff .a { color: var(--green); background: var(--green-bg); }
.diff .d { color: var(--red); background: var(--red-bg); }
.diff .h { color: var(--blue); }
.hint { color: var(--muted); padding: 14px 10px; font-size: 12px; }
.herdr-view, #card-terminal {

  };
  const s = {bold: false, dim: false, italic: false, underline: false, inverse: false, fg: "", bg: ""};
  const reset = () => Object.assign(s, {bold: false, dim: false, italic: false, underline: false, inverse: false, fg: "", bg: ""});
  const style = () => {
    let fg = s.fg, bg = s.bg;
    if (s.inverse) [fg, bg] = [bg || "#e8e8e8", fg || "#101218"];
    return [s.bold && "font-weight:bold", s.dim && "opacity:.65", s.italic && "font-style:italic", s.underline && "text-decoration:underline", fg && `color:${fg}`, bg && `background-color:${bg}`].filter(Boolean).join(";");
  };
  const sgr = raw => {
    const codes = raw === "" ? [0] : raw.split(";").map(x => Number(x || 0));
    for (let i = 0; i < codes.length; i++) {
      const c = codes[i];
      if (c === 0) reset();
      else if (c === 1) s.bold = true;
      else if (c === 2) s.dim = true;
      else if (c === 3) s.italic = true;
      else if (c === 4) s.underline = true;
      else if (c === 7) s.inverse = true;
      else if (c === 22) s.bold = s.dim = false;
      else if (c === 23) s.italic = false;
      else if (c === 24) s.underline = false;
      else if (c === 27) s.inverse = false;
      else if (c >= 30 && c <= 37) s.fg = basic[c - 30];
      else if (c >= 90 && c <= 97) s.fg = bright[c - 90];
      else if (c >= 40 && c <= 47) s.bg = basic[c - 40];
      else if (c >= 100 && c <= 107) s.bg = bright[c - 100];
      else if (c === 39) s.fg = "";
      else if (c === 49) s.bg = "";
      else if ((c === 38 || c === 48) && codes[i + 1] === 5 && Number.isInteger(codes[i + 2])) { s[c === 38 ? "fg" : "bg"] = indexed(Math.max(0, Math.min(255, codes[i + 2]))); i += 2; }
      else if ((c === 38 || c === 48) && codes[i + 1] === 2 && i + 4 < codes.length && codes.slice(i + 2, i + 5).every(Number.isFinite)) { s[c === 38 ? "fg" : "bg"] = `rgb(${codes.slice(i + 2, i + 5).map(x => Math.max(0, Math.min(255, x))).join(",")})`; i += 4; }
    }
  };
  const text = String(input ?? "").replace(/\x1b\][\s\S]*?(?:\x07|\x1b\\|$)/g, "");
  const csi = /\x1b\[([0-?]*)([ -\/]*)([@-~])/g;
  let out = "", at = 0, m;
  const add = part => { if (!part) return; const css = style(); out += css ? `<span style="${css}">${esc(part)}</span>` : esc(part); };
  while ((m = csi.exec(text))) { add(text.slice(at, m.index)); if (m[3] === "m" && !m[2]) sgr(m[1]); at = csi.lastIndex; }
  add(text.slice(at));
  return out.replace(/\x1b/g, "");
}

const statusMeta = status => ({
  working: {icon: "●", word: "working"}, blocked: {icon: "●", word: "blocked"}, done: {icon: "●", word: "done"},
  idle: {icon: "○", word: "idle"}, unknown: {icon: "·", word: "unknown"},
}[status] || {icon: "·", word: "unknown"});

const statusHtml = status => {
  const meta = statusMeta(status);
  return `<span class="herdr-status herdr-status-${esc(meta.word)}" title="${esc(meta.word)}">${esc(meta.icon)}</span>`;
};

function terminalHtml(pane, panes, pickMessage) {
  const options = (panes || []).map(x => `<option value="${esc(x.pane_id)}" ${pane && x.pane_id === pane.pane_id ? "selected" : ""}>${esc(x.title || x.pane_id)}</option>`).join("");
  const pick = pickMessage ? `<div class="terminal-pick">${esc(pickMessage)} ${options ? `<label>Pick a pane <select data-pane-pick><option value="">—</option>${options}</select></label>` : ""}</div>` : "";
  if (!pane) return `<div class="terminal">${pick || '<div class="hint">No Herdr panes are available.</div>'}</div>`;
  return `<div class="terminal" data-terminal-pane="${esc(pane.pane_id)}">${pick}
    <div class="terminal-head"><span class="terminal-pane-title"> ${esc(pane.title || pane.pane_id)} </span><span class="chip st-${esc(pane.status)}">${esc(pane.status)}</span><div class="terminal-source"><button data-mode="live" aria-pressed="true">Live</button><button data-mode="history" aria-pressed="false">History</button><button data-attach aria-label="Attach files" title="Attach files: their paths are typed into the session">+</button><input type="file" multiple hidden data-attach-input></div></div>
    <div class="terminal-screen-box" data-herdr-pane-context="${esc(pane.pane_id)}"><div class="terminal-live"></div><div class="terminal-drop" aria-hidden="true"><span>+</span><b>Drop to attach</b></div><div class="terminal-disconnected" hidden><div class="terminal-blocked"><span data-terminal-reason></span><button data-takeover>take over</button></div></div><pre class="terminal-screen" tabindex="0" hidden>loading…</pre><button class="terminal-jump" hidden>New output — jump to latest</button></div>
    <div class="terminal-caption"><span data-terminal-status>live · connecting</span><span data-terminal-reconnect hidden><button data-reconnect>reconnect</button><button data-takeover>take over</button></span></div>
    <div class="terminal-error" aria-live="polite"></div></div>`;
}

function stopTerminal() {
  clearInterval(terminalTimer);
  terminalTimer = null;
  if (terminal) disposeLiveTerminal(terminal);
  terminal = null;
}

function terminalFocusSelector(root) {
  const active = document.activeElement;
  if (!active || !root.contains(active)) return null;
  if (terminal && terminal.root === root && terminal.term?.textarea === active) return "live";
  for (const selector of [".terminal-screen", ".terminal-jump", "[data-pane-pick]"])
    if (active.matches(selector)) return selector;
  for (const attr of ["mode"]) {
    const value = active.getAttribute(`data-${attr}`);
    if (value !== null) return `[data-${attr}="${value}"]`;
  }
  return null;
}

function terminalSnapshot() {
  if (!terminal || !document.contains(terminal.root)) return null;
  const pre = terminal.root.querySelector(".terminal-screen");
  return {pane: terminal.pane, mode: terminal.mode, text: terminal.text, hash: terminal.hash, pending: terminal.pending, scroll: pre.scrollTop,
    atEnd: pre.scrollHeight - pre.scrollTop - pre.clientHeight < 40, focus: terminalFocusSelector(terminal.root)};
}

function terminalCanStay(pane, panes) {
  return pane && terminal && terminal.pane === pane.pane_id && document.contains(terminal.root);
}

function updateTerminalStatus(pane) {
  const chip = terminal && terminal.root.querySelector(".terminal-head .chip");
  if (!chip || !pane) return;
  chip.className = `chip st-${pane.status}`;
  chip.textContent = pane.status;
}

const terminalAtEnd = pre => pre.scrollHeight - pre.scrollTop - pre.clientHeight < 40;

function setTerminalPending(current, text) {
  current.pending = text;
  current.root.querySelector(".terminal-jump").hidden = text === null;
}

function applyTerminalText(current, text) {
  const pre = current.root.querySelector(".terminal-screen");
  current.text = text;
  setTerminalPending(current, null);
  pre.innerHTML = ansiHtml(text) || "&nbsp;";
  pre.scrollTop = pre.scrollHeight;
}

function updateTerminalCaption(current) {
  if (current.mode === "history") current.root.querySelector("[data-terminal-status]").textContent = "Showing the last 1000 lines from herdr";
}

async function pollTerminal() {
  const current = terminal;
  if (!current || document.hidden || !document.contains(current.root)) return;
  if (current.mode !== "history") return;
  if (current.polling) { current.pollAgain = true; return; }
  current.polling = true;
  const source = "recent";
  try {
    const since = current.hash ? `&since=${enc(current.hash)}` : "";
    const r = await fetch(`/api/herdr/screen?pane=${enc(current.pane)}&source=${enc(source)}${since}`, {cache: "no-store"});
    if (terminal !== current || current.mode !== "history" || !document.contains(current.root)) return;
    const hash = r.headers.get("X-Screen-Hash");
    if (hash) current.hash = hash;
    if (r.status === 204) return;
    const text = await r.text();
    if (terminal !== current || current.mode !== "history" || !document.contains(current.root)) return;
    if (!r.ok) throw new Error(text || `screen error ${r.status}`);
    current.root.querySelector(".terminal-error").textContent = "";
    const pre = current.root.querySelector(".terminal-screen");
    if (text === current.text && current.pending === null) return;
    if (current.text === null || terminalAtEnd(pre)) applyTerminalText(current, text);
    else setTerminalPending(current, text);
  } catch (e) {
    if (terminal === current && current.mode === "history" && document.contains(current.root))
      current.root.querySelector(".terminal-error").textContent = e.message || "Could not read the pane";
  } finally {
    if (terminal === current) {
      current.polling = false;
      if (current.pollAgain) { current.pollAgain = false; pollTerminal(); }
    }
  }
}

const terminalBytes64 = bytes => {
  let binary = "";
  for (let i = 0; i < bytes.length; i += 0x8000) binary += String.fromCharCode(...bytes.subarray(i, i + 0x8000));
  return btoa(binary);
};

const terminalBase64Bytes = value => Uint8Array.from(atob(value), c => c.charCodeAt(0));

const LIVE_UPLOAD_MAX_BYTES = 50 * 1024 * 1024;

function focusTerminalAfterAttach(current) {
  if (terminal !== current || !document.contains(current.root)) return;
  (current.mode === "live" ? current.term : current.root.querySelector(".terminal-screen"))?.focus();
}

function showTerminalStatus(current, message, resetAfter = 0) {
  if (terminal !== current || !document.contains(current.root)) return;
  clearTimeout(current.imageStatusTimer);
  current.imageStatus = message;
  current.root.querySelector("[data-terminal-status]").textContent = message;
  if (resetAfter) current.imageStatusTimer = setTimeout(() => {
    if (terminal !== current || !document.contains(current.root) || current.imageStatus !== message) return;
    current.imageStatus = "";
    current.imageStatusTimer = null;
    if (current.mode === "history") updateTerminalCaption(current);
    else if (current.session) liveTerminalStatus(current, null);
  }, resetAfter);
}

async function attachLiveFiles(current, files) {
  if (terminal !== current || current.mode !== "live" || !current.session || !current.term) {
    showTerminalStatus(current, "connect live to attach files");
    focusTerminalAfterAttach(current);
    return;
  }
  if (files.some(file => file.size > LIVE_UPLOAD_MAX_BYTES)) {
    showTerminalStatus(current, "file is too large (50 MB maximum)");
    focusTerminalAfterAttach(current);
    return;
  }
  const session = current.session, paths = [];
  showTerminalStatus(current, files.length === 1 ? `uploading ${files[0].name}…` : `uploading ${files.length} files…`);
  try {
    for (const file of files) {
      const response = await fetch(`/api/herdr/live/file?session=${enc(session)}&name=${enc(file.name || "file")}`, {method: "POST", headers: {"Content-Type": "application/octet-stream"}, body: file});
      if (!response.ok) throw new Error((await response.text()) || `upload failed (${response.status})`);
      const data = await response.json();
      if (!data.ok || typeof data.path !== "string") throw new Error("invalid upload response");
      paths.push(data.path);
    }
    if (terminal !== current || current.mode !== "live" || current.session !== session || !current.term) {
      showTerminalStatus(current, "connect live to attach files");
      return;
    }
    current.term.paste(paths.join(" ") + " ");
    showTerminalStatus(current, paths.length === 1 ? "file attached" : `${paths.length} files attached`, 2000);
  } catch (error) {
    if (terminal !== current || current.mode !== "live" || current.session !== session || !current.term)
      showTerminalStatus(current, "connect live to attach files");
    else showTerminalStatus(current, error.message || "upload failed");
  } finally {
    focusTerminalAfterAttach(current);
  }
}

function mountTerminalCopy(current) {
  const host = current.root.querySelector(".terminal-live"), history = current.root.querySelector(".terminal-screen");
  const copy = (text, restore) => { if (text && text.trim()) copySelection(text, restore); };
  host.addEventListener("mouseup", () => setTimeout(() => {
    if (terminal !== current || !current.term?.hasSelection()) return;
    copy(current.term.getSelection(), () => current.term.focus());
  }));
  history.addEventListener("mouseup", () => setTimeout(() => {
    const selection = getSelection();
    if (!selection.rangeCount || !history.contains(selection.anchorNode)) return;
    const range = selection.getRangeAt(0).cloneRange();
    copy(selection.toString(), () => { selection.removeAllRanges(); selection.addRange(range); });
  }));
}

function terminalSelection(current) {
  if (current.mode === "live") return current.term?.hasSelection() ? current.term.getSelection() : "";
  const selection = getSelection(), history = current.root.querySelector(".terminal-screen");
  return selection.rangeCount && history?.contains(selection.anchorNode) ? selection.toString() : "";
}

async function copySelection(text, restore) {
  let ok = false;
  try { ok = await writeClipboard(text); } catch (err) { ok = false; }
  if (restore) restore();
  showHerdrToast(ok ? "Copied" : "Copy failed");
}

function mountTerminalFiles(current) {
  const host = current.root.querySelector(".terminal-live"), history = current.root.querySelector(".terminal-screen"), box = current.root.querySelector(".terminal-screen-box");
  const picker = current.root.querySelector("[data-attach-input]");
  const pasteFile = event => {
    const files = [...(event.clipboardData?.items || [])].filter(entry => entry.kind === "file").map(entry => entry.getAsFile()).filter(Boolean);
    if (!files.length) return;
    event.preventDefault();
    event.stopPropagation();
    attachLiveFiles(current, files);
  };
  host.addEventListener("paste", pasteFile, true);
  history.addEventListener("paste", pasteFile, true);
  current.root.querySelector("[data-attach]").onclick = () => picker.click();
  picker.onchange = () => {
    const files = [...picker.files];
    picker.value = "";
    if (files.length) attachLiveFiles(current, files);
  };
  const hasFiles = event => [...(event.dataTransfer?.types || [])].includes("Files");
  box.addEventListener("dragover", event => {
    if (!hasFiles(event)) return;
    event.preventDefault();
    event.dataTransfer.dropEffect = "copy";
    box.classList.add("file-drag-over");
  });
  box.addEventListener("dragleave", event => {
    if (!event.relatedTarget || !box.contains(event.relatedTarget)) box.classList.remove("file-drag-over");
  });
  box.addEventListener("drop", event => {
    box.classList.remove("file-drag-over");
    const files = [...(event.dataTransfer?.files || [])];
    if (!files.length) return;
    event.preventDefault();
    event.stopPropagation();
    attachLiveFiles(current, files);
  });
}

function postLiveTerminal(current, body) {
  if (!current.session || terminal !== current) return Promise.resolve();
  const session = current.session, epoch = current.liveEpoch;
  current.postChain = current.postChain.then(async () => {
    if (current.liveEpoch !== epoch || terminal !== current) return;
    const response = await fetch("/api/herdr/live/input", {method: "POST", headers: {"Content-Type": "application/json"}, body: JSON.stringify({session, ...body}), signal: current.postAbort?.signal});
    if (!response.ok) throw new Error((await response.text()) || `terminal input error ${response.status}`);
    if (terminal === current && current.liveEpoch === epoch) current.root.querySelector(".terminal-error").textContent = "";
  }).catch(error => {
    if (error.name !== "AbortError" && terminal === current && current.liveEpoch === epoch) current.root.querySelector(".terminal-error").textContent = error.message || "Could not write to the pane";
  });
  return current.postChain;
}

function flushTerminalInput(current) {
  current.inputFrame = 0;
  if (!current.session || !current.inputQueue.length || current.inputSending) return;
  const size = current.inputQueue.reduce((sum, bytes) => sum + bytes.length, 0), joined = new Uint8Array(size);
  let offset = 0;
  current.inputQueue.forEach(bytes => { joined.set(bytes, offset); offset += bytes.length; });
  current.inputQueue.length = 0;
  current.inputSending = true;
  postLiveTerminal(current, {type: "input", bytes: terminalBytes64(joined)}).finally(() => {
    current.inputSending = false;
    if (current.inputQueue.length) flushTerminalInput(current);
  });
}

function queueTerminalInput(current, bytes) {
  current.inputQueue.push(bytes);
  if (!current.inputFrame) current.inputFrame = requestAnimationFrame(() => flushTerminalInput(current));
}

function liveTerminalStatus(current, reason) {
  const status = current.root.querySelector("[data-terminal-status]"), actions = current.root.querySelector("[data-terminal-reconnect]");
  if (reason === null) {
    status.textContent = current.imageStatus || `live · ${current.term.cols}×${current.term.rows}`;
    actions.hidden = true;
    current.root.querySelector(".terminal-disconnected").hidden = true;
  } else {
    clearTimeout(current.imageStatusTimer);
    current.imageStatus = "";
    current.imageStatusTimer = null;
    status.textContent = `${reason} · ${current.term.cols}×${current.term.rows}`;
    current.root.querySelector("[data-terminal-reason]").textContent = /already has an attached client/.test(reason)
      ? "This pane is open live in another view" : reason;
    actions.hidden = false;
    current.root.querySelector(".terminal-disconnected").hidden = false;
  }
}

function closeLiveStream(current) {
  current.liveEpoch += 1;
  current.postAbort?.abort();
  current.postAbort = null;
  clearTimeout(current.reconnectTimer);
  current.reconnectTimer = null;
  if (current.stream) current.stream.close();
  current.stream = null;
  current.session = null;
}

function disposeLiveTerminal(current) {
  closeLiveStream(current);
  clearTimeout(current.resizeTimer);
  clearTimeout(current.imageStatusTimer);
  current.imageStatus = "";
  current.imageStatusTimer = null;
  if (current.inputFrame) cancelAnimationFrame(current.inputFrame);
  current.inputFrame = 0;
  current.inputQueue.length = 0;
  current.postChain = Promise.resolve();
  current.resizeObserver?.disconnect();
  current.liveDisposables?.forEach(disposable => disposable.dispose());
  current.liveDisposables = [];
  current.term?.dispose();
  current.term = current.fit = null;
}

function openLiveStream(current, takeover = false) {
  closeLiveStream(current);
  current.postAbort = new AbortController();
  current.postChain = Promise.resolve();
  const cols = current.term.cols, rows = current.term.rows;
  current.root.querySelector("[data-terminal-status]").textContent = `live · connecting · ${cols}×${rows}`;
  current.root.querySelector("[data-terminal-reconnect]").hidden = true;
  current.root.querySelector(".terminal-disconnected").hidden = false;
  const stream = new EventSource(`/api/herdr/live?pane=${enc(current.pane)}&cols=${cols}&rows=${rows}${takeover ? "&takeover=1" : ""}`);
  current.stream = stream;
  stream.addEventListener("ready", event => {
    if (terminal !== current || current.stream !== stream) return;
    try { current.session = JSON.parse(event.data).session; } catch (e) { return liveTerminalClosed(current, "Invalid terminal session"); }
    liveTerminalStatus(current, null);
    flushTerminalInput(current);
    const active = document.activeElement;
    if (!active || active === document.body || active.matches(".tab2, [data-pane-pick], .herdr-tab, .herdr-agent, [data-mode]")) current.term.focus();
  });
  stream.addEventListener("frame", event => {
    if (terminal !== current || current.stream !== stream) return;
    try { current.term.write(terminalBase64Bytes(JSON.parse(event.data).bytes)); }
    catch (e) { liveTerminalClosed(current, "Invalid terminal frame"); }
  });
  stream.addEventListener("closed", event => {
    if (terminal !== current || current.stream !== stream) return;
    let reason = "Terminal closed";
    try { reason = JSON.parse(event.data).reason || reason; } catch (e) {}
    liveTerminalClosed(current, reason);
  });
  stream.onerror = () => {
    if (terminal === current && current.stream === stream) liveTerminalClosed(current, "Connection closed");
  };
}

function liveTerminalClosed(current, reason) {
  closeLiveStream(current);
  liveTerminalStatus(current, reason);
  if (!current.autoRetried && !/ownership|owner|conflict|already.*control|in use/i.test(reason)) {
    current.autoRetried = true;
    current.reconnectTimer = setTimeout(() => { if (terminal === current && current.mode === "live") openLiveStream(current); }, 2000);
  }
}

function startLiveTerminal(current, restoreFocus = false) {
  const host = current.root.querySelector(".terminal-live"), box = current.root.querySelector(".terminal-screen-box");
  current.root.querySelector(".terminal-screen").hidden = true;
  current.root.querySelector(".terminal-jump").hidden = true;
  host.hidden = false;
  current.autoRetried = false;
  if (!window.Terminal || !window.FitAddon?.FitAddon) return liveTerminalStatus(current, "Terminal assets unavailable");
  const css = getComputedStyle(current.root), colour = name => css.getPropertyValue(name).trim();
  current.term = new window.Terminal({scrollback: 0, fontFamily: getComputedStyle(document.documentElement).getPropertyValue("--mono").trim(), fontSize: 12, cursorBlink: true, theme: {
    background: colour("--herdr-panel-bg"), foreground: colour("--herdr-text"), cursor: colour("--herdr-accent"), selectionBackground: colour("--herdr-selection-bg"),
    black: "#282c34", red: "#e06c75", green: "#98c379", yellow: "#e5c07b", blue: "#61afef", magenta: "#c678dd", cyan: "#56b6c2", white: "#abb2bf",
    brightBlack: "#5c6370", brightRed: "#e06c75", brightGreen: "#98c379", brightYellow: "#e5c07b", brightBlue: "#61afef", brightMagenta: "#c678dd", brightCyan: "#56b6c2", brightWhite: "#ffffff"
  }});
  current.fit = new window.FitAddon.FitAddon();
  current.term.loadAddon(current.fit);
  current.term.attachCustomKeyEventHandler(event => {
    if (event.code !== "KeyX" || !event.ctrlKey || event.shiftKey || event.altKey || event.metaKey) return true;
    event.preventDefault();
    if (event.type === "keydown") queueTerminalInput(current, Uint8Array.of(0x17));
    return false;
  });
  current.term.open(host);
  current.fit.fit();
  current.liveDisposables = [
    current.term.onData(data => queueTerminalInput(current, new TextEncoder().encode(data))),
    current.term.onBinary(data => queueTerminalInput(current, Uint8Array.from(data, char => char.charCodeAt(0) & 255)))
  ];
  current.term.attachCustomWheelEventHandler(event => {
    if (!event.deltaY) return false;
    postLiveTerminal(current, {type: "scroll", direction: event.deltaY < 0 ? "up" : "down", lines: Math.max(1, Math.round(Math.abs(event.deltaY) / 40))});
    return false;
  });
  let dimensions = `${current.term.cols}x${current.term.rows}`;
  current.resizeObserver = new ResizeObserver(() => {
    if (terminal !== current || current.mode !== "live") return;
    current.fit.fit();
    const next = `${current.term.cols}x${current.term.rows}`;
    if (next === dimensions) return;
    dimensions = next;
    if (current.session) liveTerminalStatus(current, null);
    else current.root.querySelector("[data-terminal-status]").textContent = `live · connecting · ${current.term.cols}×${current.term.rows}`;
    clearTimeout(current.resizeTimer);
    current.resizeTimer = setTimeout(() => postLiveTerminal(current, {type: "resize", cols: current.term.cols, rows: current.term.rows}), 100);
  });
  current.resizeObserver.observe(box);
  box.onclick = () => { if (terminal === current && current.mode === "live") current.term.focus(); };
  openLiveStream(current);
  if (restoreFocus) current.term.focus();
}

function switchTerminalMode(current, mode, restoreFocus = false) {
  if (terminal !== current) return;
  if (current.started && current.mode === mode) {
    if (restoreFocus) (mode === "live" ? current.term : current.root.querySelector(".terminal-screen"))?.focus();
    return;
  }
  clearInterval(terminalTimer);
  terminalTimer = null;
  clearTimeout(current.imageStatusTimer);
  current.imageStatus = "";
  current.imageStatusTimer = null;
  if (current.mode === "live" && mode !== "live") disposeLiveTerminal(current);
  current.mode = mode;
  current.root.querySelectorAll("[data-mode]").forEach(button => button.setAttribute("aria-pressed", String(button.dataset.mode === mode)));
  const history = current.root.querySelector(".terminal-screen"), host = current.root.querySelector(".terminal-live");
  if (mode === "live") {
    startLiveTerminal(current, restoreFocus);
  } else {
    host.hidden = true;
    history.hidden = false;
    current.root.querySelector(".terminal-disconnected").hidden = true;
    current.root.querySelector("[data-terminal-reconnect]").hidden = true;
    updateTerminalCaption(current);
    pollTerminal();
    terminalTimer = setInterval(pollTerminal, 1500);
    if (restoreFocus) history.focus();
  }
  current.started = true;
}

function mountTerminal(container, pane, panes, restore) {
  stopTerminal();
  const root = container.querySelector(".terminal[data-terminal-pane]");
  if (!root || !pane) return;
  const old = restore && restore.pane === pane.pane_id ? restore : null;
  terminal = {root, pane: pane.pane_id, mode: old ? old.mode : "live",
    text: old ? old.text : null, hash: old ? old.hash : null, pending: old ? old.pending : null, polling: false, pollAgain: false,
    term: null, fit: null, stream: null, session: null, resizeObserver: null, resizeTimer: null, reconnectTimer: null,
    autoRetried: false, inputQueue: [], inputFrame: 0, postChain: Promise.resolve(), postAbort: null, liveEpoch: 0, liveDisposables: [],
    imageStatus: "", imageStatusTimer: null, started: false};
  if (old) {
    const pre = root.querySelector(".terminal-screen");
    pre.innerHTML = ansiHtml(old.text) || "&nbsp;";
    pre.scrollTop = old.atEnd ? pre.scrollHeight : old.scroll;
    root.querySelector(".terminal-jump").hidden = old.pending === null;
  }
  const pre = root.querySelector(".terminal-screen");
  const jump = root.querySelector(".terminal-jump");
  const applyPending = () => { if (terminal && terminal.root === root && terminal.pending !== null) applyTerminalText(terminal, terminal.pending); };
  jump.onclick = applyPending;
  pre.onscroll = () => { if (terminal && terminal.root === root && terminal.pending !== null && terminalAtEnd(pre)) applyPending(); };
  root.querySelectorAll("[data-mode]").forEach(button => button.onclick = () => switchTerminalMode(terminal, button.dataset.mode, true));
  root.querySelector("[data-reconnect]").onclick = () => { if (terminal?.root !== root || !terminal.term) return; terminal.autoRetried = true; openLiveStream(terminal); terminal.term.focus(); };
  root.querySelectorAll("[data-takeover]").forEach(button => button.onclick = () => { if (terminal?.root !== root || !terminal.term) return; terminal.autoRetried = true; openLiveStream(terminal, true); terminal.term.focus(); });
  mountTerminalFiles(terminal);
  mountTerminalCopy(terminal);
  switchTerminalMode(terminal, terminal.mode, old?.focus === "live");
  if (old?.focus && old.focus !== "live") root.querySelector(old.focus)?.focus();
}

function followNewHerdrTab(data) {
  const panes = data.panes || [], seen = herdrKnownTabs;
  const ready = (data.tabs || []).filter(tab => panes.some(pane => pane.tab_id === tab.tab_id));
  herdrKnownTabs = data.running ? new Set(ready.map(tab => tab.tab_id)) : null;
  const fresh = seen ? ready.filter(tab => !seen.has(tab.tab_id)).pop() : null;
  if (fresh) selectedHerdrPane = panes.find(pane => pane.tab_id === fresh.tab_id).pane_id;
}

async function loadHerdr(force = false) {
  if (herdrLoading) {
    if (!force) return herdrLoading;
    await herdrLoading;
  }
  herdrLoading = fetch("/api/herdr", {cache: "no-store"}).then(r => {
    if (!r.ok) throw new Error(r.status);
    return r.json();
  }).then(data => { herdrData = data; followNewHerdrTab(data); }).catch(() => {
    herdrData = {running: false, workspaces: [], tabs: [], panes: [], focused_pane_id: null};
  }).finally(() => {
    herdrLoading = null;
    if (view === "herdr") renderHerdrPage();
    if (openKey && tab2 === "terminal") paintPanel();
  });
  return herdrLoading;
}

const workspaceStatus = panes => {
  const priority = {unknown: 0, idle: 1, working: 2, done: 3, blocked: 4};
  return (panes || []).reduce((best, pane) => (priority[pane.status] ?? 0) > priority[best] ? pane.status : best, "unknown");
};

function herdrErrorMessage(error) {
  const text = typeof error === "string" ? error : JSON.stringify(error || "");
  try {
    const parsed = JSON.parse(text);
    return parsed?.error?.message || parsed?.message || text || "Herdr action failed";
  } catch (e) {
    return text || "Herdr action failed";
  }
}

function setHerdrError(message, ownerRoot = null) {
  herdrActionError = herdrErrorMessage(message);
  document.querySelectorAll(".herdr-page-error").forEach(x => x.textContent = herdrActionError);
  ownerRoot?.querySelectorAll(".herdr-modal-error").forEach(x => x.textContent = herdrActionError);
}

async function herdrAction(action, params = {}, ownerRoot = null) {
  herdrActionError = "";
  document.querySelectorAll(".herdr-page-error").forEach(x => x.textContent = "");
  ownerRoot?.querySelectorAll(".herdr-modal-error").forEach(x => x.textContent = "");
  let data;
  try {
    const response = await fetch("/api/herdr/action", {method: "POST", headers: {"Content-Type": "application/json"}, body: JSON.stringify({action, ...params})});
    data = response.headers.get("Content-Type")?.includes("application/json") ? await response.json() : {ok: false, error: await response.text()};
    if (!response.ok || !data.ok) setHerdrError(data.error || `Herdr action failed (${response.status})`, ownerRoot);
  } catch (error) {
    data = {ok: false, error: error.message || "Herdr action failed"};
    setHerdrError(data.error, ownerRoot);
  }
  await loadHerdr(true);
  return data;
}

function closeHerdrOverlay(restoreFocus = true) {
  if (!herdrOverlay) return false;
  const {root, returnFocus} = herdrOverlay;
  herdrOverlay = null;
  root.remove();
  if (restoreFocus && returnFocus && document.contains(returnFocus)) returnFocus.focus();
  return true;
}

function positionHerdrMenu(menu, x, y) {
  menu.style.left = Math.max(8, Math.min(x, innerWidth - menu.offsetWidth - 8)) + "px";
  menu.style.top = Math.max(8, Math.min(y, innerHeight - menu.offsetHeight - 8)) + "px";
}

function openHerdrMenu(items, x, y, returnFocus, above = false) {
  closeHerdrOverlay(false);
  const menu = document.createElement("div");
  menu.className = "herdr-menu";
  menu.setAttribute("role", "menu");
  menu.innerHTML = items.map((item, index) => `<button role="menuitem" data-herdr-menu-item="${index}" ${item.disabled ? `disabled title="${esc(item.title || "")}"` : ""}>${esc(item.label)}</button>`).join("");
  document.body.appendChild(menu);
  herdrOverlay = {root: menu, type: "menu", returnFocus};
  positionHerdrMenu(menu, x, above ? y - menu.offsetHeight : y);
  const enabled = () => [...menu.querySelectorAll("button:not(:disabled)")];
  const select = button => {
    menu.querySelectorAll("button").forEach(x => x.classList.toggle("herdr-menu-selected", x === button));
    button?.focus();
  };
  menu.onclick = event => {
    const button = event.target.closest("[data-herdr-menu-item]");
    if (!button || button.disabled) return;
    const item = items[Number(button.dataset.herdrMenuItem)];
    closeHerdrOverlay(false);
    item.run();
  };
  menu.onkeydown = event => {
    const buttons = enabled();
    if (event.key === "Escape") { event.preventDefault(); event.stopPropagation(); closeHerdrOverlay(); return; }
    if (event.key === "Enter") { event.preventDefault(); document.activeElement?.click(); return; }
    if (!buttons.length || !["ArrowDown", "ArrowUp"].includes(event.key)) return;
    event.preventDefault();
    const at = buttons.indexOf(document.activeElement);
    select(buttons[(at + (event.key === "ArrowDown" ? 1 : buttons.length - 1)) % buttons.length]);
  };
  select(enabled()[0]);
}

function herdrModal(html, returnFocus, onSubmit) {
  closeHerdrOverlay(false);
  const backdrop = document.createElement("div");
  backdrop.className = "herdr-modal-backdrop";
  backdrop.innerHTML = `<div class="herdr-modal" role="dialog" aria-modal="true">${html}</div>`;
  document.body.appendChild(backdrop);
  herdrOverlay = {root: backdrop, type: "modal", returnFocus};
  const form = backdrop.querySelector("form");
  form.onsubmit = event => { event.preventDefault(); onSubmit(form); };
  backdrop.querySelector("[data-herdr-cancel]").onclick = () => closeHerdrOverlay();
  backdrop.querySelector("input, select, button")?.focus();
  return backdrop;
}

function openHerdrPrompt(title, value, action, params, returnFocus) {
  const root = herdrModal(`<form><h2>${esc(title)}</h2><label>name<input name="label" value="${esc(value)}" maxlength="80" autocomplete="off"></label><div class="herdr-modal-error" aria-live="polite"></div><div class="herdr-modal-actions"><button type="button" data-herdr-cancel>cancel</button><button type="submit" class="primary">save</button></div></form>`, returnFocus, async form => {
    const label = form.elements.label.value;
    if (!label || label.length > 80 || label.startsWith("-")) { setHerdrError('Name must be 1–80 characters and not start with "-"', root); return; }
    const button = form.querySelector('[type="submit"]');
    button.disabled = true;
    const result = await herdrAction(action, {...params, label}, root);
    button.disabled = false;
    if (result.ok && herdrOverlay?.root === root) { closeHerdrOverlay(false); renderHerdrPage(); }
  });
  const input = root.querySelector("input");
  input.select();
}

function openHerdrConfirm(title, detail, action, params, returnFocus) {
  const root = herdrModal(`<form><h2>${esc(title)}</h2><p class="herdr-modal-detail">${esc(detail)}</p><div class="herdr-modal-error" aria-live="polite"></div><div class="herdr-modal-actions"><button type="submit" class="danger">close</button><button type="button" data-herdr-cancel>cancel</button></div></form>`, returnFocus, async form => {
    const button = form.querySelector('[type="submit"]');
    button.disabled = true;
    const result = await herdrAction(action, params, root);
    button.disabled = false;
    if (result.ok && herdrOverlay?.root === root) { closeHerdrOverlay(false); renderHerdrPage(); }
  });
}

async function openNewSession(returnFocus) {
  if (!herdrData) await loadHerdr();
  const workspaces = herdrData.workspaces || [];
  if (!herdrData.running || !workspaces.length) {
    herdrModal('<form><h2>new session</h2><p class="herdr-modal-note">herdr is not running or has no spaces</p><div class="herdr-modal-actions"><button type="button" data-herdr-cancel>close</button></div></form>', returnFocus, () => closeHerdrOverlay());
    return;
  }
  const focused = (herdrData.panes || []).find(x => x.pane_id === herdrData.focused_pane_id);
  const current = (focused || {}).workspace_id || workspaces[0].workspace_id;
  const options = workspaces.map(x => `<option value="${esc(x.workspace_id)}" ${x.workspace_id === current ? "selected" : ""}>${esc(x.label || x.workspace_id)}</option>`).join("");
  const root = herdrModal(`<form><h2>new session</h2><label>name<input name="name" maxlength="80" autocomplete="off" required></label><label>space<select name="space">${options}</select></label><p class="herdr-modal-note">Opens a new tab in the space and runs cc -n '&lt;name&gt;'</p><div class="herdr-modal-error" aria-live="polite"></div><div class="herdr-modal-actions"><button type="button" data-herdr-cancel>cancel</button><button type="submit" class="primary">start</button></div></form>`, returnFocus, async form => {
    const name = form.elements.name.value.trim();
    if (!name || name.length > 80 || name.startsWith("-")) { setHerdrError('Name must be 1–80 characters and not start with "-"', root); return; }
    const button = form.querySelector('[type="submit"]');
    button.disabled = true;
    button.textContent = "starting…";
    const result = await herdrAction("session.create", {workspace_id: form.elements.space.value, name}, root);
    button.disabled = false;
    button.textContent = "start";
    if (result.ok && herdrOverlay?.root === root) closeHerdrOverlay();
  });
}

function openStartAgent(pane, returnFocus) {
  const kinds = herdrData.agent_kinds || [];
  const kind = kinds.includes("claude") ? "claude" : kinds[0] || "claude";
  const options = (kinds.length ? kinds : [kind]).map(x => `<option value="${esc(x)}" ${x === kind ? "selected" : ""}>${esc(x)}</option>`).join("");
  const root = herdrModal(`<form><h2>start agent</h2><label>kind<select name="kind">${options}</select></label><label>name<input name="name" value="${esc(kind)}" maxlength="80" autocomplete="off"></label><p class="herdr-modal-note">The pane must be at a shell prompt</p><div class="herdr-modal-error" aria-live="polite"></div><div class="herdr-modal-actions"><button type="button" data-herdr-cancel>cancel</button><button type="submit" class="primary">start</button></div></form>`, returnFocus, async form => {
    const button = form.querySelector('[type="submit"]');
    const name = form.elements.name.value;
    if (!name || name.length > 80 || name.startsWith("-")) { setHerdrError('Name must be 1–80 characters and not start with "-"', root); return; }
    button.disabled = true;
    button.textContent = "starting…";
    const selectedKind = form.elements.kind.value;
    const result = await herdrAction("agent.start", {pane_id: pane.pane_id, kind: selectedKind, name}, root);
    button.disabled = false;
    button.textContent = "start";
    if (result.ok && herdrOverlay?.root === root) { closeHerdrOverlay(false); renderHerdrPage(); }
    else {
      const errorText = typeof result.error === "string" ? result.error : JSON.stringify(result.error || "");
      if (errorText.includes("agent_not_ready") && herdrOverlay?.root === root) {
        herdrActionError = "";
        document.querySelectorAll(".herdr-page-error").forEach(x => x.textContent = "");
        closeHerdrOverlay(false);
        selectedHerdrPane = pane.pane_id;
        renderHerdrPage();
        showHerdrToast(`${selectedKind} started — waiting for input in the pane`);
      }
    }
  });
  const select = root.querySelector("select"), input = root.querySelector("input");
  select.onchange = () => { if (!input.value || input.value === kind || kinds.includes(input.value)) input.value = select.value; };
}

function showHerdrToast(message) {
  document.querySelector(".herdr-copy-toast")?.remove();
  const toast = document.createElement("div");
  toast.className = "herdr-copy-toast";
  toast.innerHTML = `<span class="dot">●</span><b>${esc(message)}</b>`;
  document.body.appendChild(toast);
  setTimeout(() => toast.remove(), 1800);
}

function openHerdrGlobalMenu(button) {
  const rect = button.getBoundingClientRect();
  openHerdrMenu([
    {label: "settings", disabled: true, title: "Available in the herdr terminal"},
    {label: "keybinds", disabled: true, title: "Available in the herdr terminal"},
    {label: "reload config", run: async () => { const result = await herdrAction("server.reload_config"); if (result.ok) showHerdrToast("config reloaded"); }},
    {label: "detach", disabled: true, title: "Available in the herdr terminal"},
  ], rect.left, rect.top, button, true);
}

function openHerdrContextMenu(kind, record, x, y, returnFocus) {
  const panes = herdrData.panes || [], tabs = herdrData.tabs || [];
  let items;
  if (kind === "workspace") {
    const count = panes.filter(x => x.workspace_id === record.workspace_id).length;
    items = [
      {label: "Rename", run: () => openHerdrPrompt("rename workspace", record.label || record.workspace_id, "workspace.rename", {workspace_id: record.workspace_id}, returnFocus)},
      {label: "Close", run: () => openHerdrConfirm("Close workspace?", `${record.label || record.workspace_id} — ${count} ${count === 1 ? "pane" : "panes"}`, "workspace.close", {workspace_id: record.workspace_id}, returnFocus)},
    ];
  } else if (kind === "tab") {
    const count = panes.filter(x => x.tab_id === record.tab_id).length;
    const number = tabs.filter(x => x.workspace_id === record.workspace_id).length + 1;
    items = [
      {label: "New tab", run: () => openHerdrPrompt("new tab", String(number), "tab.create", {workspace_id: record.workspace_id}, returnFocus)},
      {label: "Rename", run: () => openHerdrPrompt("rename tab", record.label || `Tab ${record.number}`, "tab.rename", {tab_id: record.tab_id}, returnFocus)},
      {label: "Close", run: () => openHerdrConfirm("Close tab?", `${record.label || `Tab ${record.number}`} — ${count} ${count === 1 ? "pane" : "panes"}`, "tab.close", {tab_id: record.tab_id}, returnFocus)},
    ];
  } else {
    const focused = herdrData.focused_pane_id;
    const selected = terminal && terminal.pane === record.pane_id ? terminalSelection(terminal) : "";
    items = [
      ...(selected ? [{label: "Copy", run: () => copySelection(selected)}] : []),
      ...(paneSaid(record.pane_id) ? [{label: "Copy last message", run: () => copyPaneSaid(record.pane_id)}] : []),
      {label: "Rename pane", run: () => openHerdrPrompt("rename pane", record.title || record.agent || record.pane_id, "pane.rename", {pane_id: record.pane_id}, returnFocus)},
      {label: "Clear pane name", run: () => herdrAction("pane.clear_name", {pane_id: record.pane_id})},
      ...(focused && focused !== record.pane_id ? [{label: "Swap with focused pane", run: () => herdrAction("pane.swap", {source_pane_id: record.pane_id, target_pane_id: focused})}] : []),
      {label: "Split right", run: () => herdrAction("pane.split", {pane_id: record.pane_id, direction: "right"})},
      {label: "Split down", run: () => herdrAction("pane.split", {pane_id: record.pane_id, direction: "down"})},
      {label: "Zoom", run: () => herdrAction("pane.zoom", {pane_id: record.pane_id})},
      {label: "Start agent…", run: () => openStartAgent(record, returnFocus)},
      {label: "Close pane", run: () => openHerdrConfirm("Close pane?", record.title || record.agent || record.pane_id, "pane.close", {pane_id: record.pane_id}, returnFocus)},
    ];
  }
  openHerdrMenu(items, x, y, returnFocus);
}

function herdrSidebarHtml(data, panes, selectedPane) {
  const tabs = data.tabs || [], focused = data.focused_pane_id;
  const workspaces = (data.workspaces || []).map(workspace => {
    const items = panes.filter(pane => pane.workspace_id === workspace.workspace_id);
    const target = items.find(pane => pane.pane_id === focused) || items[0];
    const selected = items.some(pane => pane.pane_id === selectedPane);
    return `<button class="herdr-workspace" data-herdr-pane="${esc((target || {}).pane_id || "")}" data-herdr-context="workspace" data-herdr-workspace-id="${esc(workspace.workspace_id)}" aria-selected="${selected}">${statusHtml(workspaceStatus(items))}<span class="workspace-label">${esc(workspace.label || workspace.workspace_id)}</span></button>`;
  }).join("");
  const agents = panes.filter(pane => pane.agent).map(pane => {
    const workspace = (data.workspaces || []).find(item => item.workspace_id === pane.workspace_id);
    const tab = tabs.find(item => item.tab_id === pane.tab_id);
    const meta = statusMeta(pane.status);
    return `<button class="herdr-agent" data-herdr-pane="${esc(pane.pane_id)}" data-herdr-context="pane" aria-selected="${pane.pane_id === selectedPane}" title="${esc(meta.word)}"><span class="agent-context">${statusHtml(pane.status)} <span>${esc((workspace || {}).label || pane.workspace_id)}</span><span class="agent-separator"> · </span><span class="agent-tab">${esc((tab || {}).label || `Tab ${(tab || {}).number || ""}`.trim())}</span></span><span class="agent-name">${esc(pane.title || pane.agent)}</span></button>`;
  }).join("");
  return `<div class="herdr-sidebar-edge" aria-hidden="true">│</div><section class="herdr-sidebar-section herdr-spaces"><div class="herdr-section-title"><span> spaces</span></div><div class="herdr-sidebar-rows">${workspaces}</div><footer class="herdr-sidebar-footer"><button data-herdr-action="workspace.create"> new</button><button data-herdr-global-menu>menu</button></footer></section><div class="herdr-sidebar-divider" role="separator" aria-label="Resize spaces and agents">${"─".repeat(25)}</div><section class="herdr-sidebar-section herdr-agents"><div class="herdr-section-title"><span> agents</span><span>grouped </span></div><div class="herdr-sidebar-rows">${agents}</div></section>`;
}

function herdrTabsHtml(data, panes, selectedPane) {
  const pane = panes.find(item => item.pane_id === selectedPane);
  const tabs = (data.tabs || []).filter(tab => pane && tab.workspace_id === pane.workspace_id).map(tab => {
    const members = panes.filter(item => item.tab_id === tab.tab_id), first = members[0], label = tab.label || `Tab ${tab.number}`;
    const selected = tab.tab_id === pane.tab_id;
    return `<div class="herdr-tab" role="tab" tabindex="${selected ? 0 : -1}" title="${esc(label)}" data-herdr-pane="${esc((first || {}).pane_id || "")}" data-herdr-context="tab" data-herdr-tab-id="${esc(tab.tab_id)}" aria-selected="${selected}" ${first ? "" : 'aria-disabled="true"'}><span class="herdr-tab-sep" aria-hidden="true"></span>${statusHtml(workspaceStatus(members))}<span class="herdr-tab-title">${esc(label)}</span><button class="herdr-tab-close" data-herdr-close-tab="${esc(tab.tab_id)}" tabindex="-1" aria-label="Close ${esc(label)}" title="Close tab">×</button></div>`;
  }).join("");
  const add = pane ? `<button class="herdr-tab-new" data-herdr-new-tab="${esc(pane.workspace_id)}" aria-label="New tab" title="New tab">+</button>` : "";
  return `<div class="herdr-tabs" role="tablist" aria-label="Workspace tabs">${tabs}${add}</div>`;
}

function updateHerdrTabOverflow(root) {
  root.querySelector('.herdr-tab[aria-selected="true"]')?.scrollIntoView({block: "nearest", inline: "nearest"});
}

function closeHerdrTab(tabId, returnFocus) {
  const tab = (herdrData.tabs || []).find(x => x.tab_id === tabId);
  if (!tab) return;
  const count = (herdrData.panes || []).filter(x => x.tab_id === tabId).length;
  openHerdrConfirm("Close tab?", `${tab.label || `Tab ${tab.number}`} — ${count} ${count === 1 ? "pane" : "panes"}`, "tab.close", {tab_id: tabId}, returnFocus);
}

function applyHerdrSidebarRatio(root) {
  const list = root.querySelector(".herdr-list");
  if (list) list.style.gridTemplateRows = `minmax(0, ${herdrSidebarRatio}fr) auto minmax(0, ${1 - herdrSidebarRatio}fr)`;
}

function herdrChromeSnapshot(root) {
  const active = document.activeElement;
  let focus = null;
  if (root.contains(active)) {
    if (active.matches(".herdr-workspace")) focus = ["workspace", active.dataset.herdrWorkspaceId];
    else if (active.matches(".herdr-agent")) focus = ["pane", active.dataset.herdrPane];
    else if (active.matches(".herdr-tab")) focus = ["tab", active.dataset.herdrTabId];
    else if (active.matches('[data-herdr-action="workspace.create"]')) focus = ["new", ""];
    else if (active.matches("[data-herdr-global-menu]")) focus = ["menu", ""];
  }
  return {scroll: [...root.querySelectorAll(".herdr-sidebar-rows")].map(x => x.scrollTop), focus};
}

function restoreHerdrChrome(root, snapshot) {
  root.querySelectorAll(".herdr-sidebar-rows").forEach((x, index) => { x.scrollTop = snapshot.scroll[index] || 0; });
  if (!snapshot.focus) return;
  const [kind, id] = snapshot.focus;
  const target = kind === "workspace" ? [...root.querySelectorAll(".herdr-workspace")].find(x => x.dataset.herdrWorkspaceId === id)
    : kind === "pane" ? [...root.querySelectorAll(".herdr-agent")].find(x => x.dataset.herdrPane === id)
      : kind === "tab" ? [...root.querySelectorAll(".herdr-tab")].find(x => x.dataset.herdrTabId === id)
        : root.querySelector(kind === "new" ? '[data-herdr-action="workspace.create"]' : "[data-herdr-global-menu]");
  target?.focus();
}

function wireHerdrPicks(root) {
  root.querySelectorAll("[data-herdr-pane]").forEach(button => button.onclick = () => {
    if (!button.dataset.herdrPane) return;
    selectedHerdrPane = button.dataset.herdrPane;
    renderHerdrPage();
  });
  root.querySelector('[data-herdr-action="workspace.create"]')?.addEventListener("click", event => herdrAction("workspace.create"));
  root.querySelectorAll("[data-herdr-close-tab]").forEach(button => button.onclick = event => {
    event.stopPropagation();
    closeHerdrTab(button.dataset.herdrCloseTab, button.closest(".herdr-tab"));
  });
  root.querySelectorAll(".herdr-tab").forEach(tab => {
    tab.onauxclick = event => { if (event.button === 1) { event.preventDefault(); closeHerdrTab(tab.dataset.herdrTabId, tab); } };
    tab.onmousedown = event => { if (event.button === 1) event.preventDefault(); };
    tab.onkeydown = event => {
      if (event.key === "Enter" || event.key === " ") { event.preventDefault(); tab.click(); return; }
      if (event.key !== "ArrowRight" && event.key !== "ArrowLeft") return;
      const all = [...root.querySelectorAll(".herdr-tab")], next = all[(all.indexOf(tab) + (event.key === "ArrowRight" ? 1 : all.length - 1)) % all.length];
      event.preventDefault();
      next?.focus();
    };
  });
  root.querySelectorAll("[data-herdr-new-tab]").forEach(button => button.onclick = () => {
    const workspace = button.dataset.herdrNewTab, number = (herdrData.tabs || []).filter(x => x.workspace_id === workspace).length + 1;
    openHerdrPrompt("new tab", String(number), "tab.create", {workspace_id: workspace}, button);
  });
  const globalMenu = root.querySelector("[data-herdr-global-menu]");
  if (globalMenu) globalMenu.onclick = () => openHerdrGlobalMenu(globalMenu);
  root.querySelectorAll("[data-herdr-context]").forEach(target => target.oncontextmenu = event => {
    event.preventDefault();
    const kind = target.dataset.herdrContext;
    const record = kind === "workspace"
      ? (herdrData.workspaces || []).find(x => x.workspace_id === target.dataset.herdrWorkspaceId)
      : kind === "tab"
        ? (herdrData.tabs || []).find(x => x.tab_id === target.dataset.herdrTabId)
        : (herdrData.panes || []).find(x => x.pane_id === target.dataset.herdrPane);
    if (record) openHerdrContextMenu(kind, record, event.clientX, event.clientY, target);
  });
  const divider = root.querySelector(".herdr-sidebar-divider"), list = root.querySelector(".herdr-list");
  if (divider && list) divider.onpointerdown = event => {
    event.preventDefault();
    herdrDragging = true;
    divider.setPointerCapture?.(event.pointerId);
    const move = pointer => {
      const rect = list.getBoundingClientRect(), usable = Math.max(1, rect.height - divider.offsetHeight);
      herdrSidebarRatio = Math.max(.1, Math.min(.9, (pointer.clientY - rect.top - divider.offsetHeight / 2) / usable));
      applyHerdrSidebarRatio(root);
    };
    const done = () => {
      herdrDragging = false;
      divider.onpointermove = divider.onpointerup = divider.onpointercancel = null;
      try { localStorage.setItem("fsa-herdr-sidebar-ratio", String(herdrSidebarRatio)); } catch (e) {}
    };
    divider.onpointermove = move;
    divider.onpointerup = divider.onpointercancel = done;
  };
  applyHerdrSidebarRatio(root);
}

function renderHerdrPage() {
  if (view !== "herdr") return;
  const main = document.getElementById("main");
  if (!herdrData) {
    stopTerminal();
    main.innerHTML = '<div class="hint">Loading Herdr…</div>';
    loadHerdr();
    return;
  }
  if (!herdrData.running) {
    stopTerminal();
    main.innerHTML = '<div class="empty" style="padding:24px 32px">herdr is not running on this server</div>';
    return;
  }
  const panes = herdrData.panes || [];
  if (!panes.some(x => x.pane_id === selectedHerdrPane)) selectedHerdrPane = herdrData.focused_pane_id || (panes[0] || {}).pane_id || null;
  const pane = panes.find(x => x.pane_id === selectedHerdrPane) || null;
  const sidebar = herdrSidebarHtml(herdrData, panes, selectedHerdrPane);
  const tabs = herdrTabsHtml(herdrData, panes, selectedHerdrPane);
  const list = main.querySelector(".herdr-list");
  if (list && (herdrOverlay || herdrDragging)) {
    updateTerminalStatus(pane);
    return;
  }
  if (list && terminalCanStay(pane, panes) && main.querySelector(".herdr-detail")?.contains(terminal.root)) {
    const chrome = herdrChromeSnapshot(main);
    list.innerHTML = sidebar;
    const tabsRoot = main.querySelector(".herdr-tabs");
    if (tabsRoot) tabsRoot.outerHTML = tabs;
    wireHerdrPicks(main);
    updateHerdrTabOverflow(main);
    restoreHerdrChrome(main, chrome);
    updateTerminalStatus(pane);
    return;
  }
  const restore = terminalSnapshot();
  stopTerminal();
  main.innerHTML = `<div class="herdr-view"><nav class="herdr-list" aria-label="Herdr panes">${sidebar}</nav><section class="herdr-main">${tabs}<div class="herdr-detail">${terminalHtml(pane, panes, "")}</div></section><div class="herdr-page-error" aria-live="polite">${esc(herdrActionError)}</div></div>`;
  wireHerdrPicks(main);
  updateHerdrTabOverflow(main);
  mountTerminal(main.querySelector(".herdr-detail"), pane, panes, restore);
}

const ago = t => { const s = Math.max(0, Date.now()/1000 - t); return s < 90 ? `${Math.round(s)}s` : s < 5400 ? `${Math.round(s/60)}m` : s < 172800 ? `${Math.round(s/3600)}h` : `${Math.round(s/86400)}d`; };
const chip = c => { const good = /^(GREEN|PASS)$/.test(c.verdict), bad = /^(RED|CHANGES)$/.test(c.verdict); return `<span class="chip ${good ? "ok" : bad ? "bad" : ""}" title="${esc(c.label)}">${esc(c.kind)} ${esc(c.verdict)}</span>`; };
